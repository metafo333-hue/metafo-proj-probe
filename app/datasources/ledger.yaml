# 数据源台账 · 多域 catalog v2
# probe 数据来源铁律 第2条 + 标准19:每个源上线前逐项过 gate19,status=active 才被 registry 放行。
# schema 每源必填字段:
#   domain       - 信息域 D1-D14
#   access_type  - free | paid | free_with_key | paid_with_key
#   method       - L(本地库) / S(搜索) / W(网络请求) / O(官方API) / D(数据库)
#   authority_score - 1-10 权威度
#   freshness    - realtime / daily / weekly / static
#   cost         - "免费" 或价格说明
#   license      - 数据使用许可
#   status       - live | pending | cataloged | rejected
#     live      = 模块已写、可调用、无需 key 或 key 已配
#     pending   = 可用但待 key（如 TikHub 待 PROBE_TIKHUB_KEY）
#     cataloged = 已登记占位、模块待实现
#     rejected  = 明确拒用

version: 9   # v9: +J医药赛道(D18域·5源cataloged占位·SOP实跑验证·零成本可回滚)
updated: "2026-06-13"

# ── 17 信息域定义 ──────────────────────────────────────────────────────────
# D1  真相核查 / 事实核验
# D2  内容结构拆解
# D3  视觉 / 多模态分析
# D4  出处溯源 / 归因
# D5  竞品横评 / 同题对比
# D6  发布者 / 账号画像
# D7  二创路径（借换串）
# D8  法规 / 合规 / 安全
# D9  地域 / 受众适配
# D10 学术 / 科研基础
# D11 企业 / 财务情报
# D12 开源 / 技术情报
# D13 金融行情 / 市场数据（行情/K线/汇率/利率/链上/衍生品/基金净值）
# D14 宏观 / 政策 / 监管（宏观指标/央行/政策法规/监管处罚/经济日历）
# D15 促销与优惠 / 价格情报（商品价格/历史价/券/折扣/返利/大促日历）   ← v5 · G 元惠
# D16 任务与激励 / 任务系统（平台任务/签到/悬赏/众包/激励规则）        ← v5 · H 任务
# D17 AI 优惠与扶持（免费额度/credits/创业扶持/算力/黑客松·GitHub-First）  ← v5 · I AI优惠

domains:
  D1: "真相核查 / 事实核验"
  D2: "内容结构拆解"
  D3: "视觉 / 多模态分析"
  D4: "出处溯源 / 归因"
  D5: "竞品横评 / 同题对比"
  D6: "发布者 / 账号画像"
  D7: "二创路径（借换串）"
  D8: "法规 / 合规 / 安全"
  D9: "地域 / 受众适配"
  D10: "学术 / 科研基础"
  D11: "企业 / 财务情报"
  D12: "开源 / 技术情报"
  D13: "金融行情 / 市场数据"
  D14: "宏观 / 政策 / 监管"
  D15: "促销与优惠 / 价格情报（商品价格/历史价/券/折扣/返利/大促日历）"      # v5 新增 · 喂 G 元惠
  D16: "任务与激励 / 任务系统（平台任务/签到/悬赏/众包/激励规则）"            # v5 新增 · 喂 H 任务
  D17: "AI 优惠与扶持（免费额度/credits/创业扶持/算力/黑客松）"               # v5 新增 · 喂 I AI优惠
  D18: "医药与健康 / 药械情报（药品审批/批准文号/临床试验/不良事件/说明书/药企管线）"  # v6 新增 · 喂 J 医药

# ── 10 赛道注册表 (track registry v1.1 · 详见 docs/3-build/probe-track-registry-architecture) ──
# type: horizontal(通用业务域) | vertical(垂直旗舰道) · tier: standard | flagship
# verify_profile: 该赛道的合规门 profile(见 docs/3-build/probe-compliance-gates)
tracks:
  A-selfmedia: { type: horizontal, tier: standard, weight: 50, status: active,    intent: 内容情报, domains: [D6, D7, D8] }
  B-business:  { type: horizontal, tier: standard, weight: 50, status: building,   intent: 商业情报, domains: [D5, D9, D3] }
  C-diligence: { type: horizontal, tier: standard, weight: 55, status: building,   intent: 风控情报, domains: [D4, D6] }
  D-research:  { type: horizontal, tier: standard, weight: 50, status: building,   intent: 调研情报, domains: [D1, D5, D2] }
  E-verify:    { type: horizontal, tier: standard, weight: 50, status: building,   intent: 核查情报, domains: [D1, D3, D6] }
  F-finance:   { type: vertical,   tier: flagship, weight: 90, status: incubating, intent: 投资,    owned: [D11, D13, D14], shared: [D1, D5], verify_profile: finance-8gate }
  G-deal:      { type: vertical,   tier: flagship, weight: 85, status: incubating, intent: 省钱,    owned: [D15], shared: [D9], verify_profile: deal-compliance-gate }
  H-task:      { type: vertical,   tier: flagship, weight: 80, status: incubating, intent: 搞钱,    owned: [D16], shared: [D6], verify_profile: task-compliance-gate }
  I-aideal:    { type: vertical,   tier: flagship, weight: 82, status: incubating, intent: AI资源,  owned: [D17], shared: [D12], verify_profile: ai-deal-gate }
  J-pharma:    { type: vertical,   tier: flagship, weight: 72, status: incubating, intent: 医药情报, owned: [D18], shared: [D8, D10, D11, D14], verify_profile: pharma-compliance-gate }  # v6 · weight=客单22+频次16+合规可控14+护城河20

