# probe.metafoclaw.com · metafoclaw 母体首个远程镶嵌工具
# 部署在 tencent-sh nginx（公网唯一入口）· 反代 uvicorn + 静态成品
# http{} 块需加：limit_req_zone $binary_remote_addr zone=probe_api:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name probe.metafoclaw.com;

    # 通配证书 *.metafoclaw.com（certbot / 阿里云/腾讯云 DV）
    # ssl_certificate     /etc/nginx/ssl/metafoclaw.com.crt;
    # ssl_certificate_key /etc/nginx/ssl/metafoclaw.com.key;

    # L1 契约 API → uvicorn（异步任务走 task 轮询，不长连阻塞）
    location /api {
        limit_req zone=probe_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # /api/v1/health 公开放行（L1 健康检查·JWT 豁免显式注册）
    location = /api/v1/health { proxy_pass http://127.0.0.1:8080; }

    # 成品下载（MVP=本地存储；生产=MinIO/OSS 预签名）· TTL 即用即抛
    location /files {
        alias /var/probe/storage/;
        expires 24h;
        add_header Cache-Control "private";
    }

    # 落地页（GEO / 大厅导流）· 预留
    location / {
        return 200 'probe · 链接情报 · metafoclaw\n';
        add_header Content-Type "text/plain; charset=utf-8";
    }
}

# 80 → 443
server {
    listen 80;
    server_name probe.metafoclaw.com;
    return 301 https://$host$request_uri;
}
