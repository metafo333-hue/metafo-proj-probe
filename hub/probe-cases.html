<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元探 · 案例库 MetaProbe Cases</title>
<style>
/* ============================================================
   破晓品牌配色 & 全局重置
   ============================================================ */
:root {
  --blue:        #1E3A8A;
  --blue-light:  #3B5FC0;
  --blue-bg:     #EFF6FF;
  --orange:      #FF7A1A;
  --orange-bg:   #FFF3E0;
  --green:       #066C37;
  --green-bg:    #F0FDF4;
  --red:         #B91C1C;
  --red-bg:      #FEF2F2;
  --text-dark:   #1E293B;
  --text-gray:   #475569;
  --text-muted:  #94A3B8;
  --border:      #CBD5E1;
  --bg:          #F8FAFC;
  --white:       #FFFFFF;
  --sidebar-w:   220px;
  --drawer-w:    560px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  color: var(--text-dark);
  background: var(--bg);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ============================================================
   顶部 Header
   ============================================================ */
#header {
  background: var(--blue);
  color: #fff;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(30,58,138,.4);
  z-index: 100;
}

#header h1 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .5px;
}

#header .subtitle {
  font-size: 11px;
  opacity: .7;
  margin-top: 1px;
}

#header-stats {
  display: flex;
  gap: 16px;
  align-items: center;
}

.stat-chip {
  background: rgba(255,255,255,.15);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.stat-chip span {
  opacity: .75;
  font-weight: 400;
}

#filter-count {
  font-size: 11px;
  opacity: .85;
  background: rgba(255,255,255,.1);
  border-radius: 12px;
  padding: 3px 10px;
  white-space: nowrap;
}

/* ============================================================
   主体布局：侧边栏 + 内容区
   ============================================================ */
#layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── 左侧边栏 ── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  padding: 16px 12px;
  gap: 20px;
}

.sidebar-section label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .8px;
  margin-bottom: 6px;
}

.search-wrapper {
  position: relative;
}
.search-shortcut {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: var(--text-muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  pointer-events: none;
}

#search-input {
  width: 100%;
  padding: 8px 36px 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-dark);
  outline: none;
  transition: border-color .2s;
}
#search-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(30,58,138,.1); }

#sort-select, #version-select {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-dark);
  background: var(--white);
  outline: none;
  cursor: pointer;
  transition: border-color .2s;
}
#sort-select:focus, #version-select:focus { border-color: var(--blue); }

#data-status {
  font-size: 11px;
  color: var(--text-muted);
  padding: 8px 10px;
  background: var(--blue-bg);
  border-radius: 8px;
  line-height: 1.5;
}
#data-status .mode-badge {
  display: inline-block;
  background: var(--blue);
  color: #fff;
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 10px;
  font-weight: 600;
  margin-right: 4px;
}

/* ── 右侧内容区 ── */
#content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 筛选双行 */
#filters-bar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.filter-row {
  display: flex;
  align-items: center;
  padding: 7px 16px;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid #F1F5F9;
}
.filter-row:last-child { border-bottom: none; }
.filter-row::-webkit-scrollbar { display: none; }

.filter-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  flex-shrink: 0;
  margin-right: 4px;
  white-space: nowrap;
}

.chip {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  border: 1.5px solid var(--border);
  color: var(--text-gray);
  background: var(--white);
  transition: all .15s;
  user-select: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.chip:hover { border-color: var(--blue); color: var(--blue); }
.chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.chip .chip-count {
  background: rgba(255,255,255,.3);
  border-radius: 10px;
  padding: 0 5px;
  font-size: 10px;
  font-weight: 700;
  min-width: 16px;
  text-align: center;
}
.chip:not(.active) .chip-count {
  background: rgba(30,58,138,.1);
  color: var(--blue);
}

/* 卡片网格 */
#cards-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

#cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

#empty-state {
  display: none;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
#empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
#empty-state p { font-size: 15px; margin-bottom: 6px; color: var(--text-gray); }
#empty-state small { font-size: 12px; }

/* ============================================================
   案例卡片
   ============================================================ */
.case-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  position: relative;
  cursor: pointer;
  transition: box-shadow .2s, transform .15s;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.case-card:hover {
  box-shadow: 0 4px 16px rgba(30,58,138,.12);
  transform: translateY(-1px);
}

/* 平台徽标（右上角） */
.platform-badge {
  position: absolute;
  top: 0;
  right: 0;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 0 10px 0 8px;
  color: #fff;
  letter-spacing: .3px;
}
.platform-badge.douyin  { background: #161823; }
.platform-badge.kuaishou { background: #FF5000; }
.platform-badge.xiaohongshu { background: #FF2442; }
.platform-badge.shipinhao { background: #07C160; }
.platform-badge.default { background: var(--text-muted); }

/* 版本角标（左上角，当 platform-badge 存在时推后） */
.version-badge {
  position: absolute;
  top: 0;
  left: 0;
  background: var(--orange);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 10px 0 8px 0;
  min-width: 22px;
  text-align: center;
}

/* 类型 badge */
.type-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  margin-bottom: 2px;
}

/* 账号名行 */
.card-account {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-dark);
  line-height: 1.3;
  padding-right: 46px;
}

/* 粉丝数 */
.card-followers {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: -4px;
}
.card-followers strong { color: var(--blue); font-size: 13px; }

/* 图标行 */
.card-icons {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 12px;
  flex-wrap: wrap;
}
.icon-item {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--bg);
  font-size: 11px;
  white-space: nowrap;
}
.icon-item.ok    { background: #F0FDF4; color: var(--green); }
.icon-item.warn  { background: #FFFBEB; color: #92400E; }
.icon-item.fail  { background: #FEF2F2; color: var(--red); }
.icon-item.info  { background: var(--blue-bg); color: var(--blue); }

/* ai_summary */
.card-summary {
  font-size: 12px;
  color: var(--text-gray);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 标签行 */
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.tag-pill {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 10px;
  background: var(--bg);
  color: var(--text-muted);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all .12s;
}
.tag-pill:hover {
  background: var(--blue-bg);
  color: var(--blue);
  border-color: var(--blue);
}

/* 底部：日期 + 字数 + 按钮 */
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 6px;
  border-top: 1px solid var(--bg);
}
.card-meta {
  font-size: 11px;
  color: var(--text-muted);
}

.btn-detail {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 7px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
  pointer-events: none; /* 父卡片监听 click */
}
.case-card:hover .btn-detail { background: var(--blue-light); }

/* highlight mark */
mark {
  background: #FEF08A;
  color: var(--text-dark);
  border-radius: 2px;
  padding: 0 1px;
}

/* ============================================================
   详情抽屉
   ============================================================ */
#drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
#drawer-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

#drawer {
  position: fixed;
  top: 0;
  right: 0;
  width: var(--drawer-w);
  max-width: 95vw;
  height: 100vh;
  background: var(--white);
  z-index: 201;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
  box-shadow: -4px 0 30px rgba(0,0,0,.15);
}
#drawer.open { transform: translateX(0); }

/* 抽屉头 */
#drawer-header {
  padding: 16px 18px 0;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.drawer-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 4px;
}
#drawer-account-name {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-dark);
  flex: 1;
  padding-right: 10px;
  line-height: 1.3;
}
#drawer-close {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--text-muted);
  line-height: 1;
  padding: 0 2px;
  transition: color .15s;
}
#drawer-close:hover { color: var(--text-dark); }

#drawer-sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 12px;
}

/* 抽屉 tabs */
#drawer-tabs {
  display: flex;
  gap: 0;
  margin: 0 -18px;
  padding: 0 18px;
  border-top: 1px solid var(--border);
}
.drawer-tab {
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2.5px solid transparent;
  color: var(--text-muted);
  transition: all .15s;
  white-space: nowrap;
  user-select: none;
}
.drawer-tab:hover { color: var(--blue); }
.drawer-tab.active {
  color: var(--blue);
  border-bottom-color: var(--blue);
  font-weight: 600;
}

/* 抽屉内容 */
#drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}

/* ── 报告全文 markdown 渲染 ── */
.md-content {
  line-height: 1.7;
  color: var(--text-dark);
}
.md-content h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--blue);
  margin: 20px 0 10px;
  padding: 0 0 6px 12px;
  border-left: 4px solid var(--blue);
  border-bottom: 1px solid var(--blue-bg);
}
.md-content h1:first-child { margin-top: 0; }
.md-content h2 {
  font-size: 15px;
  font-weight: 700;
  color: var(--blue);
  margin: 16px 0 8px;
  padding: 0 0 4px 10px;
  border-left: 3px solid var(--orange);
}
.md-content h2:first-child { margin-top: 0; }
.md-content h3 {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-dark);
  margin: 12px 0 6px;
  padding-left: 8px;
  border-left: 2px solid var(--border);
}
.md-content h4 {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-gray);
  margin: 10px 0 4px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.md-content strong { color: var(--blue); font-weight: 700; }
.md-content em { color: var(--text-gray); font-style: italic; }
.md-content ul {
  padding-left: 0;
  margin: 8px 0;
  list-style: none;
}
.md-content ul li {
  padding: 3px 0 3px 20px;
  position: relative;
  line-height: 1.6;
}
.md-content ul li::before {
  content: '';
  position: absolute;
  left: 6px;
  top: 10px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--orange);
}
.md-content ol {
  padding-left: 22px;
  margin: 8px 0;
}
.md-content ol li { margin: 4px 0; line-height: 1.6; }
.md-content blockquote {
  border-left: 3px solid var(--orange);
  background: #FFFBEB;
  padding: 10px 14px;
  margin: 10px 0;
  color: var(--text-gray);
  border-radius: 0 8px 8px 0;
}
.md-content p {
  margin: 8px 0;
  line-height: 1.7;
}
.md-content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 16px 0;
}
.md-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 12px;
}
.md-content th {
  background: var(--blue);
  color: #fff;
  font-weight: 600;
  padding: 7px 10px;
  text-align: left;
}
.md-content td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
}
.md-content tr:nth-child(even) td { background: var(--blue-bg); }
.md-content code {
  font-family: "SF Mono", "Fira Code", monospace;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 4px;
  font-size: 12px;
}
.no-report {
  text-align: center;
  padding: 40px 0;
  color: var(--text-muted);
}
.report-file-hint {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  text-align: center;
  color: var(--text-muted);
}
.report-file-hint h4 {
  font-size: 14px;
  color: var(--text-gray);
  margin-bottom: 8px;
  text-align: left;
  text-transform: none;
  letter-spacing: 0;
}
.report-file-hint code {
  display: block;
  background: var(--text-dark);
  color: #A3E635;
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 12px;
  font-family: "SF Mono", "Fira Code", monospace;
  text-align: left;
  margin: 10px 0;
  white-space: pre;
}

/* 骨架屏 */
.skeleton {
  height: 14px;
  background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%);
  background-size: 200% 100%;
  animation: skeleton-wave 1.4s infinite;
  border-radius: 6px;
  margin-bottom: 10px;
}
.skeleton.wide { width: 100%; }
.skeleton.medium { width: 75%; }
.skeleton.short { width: 45%; }
@keyframes skeleton-wave {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ── 仪表盘 Tab ── */
.dashboard-section {
  margin-bottom: 24px;
}
.dashboard-section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .8px;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
}
.dashboard-section-title .section-icon {
  font-size: 14px;
}

.metrics-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 8px;
}
.metrics-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.metrics-grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.metric-card {
  background: var(--bg);
  border-radius: 10px;
  padding: 12px 10px;
  border: 1px solid var(--border);
  text-align: center;
}
.metric-card .m-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
  margin-bottom: 4px;
}
.metric-card .m-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-dark);
  line-height: 1.2;
}
.metric-card .m-unit {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
}
.metric-card .m-badge {
  display: inline-block;
  margin-top: 4px;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 10px;
}

.metric-card.tier-head    { border-color: #BBF7D0; background: #F0FDF4; }
.metric-card.tier-head    .m-value { color: var(--green); }
.metric-card.tier-growth  { border-color: #BFDBFE; background: var(--blue-bg); }
.metric-card.tier-growth  .m-value { color: var(--blue); }
.metric-card.tier-start   { border-color: var(--border); }
.metric-card.burst-hot    { border-color: #FED7AA; background: #FFF7ED; }
.metric-card.burst-hot    .m-value { color: var(--orange); }
.metric-card.vs-up        { border-color: #BBF7D0; background: #F0FDF4; }
.metric-card.vs-up        .m-value { color: var(--green); }
.metric-card.vs-down      { border-color: #BFDBFE; background: var(--blue-bg); }
.metric-card.vs-down      .m-value { color: var(--blue-light); }

.detail-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 8px 0;
  border-bottom: 1px solid var(--bg);
  font-size: 13px;
  gap: 10px;
}
.detail-row:last-child { border-bottom: none; }
.detail-row .dr-label {
  color: var(--text-muted);
  flex-shrink: 0;
  line-height: 1.5;
}
.detail-row .dr-value {
  font-weight: 500;
  text-align: right;
  line-height: 1.5;
}

/* ── 版本历史 tab ── */
.timeline {
  position: relative;
  padding-left: 24px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 6px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: var(--border);
  border-radius: 2px;
}
.timeline-item {
  position: relative;
  margin-bottom: 20px;
}
.timeline-item::before {
  content: '';
  position: absolute;
  left: -21px;
  top: 8px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--border);
  border: 2px solid var(--white);
  box-shadow: 0 0 0 2px var(--border);
}
.timeline-item.current::before {
  background: var(--blue);
  box-shadow: 0 0 0 2px var(--blue);
}
.tl-date {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.tl-card {
  background: var(--bg);

<script>
/* ============================================================
   平台配置
   ============================================================ */
const PLATFORM_CONFIG = {
  douyin:      { label: '抖音',  emoji: '🎵', cls: 'douyin' },
  kuaishou:    { label: '快手',  emoji: '⚡', cls: 'kuaishou' },
  xiaohongshu: { label: '小红书', emoji: '📕', cls: 'xiaohongshu' },
  shipinhao:   { label: '视频号', emoji: '💬', cls: 'shipinhao' },
};

/* ============================================================
   工具函数
   ============================================================ */
function fmtNum(n) {
  if (n == null) return '—';
  n = Number(n);
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return n.toLocaleString('zh-CN');
}
// 别名保持向后兼容
const fmtFollowers = fmtNum;

function fmtDate(s) {
  if (!s) return '—';
  return s.slice(0, 10);
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/** 高亮搜索词 */
function highlight(text, q) {
  if (!q || !text) return escHtml(text || '');
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escHtml(text).replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
}

/** 类型 badge 颜色 */
const TYPE_COLORS = {
  'B2B':    { bg: '#FFF3E0', color: '#E65100' },
  '带货':   { bg: '#E8F5E9', color: '#2E7D32' },
  '知识':   { bg: '#E3F2FD', color: '#1565C0' },
  '健康':   { bg: '#E8F5E9', color: '#2E7D32' },
  '本地':   { bg: '#FCE4EC', color: '#880E4F' },
  '颜值':   { bg: '#F3E5F5', color: '#6A1B9A' },
  '美食':   { bg: '#FFF8E1', color: '#F57F17' },
  '科技':   { bg: '#E0F2F1', color: '#00695C' },
  '教育':   { bg: '#E8EAF6', color: '#283593' },
  '默认':   { bg: '#F1F5F9', color: '#475569' },
};
function getTypeBadgeStyle(accountType) {
  if (!accountType) return TYPE_COLORS['默认'];
  for (const key of Object.keys(TYPE_COLORS)) {
    if (key !== '默认' && accountType.includes(key)) return TYPE_COLORS[key];
  }
  return TYPE_COLORS['默认'];
}

/** 润色状态 */
function polishStatus(polish) {
  if (!polish) return { icon: '📝', label: '润色未知', cls: '' };
  if (polish.ok) {
    if (polish.segs_ok >= polish.segs_total) return { icon: '📝', label: '润色✅', cls: 'ok' };
    return { icon: '📝', label: '润色⚠️', cls: 'warn' };
  }
  return { icon: '📝', label: '润色❌', cls: 'fail' };
}

/* ============================================================
   Markdown 渲染（自写，零依赖）
   ============================================================ */
function renderMarkdown(text) {
  if (!text) return '<p class="no-report">暂无报告全文。</p>';

  const lines = text.split('\n');
  const out = [];
  let inUl = false, inOl = false, inTable = false;
  let tableHead = false;

  function closeAll() {
    if (inUl)    { out.push('</ul>');    inUl = false; }
    if (inOl)    { out.push('</ol>');    inOl = false; }
    if (inTable) { out.push('</tbody></table>'); inTable = false; tableHead = false; }
  }

  function inlineMd(s) {
    // 先转义 HTML，再做行内语法
    let r = String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // 保留原始 emoji（不转义 unicode）
    r = r
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
    return r;
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    // H1
    if (/^# /.test(line)) {
      closeAll();
      out.push(`<h1>${inlineMd(line.slice(2))}</h1>`);
    }
    // H2
    else if (/^## /.test(line)) {
      closeAll();
      out.push(`<h2>${inlineMd(line.slice(3))}</h2>`);
    }
    // H3
    else if (/^### /.test(line)) {
      closeAll();
      out.push(`<h3>${inlineMd(line.slice(4))}</h3>`);
    }
    // H4
    else if (/^#### /.test(line)) {
      closeAll();
      out.push(`<h4>${inlineMd(line.slice(5))}</h4>`);
    }
    // HR
    else if (/^---+$/.test(line.trim())) {
      closeAll();
      out.push('<hr>');
    }
    // 表格行
    else if (/^\|/.test(line)) {
      const cells = line.split('|').slice(1, -1).map(c => c.trim());
      // 分隔行（全是 - 和 :）
      if (cells.every(c => /^[-:]+$/.test(c))) {
        // 忽略
      } else {
        if (!inTable) {
          closeAll();
          out.push('<table><thead><tr>');
          cells.forEach(c => out.push(`<th>${inlineMd(c)}</th>`));
          out.push('</tr></thead><tbody>');
          inTable = true;
          tableHead = true;
        } else {
          out.push('<tr>');
          cells.forEach(c => out.push(`<td>${inlineMd(c)}</td>`));
          out.push('</tr>');
        }
      }
    }
    // 引用块
    else if (/^> /.test(line)) {
      closeAll();
      out.push(`<blockquote>${inlineMd(line.slice(2))}</blockquote>`);
    }
    // 无序列表
    else if (/^[-*] /.test(line)) {
      if (inTable) { out.push('</tbody></table>'); inTable = false; }
      if (inOl)    { out.push('</ol>'); inOl = false; }
      if (!inUl)   { out.push('<ul>'); inUl = true; }
      out.push(`<li>${inlineMd(line.slice(2))}</li>`);
    }
    // 有序列表
    else if (/^\d+\. /.test(line)) {
      if (inTable) { out.push('</tbody></table>'); inTable = false; }
      if (inUl)    { out.push('</ul>'); inUl = false; }
      if (!inOl)   { out.push('<ol>'); inOl = true; }
      out.push(`<li>${inlineMd(line.replace(/^\d+\. /, ''))}</li>`);
    }
    // 空行
    else if (line.trim() === '') {
      closeAll();
      // 不插入额外元素，段落间距由 CSS 控制
    }
    // 普通段落
    else {
      closeAll();
      out.push(`<p>${inlineMd(line)}</p>`);
    }
  }

  closeAll();
  return out.join('\n');
}

/* ============================================================
   应用状态
   ============================================================ */
let allCases = [];
let currentCase = null;
let activePlatform = '';
let activeType = '';
let activeTab = 'report';
let reportCache = {}; // run_id → md 文本或 null（加载失败）
let isServerMode = false;

/* ============================================================
   URL 参数同步
   ============================================================ */
function readUrlParams() {
  const p = new URLSearchParams(location.search);
  activePlatform = p.get('platform') || '';
  activeType     = p.get('type') || '';
  const q = p.get('q') || '';
  if (q) document.getElementById('search-input').value = q;
}

function pushUrlParams() {
  const q = document.getElementById('search-input').value.trim();
  const params = new URLSearchParams();
  if (activePlatform) params.set('platform', activePlatform);
  if (activeType)     params.set('type', activeType);
  if (q)              params.set('q', q);
  const str = params.toString();
  const url = str ? location.pathname + '?' + str : location.pathname;
  history.replaceState(null, '', url);
}

/* ============================================================
   数据加载
   ============================================================ */
async function loadData() {
  let data = null;
  let mode = '';

  try {
    const res = await fetch('../data/cases/index.json', { cache: 'no-store' });
    if (res.ok) {
      data = await res.json();
      mode = 'Server';
      isServerMode = true;
    }
  } catch (_) {}

  if (!data) {
    try {
      const el = document.getElementById('embedded-data');
      data = JSON.parse(el.textContent.trim());
      mode = 'File';
      isServerMode = false;
    } catch (_) {
      data = { version: '1.1', updated_at: '', cases: [] };
      mode = 'File';
    }
  }

  allCases = data.cases || [];
  readUrlParams();
  renderAll();
  updateDataStatus(mode, data.updated_at);
}

function updateDataStatus(mode, updatedAt) {
  document.getElementById('data-mode-line').innerHTML =
    `<span class="mode-badge">${mode}</span> ${allCases.length} 条案例已加载`;
  document.getElementById('data-updated-line').textContent =
    updatedAt ? '更新：' + updatedAt.slice(0, 16).replace('T', ' ') : '';
}

/* ============================================================
   渲染主流程
   ============================================================ */
function renderAll() {
  buildPlatformChips();
  buildTypeChips();
  buildVersionOptions();
  updateStats();
  renderCards();
  pushUrlParams();
}

function buildPlatformChips() {
  const row = document.getElementById('platform-row');
  // 清除动态项
  [...row.querySelectorAll('.chip[data-platform]:not([data-platform=""])')].forEach(el => el.remove());

  // 统计平台数量
  const counts = {};
  allCases.forEach(c => {
    const p = c.platform || '';
    if (p) counts[p] = (counts[p] || 0) + 1;
  });

  Object.entries(counts).forEach(([p, n]) => {
    const cfg = PLATFORM_CONFIG[p] || { label: p, emoji: '📱', cls: 'default' };
    const div = document.createElement('div');
    div.className = 'chip' + (activePlatform === p ? ' active' : '');
    div.dataset.platform = p;
    div.innerHTML = `${cfg.emoji} ${escHtml(cfg.label)} <span class="chip-count">${n}</span>`;
    row.appendChild(div);
  });

  // 全部 chip 状态
  row.querySelector('[data-platform=""]').classList.toggle('active', activePlatform === '');
}

function buildTypeChips() {
  const row = document.getElementById('type-row');
  [...row.querySelectorAll('.chip[data-type]:not([data-type=""])')].forEach(el => el.remove());

  // 在当前平台筛选下计数类型
  const base = activePlatform
    ? allCases.filter(c => (c.platform || '') === activePlatform)
    : allCases;
  const counts = {};
  base.forEach(c => {
    const t = c.account_type || '';
    if (t) counts[t] = (counts[t] || 0) + 1;
  });

  Object.entries(counts).sort((a,b) => b[1]-a[1]).forEach(([t, n]) => {
    const div = document.createElement('div');
    div.className = 'chip' + (activeType === t ? ' active' : '');
    div.dataset.type = t;
    div.innerHTML = `${escHtml(t)} <span class="chip-count">${n}</span>`;
    row.appendChild(div);
  });

  row.querySelector('[data-type=""]').classList.toggle('active', activeType === '');
}

function buildVersionOptions() {
  const sel = document.getElementById('version-select');
  const versions = [...new Set(allCases.map(c => c.probe_version).filter(Boolean))].sort().reverse();
  const current = sel.value;
  sel.innerHTML = '<option value="">全部版本</option>';
  versions.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v.length > 15 ? v.slice(0, 15) + '…' : v;
    sel.appendChild(opt);
  });
  sel.value = current;
}

function updateStats() {
  document.getElementById('stat-total').textContent = allCases.length;
  const accounts = new Set(allCases.map(c => c.sec_uid || c.account_name)).size;
  document.getElementById('stat-accounts').textContent = accounts;
  const passed = allCases.filter(c => c.validation_pass).length;
  const rate = allCases.length ? Math.round(passed / allCases.length * 100) + '%' : '—';
  document.getElementById('stat-pass-rate').textContent = rate;
}

function getFilteredCases() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const sort = document.getElementById('sort-select').value;
  const ver = document.getElementById('version-select').value;

  let list = allCases.filter(c => {
    if (activePlatform && (c.platform || '') !== activePlatform) return false;
    if (activeType && c.account_type !== activeType) return false;
    if (ver && c.probe_version !== ver) return false;
    if (q) {
      const hay = [c.account_name, c.ai_summary, c.video_title, ...(c.tags || [])].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  list.sort((a, b) => {
    if (sort === 'followers-desc') return (b.follower || 0) - (a.follower || 0);
    if (sort === 'followers-asc')  return (a.follower || 0) - (b.follower || 0);
    return (b.analyzed_at || '').localeCompare(a.analyzed_at || '');
  });

  return list;
}

function renderCards() {
  const list = getFilteredCases();
  const grid = document.getElementById('cards-grid');
  const empty = document.getElementById('empty-state');
  const q = document.getElementById('search-input').value.trim().toLowerCase();

  grid.innerHTML = '';

  // Header 筛选计数
  const fcEl = document.getElementById('filter-count');
  const isFiltered = activePlatform || activeType || q || document.getElementById('version-select').value;
  if (isFiltered) {
    fcEl.style.display = '';
    fcEl.textContent = `已筛选 ${list.length} / 共 ${allCases.length} 个案例`;
  } else {
    fcEl.style.display = 'none';
  }

  if (list.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  list.forEach(c => grid.appendChild(buildCard(c, q)));
}

/* ============================================================
   卡片构建
   ============================================================ */
function buildCard(c, q) {
  const div = document.createElement('div');
  div.className = 'case-card';
  div.addEventListener('click', () => openDrawer(c));

  // 平台徽标（右上角）
  const pCfg = PLATFORM_CONFIG[c.platform || ''] || null;
  if (pCfg) {
    div.innerHTML += `<div class="platform-badge ${pCfg.cls}">${pCfg.emoji} ${escHtml(pCfg.label)}</div>`;
  }

  // 版本角标（左上角）
  if (c.version_count > 1) {
    div.innerHTML += `<div class="version-badge">v${c.version_count}</div>`;
  }

  // 类型 badge
  const style = getTypeBadgeStyle(c.account_type);
  div.innerHTML += `
    <div>
      <span class="type-badge" style="background:${style.bg};color:${style.color};">
        ${escHtml(c.account_type || '未知类型')}
      </span>
    </div>`;

  // 账号名（高亮）
  div.innerHTML += `<div class="card-account">${highlight(c.account_name || '—', q)}</div>`;

  // 粉丝行
  div.innerHTML += `
    <div class="card-followers">
      粉丝 <strong>${fmtFollowers(c.follower)}</strong>
      &nbsp;·&nbsp; 均赞 ${fmtFollowers(c.avg_like)}
      &nbsp;·&nbsp; 爆款比 ${c.burst_ratio != null ? c.burst_ratio + 'x' : '—'}
    </div>`;

  // 图标行
  const ps = polishStatus(c.polish);
  const avIcon = c.has_av
    ? '<span class="icon-item info">🎥 视听✅</span>'
    : '<span class="icon-item">🎥 视听—</span>';
  const passIcon = c.validation_pass
    ? '<span class="icon-item ok">✅ 验收通过</span>'
    : '<span class="icon-item fail">❌ 有缺口</span>';
  div.innerHTML += `
    <div class="card-icons">
      ${avIcon}
      <span class="icon-item ${ps.cls}">${ps.icon} ${escHtml(ps.label)}</span>
      ${passIcon}
    </div>`;

  // 摘要（高亮）
  if (c.ai_summary) {
    div.innerHTML += `<div class="card-summary">${highlight(c.ai_summary, q)}</div>`;
  }

  // 标签
  if (c.tags && c.tags.length) {
    const tagsHtml = c.tags.map(t =>
      `<span class="tag-pill" data-tag="${escHtml(t)}">${highlight(t, q)}</span>`
    ).join('');
    div.innerHTML += `<div class="card-tags">${tagsHtml}</div>`;
  }

  // 底部
  div.innerHTML += `
    <div class="card-footer">
      <div class="card-meta">
        ${fmtDate(c.analyzed_date || c.analyzed_at)}
        ${c.report_chars ? ' · ' + c.report_chars.toLocaleString() + '字' : ''}
      </div>
      <div class="btn-detail">查看详情</div>
    </div>`;

  // 标签点击过滤（不冒泡到卡片 openDrawer）
  div.querySelectorAll('.tag-pill').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const tag = el.dataset.tag;
      document.getElementById('search-input').value = tag;
      renderCards();
      pushUrlParams();
    });
  });

  return div;
}

/* ============================================================
   详情抽屉
   ============================================================ */
function openDrawer(c) {
  currentCase = c;
  activeTab = 'report';

  document.getElementById('drawer-account-name').textContent = '@' + (c.account_name || '—');
  document.getElementById('drawer-sub').textContent =
    [fmtFollowers(c.follower) + '粉', c.account_type, fmtDate(c.analyzed_date || c.analyzed_at)]
      .filter(Boolean).join(' · ');

  document.querySelectorAll('.drawer-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === activeTab);
  });

  renderDrawerBody();
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
  document.body.style.overflow = '';
  currentCase = null;
}

function renderDrawerBody() {
  const body = document.getElementById('drawer-body');
  if (!currentCase) { body.innerHTML = ''; return; }
  body.scrollTop = 0;

  if (activeTab === 'report')    renderReportTab(currentCase, body);
  if (activeTab === 'dashboard') body.innerHTML = renderDashboardTab(currentCase);
  if (activeTab === 'history')   body.innerHTML = renderHistoryTab(currentCase);
}

/* ── 报告全文 Tab（懒加载 + 骨架屏） ── */
async function renderReportTab(c, body) {
  // 若已缓存
  if (reportCache[c.run_id] !== undefined) {
    body.innerHTML = renderCachedReport(c, reportCache[c.run_id]);
    return;
  }

  // 骨架屏
  body.innerHTML = `
    <div>
      <div class="skeleton wide"></div>
      <div class="skeleton medium"></div>
      <div class="skeleton short" style="margin-bottom:20px"></div>
      <div class="skeleton wide"></div>
      <div class="skeleton medium"></div>
      <div class="skeleton wide" style="margin-bottom:20px"></div>
      <div class="skeleton medium"></div>
      <div class="skeleton short"></div>
    </div>`;

  if (!isServerMode) {
    reportCache[c.run_id] = null;
    body.innerHTML = renderCachedReport(c, null);
    return;
  }

  try {
    const res = await fetch(`../data/cases/${c.run_id}/report.md`, { cache: 'no-store' });
    if (res.ok) {
      const md = await res.text();
      reportCache[c.run_id] = md;
    } else {
      reportCache[c.run_id] = null;
    }
  } catch (_) {
    reportCache[c.run_id] = null;
  }

  // 仍在当前 case 时更新
  if (currentCase && currentCase.run_id === c.run_id && activeTab === 'report') {
    body.innerHTML = renderCachedReport(c, reportCache[c.run_id]);
    body.scrollTop = 0;
  }
}

function renderCachedReport(c, md) {
  if (md) {
    return `<div class="md-content">${renderMarkdown(md)}</div>`;
  }
  if (!isServerMode) {
    return `
      <div class="report-file-hint">
        <p style="font-size:20px;margin-bottom:12px">⚠️</p>
        <h4>报告全文需在服务器模式下查看</h4>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px">
          当前以 file:// 方式打开，fetch 受 CORS 限制。请在终端启动本地服务器：
        </p>
        <code>cd ${escHtml('/path/to/probe/hub')}
python3 -m http.server 7890</code>
        <p style="font-size:11px;color:var(--text-muted);margin-top:8px">
          然后访问 <strong>http://localhost:7890/probe-cases.html</strong>
        </p>
      </div>
      ${c.ai_summary ? `<div class="md-content" style="margin-top:16px"><h3>AI 摘要</h3><p>${escHtml(c.ai_summary)}</p></div>` : ''}`;
  }
  return `<p class="no-report">报告文件加载失败，请检查 data/cases/${escHtml(c.run_id)}/report.md 是否存在。</p>`;
}

/* ── 数据仪表盘 Tab ── */
function renderDashboardTab(c) {
  /* ── 区块 A：账号层 ── */
  const follower = c.follower || 0;
  let tierClass = 'tier-start', tierLabel = '起步', tierColor = 'var(--text-muted)';
  if (follower >= 1000000) { tierClass = 'tier-head'; tierLabel = '头部'; tierColor = 'var(--green)'; }
  else if (follower >= 100000) { tierClass = 'tier-growth'; tierLabel = '成长'; tierColor = 'var(--blue)'; }

  const burstHot = c.burst_ratio != null && c.burst_ratio >= 10;

  let sectionA = `
    <div class="dashboard-section">
      <div class="dashboard-section-title"><span class="section-icon">👤</span> 账号层</div>
      <div class="metrics-grid-3">
        <div class="metric-card ${tierClass}">
          <div class="m-label">粉丝数</div>
          <div class="m-value">${fmtFollowers(c.follower)}</div>
          <div class="m-badge" style="background:${tierColor};color:#fff;">${tierLabel}</div>
        </div>
        <div class="metric-card">
          <div class="m-label">均赞</div>
          <div class="m-value">${fmtFollowers(c.avg_like)}</div>
        </div>
        <div class="metric-card">
          <div class="m-label">最高赞</div>
          <div class="m-value">${fmtFollowers(c.max_like)}</div>
        </div>
      </div>
      <div class="metrics-grid-2">
        <div class="metric-card ${burstHot ? 'burst-hot' : ''}">
          <div class="m-label">爆款比</div>
          <div class="m-value">${c.burst_ratio != null ? c.burst_ratio : '—'}<span class="m-unit">x</span></div>
          ${burstHot ? '<div class="m-badge" style="background:var(--orange);color:#fff;">高爆款</div>' : ''}
        </div>
        <div class="metric-card">
          <div class="m-label">垂直度</div>
          <div class="m-value">${c.vertical_score != null ? c.vertical_score : '—'}</div>
        </div>
      </div>
    </div>`;

  /* ── 区块 B：视频层 ── */
  const vLike = c.video_like || 0;
  const avgLike = c.avg_like || 0;
  let vsClass = '', vsBadge = '';
  if (avgLike > 0 && vLike > 0) {
    const ratio = vLike / avgLike;
    if (ratio >= 1.2) {
      vsClass = 'vs-up';
      vsBadge = `<div class="m-badge" style="background:var(--green);color:#fff;">高于均值 ${ratio.toFixed(1)}x ↑</div>`;
    } else if (ratio < 0.8) {
      vsClass = 'vs-down';
      vsBadge = `<div class="m-badge" style="background:var(--blue-light);color:#fff;">低于均值 ↓</div>`;
    }
  }

  let sectionB = `
    <div class="dashboard-section">
      <div class="dashboard-section-title"><span class="section-icon">🎬</span> 视频层</div>
      <div class="metrics-grid-4">
        <div class="metric-card ${vsClass}">
          <div class="m-label">点赞</div>
          <div class="m-value">${fmtNum(c.video_like)}</div>
          ${vsBadge}
        </div>
        <div class="metric-card">
          <div class="m-label">评论</div>
          <div class="m-value">${fmtNum(c.video_comment)}</div>
        </div>
        <div class="metric-card">
          <div class="m-label">收藏</div>
          <div class="m-value">${fmtNum(c.video_collect)}</div>
        </div>
        <div class="metric-card">
          <div class="m-label">分享</div>
          <div class="m-value">${fmtNum(c.video_share)}</div>
        </div>
      </div>
      <div class="detail-row" style="margin-top:8px">
        <span class="dr-label">视频标题</span>
        <span class="dr-value" style="font-size:12px;max-width:280px;text-align:right">${escHtml(c.video_title || '—')}</span>
      </div>
    </div>`;

  /* ── 区块 C：分析质量层 ── */
  const ps = polishStatus(c.polish);
  let polishDetail = '';
  if (c.polish) {
    if (c.polish.ok && c.polish.segs_ok >= c.polish.segs_total) {
      polishDetail = `✅ 全段 (${c.polish.segs_ok}/${c.polish.segs_total}段)`;
    } else if (c.polish.ok) {
      polishDetail = `⚠️ 部分 (${c.polish.segs_ok}/${c.polish.segs_total}段)`;
    } else {
      polishDetail = `❌ 降级 · ${escHtml(c.polish.note || '未知原因')}`;
    }
  }

  const sourceLabel = c.source === 'real_tikhub' ? '真实账号 (TikHub)' : c.source === 'fixture' ? '模拟数据 (fixture)' : escHtml(c.source || '—');
  const gaps = (c.validation_gaps || []).join('、') || null;

  let sectionC = `
    <div class="dashboard-section">
      <div class="dashboard-section-title"><span class="section-icon">🔬</span> 分析质量层</div>
      <div class="detail-row">
        <span class="dr-label">视听六层</span>
        <span class="dr-value">${c.has_av ? '✅ 已采集' : '⚠️ 未采集'}${c.polish && c.polish.model && c.has_av ? ' · ' + escHtml(c.polish.model) : ''}</span>
      </div>
      <div class="detail-row">
        <span class="dr-label">LLM 润色</span>
        <span class="dr-value">${polishDetail || '—'}</span>
      </div>
      ${c.polish && c.polish.model ? `<div class="detail-row">
        <span class="dr-label">润色模型</span>
        <span class="dr-value">${escHtml(c.polish.model)}</span>
      </div>` : ''}
      <div class="detail-row">
        <span class="dr-label">系统版本</span>
        <span class="dr-value" style="font-family:monospace">${escHtml(c.probe_version || '—')}</span>
      </div>
      <div class="detail-row">
        <span class="dr-label">验收结果</span>
        <span class="dr-value">${c.validation_pass ? '✅ 全通' : '❌ 有缺口'}</span>
      </div>
      ${gaps ? `<div class="detail-row">
        <span class="dr-label">缺口项</span>
        <span class="dr-value" style="color:var(--red)">${escHtml(gaps)}</span>
      </div>` : ''}
      <div class="detail-row">
        <span class="dr-label">数据来源</span>
        <span class="dr-value">${sourceLabel}</span>
      </div>
      <div class="detail-row">
        <span class="dr-label">报告字数</span>
        <span class="dr-value">${c.report_chars ? c.report_chars.toLocaleString() + ' 字' : '—'}</span>
      </div>
      <div class="detail-row">
        <span class="dr-label">分析日期</span>
        <span class="dr-value">${escHtml(c.analyzed_at ? c.analyzed_at.slice(0,16).replace('T',' ') : '—')}</span>
      </div>
    </div>`;

  return sectionA + sectionB + sectionC;
}

/* ── 版本历史 Tab ── */
function renderHistoryTab(c) {
  if (!c.sec_uid && !c.account_name) {
    return '<div class="no-history">无法识别账号，无法查询历史版本。</div>';
  }

  const siblings = allCases
    .filter(x => c.sec_uid ? x.sec_uid === c.sec_uid : x.account_name === c.account_name)
    .sort((a, b) => (b.analyzed_at || '').localeCompare(a.analyzed_at || ''));

  if (siblings.length <= 1 && !c.prev_run_id) {
    return '<div class="no-history">该账号目前仅有 1 个分析版本。</div>';
  }

  const items = siblings.map(x => {
    const isCurrent = x.run_id === c.run_id;
    const ps = polishStatus(x.polish);
    return `
      <div class="timeline-item ${isCurrent ? 'current' : ''}">
        <div class="tl-date">${x.analyzed_at ? x.analyzed_at.slice(0,16).replace('T',' ') : '—'}
          ${isCurrent ? '<span class="tl-current-label">当前</span>' : ''}
        </div>
        <div class="tl-card">
          <div class="tl-version">${escHtml((x.probe_version || '').slice(0,15))}</div>
          <div class="tl-title">${escHtml(x.video_title || '（无标题）')}</div>
          <div class="tl-meta">
            <span>粉丝 ${fmtFollowers(x.follower)}</span>
            <span>均赞 ${fmtFollowers(x.avg_like)}</span>
            <span>${escHtml(ps.label)}</span>
            <span>${x.validation_pass ? '✅验收通过' : '❌有缺口'}</span>
          </div>
        </div>
      </div>`;
  }).join('');

  return `<div class="timeline">${items}</div>`;
}

/* ============================================================
   事件绑定
   ============================================================ */

// 平台 chips（事件委托）
document.getElementById('platform-row').addEventListener('click', e => {
  const chip = e.target.closest('.chip[data-platform]');
  if (!chip) return;
  activePlatform = chip.dataset.platform;
  // 切换平台时重置类型筛选
  activeType = '';
  buildPlatformChips();
  buildTypeChips();
  renderCards();
  pushUrlParams();
});

// 类型 chips（事件委托）
document.getElementById('type-row').addEventListener('click', e => {
  const chip = e.target.closest('.chip[data-type]');
  if (!chip) return;
  activeType = chip.dataset.type;
  buildTypeChips();
  renderCards();
  pushUrlParams();
});

// 搜索
document.getElementById('search-input').addEventListener('input', () => {
  renderCards();
  pushUrlParams();
});

// 排序
document.getElementById('sort-select').addEventListener('change', renderCards);

// 版本筛选
document.getElementById('version-select').addEventListener('change', renderCards);

// 关闭抽屉
document.getElementById('drawer-close').addEventListener('click', closeDrawer);
document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);

// 抽屉 tabs
document.getElementById('drawer-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.drawer-tab');
  if (!tab) return;
  document.querySelectorAll('.drawer-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeTab = tab.dataset.tab;
  renderDrawerBody();
});

/* 键盘快捷键 */
document.addEventListener('keydown', e => {
  // ESC：关闭抽屉或清空搜索
  if (e.key === 'Escape') {
    const drawer = document.getElementById('drawer');
    if (drawer.classList.contains('open')) {
      closeDrawer();
    } else {
      const si = document.getElementById('search-input');
      if (si.value) { si.value = ''; renderCards(); pushUrlParams(); }
    }
    return;
  }

  // /：聚焦搜索（避免在 input 时触发）
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault();
    document.getElementById('search-input').focus();
    return;
  }

  // ← →：抽屉内 Tab 切换
  const drawer = document.getElementById('drawer');
  if (drawer.classList.contains('open') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const tabs = [...document.querySelectorAll('.drawer-tab')];
    const idx = tabs.findIndex(t => t.classList.contains('active'));
    let next = idx + (e.key === 'ArrowRight' ? 1 : -1);
    if (next < 0) next = tabs.length - 1;
    if (next >= tabs.length) next = 0;
    tabs.forEach(t => t.classList.remove('active'));
    tabs[next].classList.add('active');
    activeTab = tabs[next].dataset.tab;
    renderDrawerBody();
  }
});

/* ============================================================
   启动
   ============================================================ */
loadData();
</script>
