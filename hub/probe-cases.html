<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元探 · 案例库 MetaProbe Cases</title>
<style>
/* ============================================================
   破晓品牌配色 & 全局重置
   ============================================================ */
:root {
  --blue:        #1E3A8A;
  --blue-light:  #3B5FC0;
  --blue-bg:     #EFF6FF;
  --orange:      #FF7A1A;
  --orange-bg:   #FFF3E0;
  --green:       #066C37;
  --green-bg:    #F0FDF4;
  --red:         #B91C1C;
  --red-bg:      #FEF2F2;
  --text-dark:   #1E293B;
  --text-gray:   #475569;
  --text-muted:  #94A3B8;
  --border:      #CBD5E1;
  --bg:          #F8FAFC;
  --white:       #FFFFFF;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  color: var(--text-dark);
  background: var(--bg);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ============================================================
   顶部 Header
   ============================================================ */
#header {
  background: var(--blue);
  color: #fff;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(30,58,138,.4);
  z-index: 100;
  transition: background .2s;
}

#header-left {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

body.mode-read #header-left {
  flex-direction: row;
  align-items: center;
  gap: 12px;
}

#header h1 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .5px;
}

#header .subtitle {
  font-size: 11px;
  opacity: .7;
}

#header-stats {
  display: flex;
  gap: 10px;
  align-items: center;
}

/* 列表模式 stat chips */
.stat-chip {
  background: rgba(255,255,255,.15);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.stat-chip span { opacity: .75; font-weight: 400; }

#filter-count {
  font-size: 11px;
  opacity: .85;
  background: rgba(255,255,255,.1);
  border-radius: 12px;
  padding: 3px 10px;
  white-space: nowrap;
}

/* 阅读模式 header stats */
#read-header-nav {
  display: none;
  align-items: center;
  gap: 10px;
}

body.mode-read #list-header-stats { display: none; }
body.mode-read #read-header-nav   { display: flex; }
body.mode-list #read-header-nav   { display: none; }
body.mode-list #list-header-stats { display: flex; }

.hn-btn {
  background: rgba(255,255,255,.2);
  color: #fff;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 13px;
  cursor: pointer;
  transition: background .12s;
  line-height: 1;
}
.hn-btn:hover { background: rgba(255,255,255,.35); }
.hn-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }

#read-nav-index {
  font-size: 12px;
  opacity: .85;
  white-space: nowrap;
}

.hn-shortcut {
  font-size: 11px;
  opacity: .7;
  white-space: nowrap;
  letter-spacing: .3px;
}

/* ============================================================
   模式切换 — 核心
   ============================================================ */
body.mode-list .sb-read  { display: none !important; }
body.mode-list .sb-list  { display: flex; flex-direction: column; gap: 16px; }
body.mode-list #list-panel { display: flex; flex-direction: column; }
body.mode-list #read-panel { display: none !important; }
body.mode-list #toc-nav    { display: none !important; }

body.mode-read .sb-list  { display: none !important; }
body.mode-read .sb-read  { display: flex; flex-direction: column; gap: 10px; }
body.mode-read #list-panel { display: none !important; }
body.mode-read #read-panel { display: flex; flex-direction: column; }
body.mode-read #toc-nav    { display: flex; flex-direction: column; }

/* ============================================================
   主体布局
   ============================================================ */
#layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── 侧边栏 ── */
#sidebar {
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  transition: width .2s;
}

body.mode-list #sidebar { width: 220px; padding: 16px 12px; overflow-y: auto; gap: 20px; }
body.mode-read #sidebar { width: 180px; padding: 10px 0 0; overflow-y: hidden; }

/* 列表模式侧边栏 */
.sb-list { width: 100%; }

.sidebar-section label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .8px;
  margin-bottom: 6px;
}

.search-wrapper { position: relative; }
.search-shortcut {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: var(--text-muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  pointer-events: none;
}

#search-input {
  width: 100%;
  padding: 8px 36px 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-dark);
  outline: none;
  transition: border-color .2s;
}
#search-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(30,58,138,.1); }

#sort-select, #version-select {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-dark);
  background: var(--white);
  outline: none;
  cursor: pointer;
  transition: border-color .2s;
}
#sort-select:focus, #version-select:focus { border-color: var(--blue); }

#data-status {
  font-size: 11px;
  color: var(--text-muted);
  padding: 8px 10px;
  background: var(--blue-bg);
  border-radius: 8px;
  line-height: 1.5;
}
#data-status .mode-badge {
  display: inline-block;
  background: var(--blue);
  color: #fff;
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 10px;
  font-weight: 600;
  margin-right: 4px;
}

/* 阅读模式侧边栏 */
.sb-read { width: 100%; height: 100%; overflow: hidden; }

#back-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: var(--blue-bg);
  color: var(--blue);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background .12s;
  margin: 0 10px 10px;
  white-space: nowrap;
}
#back-btn:hover { background: #DBEAFE; }

.sb-read-type-head {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .6px;
  padding: 0 10px 6px;
}

#read-type-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 0 10px 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}

.read-type-chip {
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  color: var(--text-muted);
  background: #fff;
  transition: all .12s;
  white-space: nowrap;
}
.read-type-chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }

#read-case-list {
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.read-case-item {
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text-gray);
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all .12s;
  line-height: 1.4;
}
.read-case-item:hover { background: var(--bg); color: var(--text-dark); }
.read-case-item.active {
  background: var(--blue-bg);
  color: var(--blue);
  border-left-color: var(--blue);
  font-weight: 600;
}
.rci-type { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.rci-follower { font-size: 10px; color: var(--text-muted); }

/* ── 主内容区 ── */
#main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ── 列表面板 ── */
#list-panel {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* 筛选双行 */
#filters-bar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.filter-row {
  display: flex;
  align-items: center;
  padding: 7px 16px;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid #F1F5F9;
}
.filter-row:last-child { border-bottom: none; }
.filter-row::-webkit-scrollbar { display: none; }

.filter-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  flex-shrink: 0;
  margin-right: 4px;
  white-space: nowrap;
}

.chip {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  border: 1.5px solid var(--border);
  color: var(--text-gray);
  background: var(--white);
  transition: all .15s;
  user-select: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.chip:hover { border-color: var(--blue); color: var(--blue); }
.chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.chip .chip-count {
  background: rgba(255,255,255,.3);
  border-radius: 10px;
  padding: 0 5px;
  font-size: 10px;
  font-weight: 700;
  min-width: 16px;
  text-align: center;
}
.chip:not(.active) .chip-count { background: rgba(30,58,138,.1); color: var(--blue); }

/* 卡片网格 */
#cards-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

#cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

#empty-state {
  display: none;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
#empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
#empty-state p { font-size: 15px; margin-bottom: 6px; color: var(--text-gray); }
#empty-state small { font-size: 12px; }

/* ============================================================
   案例卡片
   ============================================================ */
.case-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  position: relative;
  cursor: pointer;
  transition: box-shadow .2s, transform .15s, border-color .15s;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.case-card:hover {
  box-shadow: 0 4px 16px rgba(30,58,138,.12);
  transform: translateY(-1px);
}
.case-card.card-active {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px rgba(30,58,138,.2);
}

.platform-badge {
  position: absolute;
  top: 0; right: 0;
  font-size: 10px; font-weight: 700;
  padding: 2px 7px;
  border-radius: 0 10px 0 8px;
  color: #fff; letter-spacing: .3px;
}
.platform-badge.douyin      { background: #161823; }
.platform-badge.kuaishou    { background: #FF5000; }
.platform-badge.xiaohongshu { background: #FF2442; }
.platform-badge.shipinhao   { background: #07C160; }
.platform-badge.default     { background: var(--text-muted); }

.version-badge {
  position: absolute;
  top: 0; left: 0;
  background: var(--orange); color: #fff;
  font-size: 10px; font-weight: 700;
  padding: 2px 6px;
  border-radius: 10px 0 8px 0;
  min-width: 22px; text-align: center;
}

.type-badge {
  display: inline-block;
  font-size: 11px; font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  margin-bottom: 2px;
}

.card-account {
  font-size: 15px; font-weight: 700;
  color: var(--text-dark);
  line-height: 1.3;
  padding-right: 46px;
}

.card-followers {
  font-size: 12px; color: var(--text-muted);
  margin-top: -4px;
}
.card-followers strong { color: var(--blue); font-size: 13px; }

.card-icons {
  display: flex; gap: 6px;
  align-items: center;
  font-size: 12px; flex-wrap: wrap;
}
.icon-item {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 6px; border-radius: 6px;
  background: var(--bg); font-size: 11px; white-space: nowrap;
}
.icon-item.ok   { background: #F0FDF4; color: var(--green); }
.icon-item.warn { background: #FFFBEB; color: #92400E; }
.icon-item.fail { background: #FEF2F2; color: var(--red); }
.icon-item.info { background: var(--blue-bg); color: var(--blue); }

.card-summary {
  font-size: 12px; color: var(--text-gray);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag-pill {
  font-size: 11px; padding: 1px 7px;
  border-radius: 10px;
  background: var(--bg); color: var(--text-muted);
  border: 1px solid var(--border);
  cursor: pointer; transition: all .12s;
}
.tag-pill:hover { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }

.card-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: auto; padding-top: 6px;
  border-top: 1px solid var(--bg);
}
.card-meta { font-size: 11px; color: var(--text-muted); }

.btn-detail {
  background: var(--blue); color: #fff;
  border: none; border-radius: 7px;
  padding: 5px 12px; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: background .15s;
  pointer-events: none;
}
.case-card:hover .btn-detail { background: var(--blue-light); }

mark {
  background: #FEF08A; color: var(--text-dark);
  border-radius: 2px; padding: 0 1px;
}

/* ============================================================
   阅读面板
   ============================================================ */
#read-panel {
  flex: 1;
  overflow: hidden;
}

#read-header {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 12px 20px 0;
  flex-shrink: 0;
}

#read-account { font-size: 16px; font-weight: 700; color: var(--text-dark); }
#read-sub { font-size: 11px; color: var(--text-muted); margin: 3px 0 10px; }

#read-tabs {
  display: flex; gap: 0;
  margin: 0 -20px; padding: 0 20px;
}
.rtab {
  padding: 8px 14px;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  border-bottom: 2.5px solid transparent;
  color: var(--text-muted);
  transition: all .15s;
  white-space: nowrap;
  user-select: none;
}
.rtab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
.rtab:hover { color: var(--blue); }

#read-body {
  flex: 1;
  overflow-y: auto;
  background: var(--bg);
  height: calc(100vh - 140px);
}
#read-body.padded { padding: 20px; }

/* ============================================================
   右侧 TOC
   ============================================================ */
#toc-nav {
  width: 180px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: #FAFAFA;
  padding: 0;
  overflow: hidden;
  flex-direction: column;
}

.toc-head {
  font-size: 11px; font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .6px;
  padding: 12px 14px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#toc-list {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

.toc-foot {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.toc-item {
  display: block;
  padding: 5px 12px;
  font-size: 12px; font-weight: 500; color: var(--text-gray);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background .12s, color .12s;
  line-height: 1.5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.toc-item:hover, .toc-item.active {
  color: var(--blue); background: #EFF6FF;
  border-left-color: var(--blue);
}
/* 二级标题：缩进 + 减弱 + 常规字重，与一级拉开层级 */
.toc-item.h3 {
  padding-left: 26px; font-size: 11px; font-weight: 400; color: var(--text-muted);
  position: relative;
}
.toc-item.h3::before {
  content: ''; position: absolute; left: 15px; top: 50%;
  width: 4px; height: 1px; background: var(--border-strong, #CBD5E1);
}
.toc-item.h3:hover, .toc-item.h3.active { color: var(--blue); }

/* 唯一下载按钮 */
.download-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 9px;
  background: var(--orange); color: #fff;
  text-decoration: none; border-radius: 8px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  transition: opacity .15s; border: none;
}
.download-btn:hover { opacity: .85; }
.word-hint {
  margin-top: 7px; font-size: 10px; line-height: 1.5;
  color: var(--text-muted); text-align: center;
}
.word-hint code {
  font-size: 9px; background: #E2E8F0; color: var(--text-dark);
  padding: 0 4px; border-radius: 3px;
}

/* ============================================================
   报告 Markdown / Shadow DOM 渲染
   ============================================================ */
.md-content {
  line-height: 1.7; color: var(--text-dark); padding: 16px;
}
.md-content h1 {
  font-size: 18px; font-weight: 700; color: var(--blue);
  margin: 20px 0 10px; padding: 0 0 6px 12px;
  border-left: 4px solid var(--blue); border-bottom: 1px solid var(--blue-bg);
}
.md-content h1:first-child { margin-top: 0; }
.md-content h2 {
  font-size: 15px; font-weight: 700; color: var(--blue);
  margin: 16px 0 8px; padding: 0 0 4px 10px;
  border-left: 3px solid var(--orange);
}
.md-content h2:first-child { margin-top: 0; }
.md-content h3 {
  font-size: 13px; font-weight: 700; color: var(--text-dark);
  margin: 12px 0 6px; padding-left: 8px;
  border-left: 2px solid var(--border);
}
.md-content h4 {
  font-size: 12px; font-weight: 700; color: var(--text-gray);
  margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .5px;
}
.md-content p { margin: 8px 0; line-height: 1.7; }
.md-content strong { color: var(--blue); font-weight: 700; }
.md-content em { color: var(--text-gray); font-style: italic; }
.md-content ul { padding-left: 0; margin: 8px 0; list-style: none; }
.md-content ul li { padding: 3px 0 3px 20px; position: relative; line-height: 1.6; }
.md-content ul li::before {
  content: ''; position: absolute; left: 6px; top: 10px;
  width: 6px; height: 6px; border-radius: 50%; background: var(--orange);
}
.md-content ol { padding-left: 22px; margin: 8px 0; }
.md-content ol li { margin: 4px 0; line-height: 1.6; }
.md-content blockquote {
  border-left: 3px solid var(--orange); background: #FFFBEB;
  padding: 10px 14px; margin: 10px 0; color: var(--text-gray);
  border-radius: 0 8px 8px 0;
}
.md-content hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.md-content table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
.md-content th { background: var(--blue); color: #fff; font-weight: 600; padding: 7px 10px; text-align: left; }
.md-content td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
.md-content tr:nth-child(even) td { background: var(--blue-bg); }
.md-content code {
  font-family: "SF Mono", "Fira Code", monospace;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 3px; padding: 1px 4px; font-size: 12px;
}
.no-report { text-align: center; padding: 40px 0; color: var(--text-muted); }

/* 骨架屏 */
.skeleton {
  height: 14px;
  background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%);
  background-size: 200% 100%;
  animation: skeleton-wave 1.4s infinite;
  border-radius: 6px; margin-bottom: 10px;
}
.skeleton.wide { width: 100%; }
.skeleton.medium { width: 75%; }
.skeleton.short { width: 45%; }
@keyframes skeleton-wave {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ============================================================
   仪表盘 Tab
   ============================================================ */
.dashboard-section { margin-bottom: 24px; }
.dashboard-section-title {
  font-size: 11px; font-weight: 700; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .8px;
  margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
}
.section-icon { font-size: 14px; }

.metrics-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.metrics-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.metrics-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

.metric-card {
  background: var(--bg); border-radius: 10px;
  padding: 12px 10px; border: 1px solid var(--border); text-align: center;
}
.metric-card .m-label { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-bottom: 4px; }
.metric-card .m-value { font-size: 18px; font-weight: 700; color: var(--text-dark); line-height: 1.2; }
.metric-card .m-unit  { font-size: 11px; color: var(--text-muted); font-weight: 400; }
.metric-card .m-badge {
  display: inline-block; margin-top: 4px;
  font-size: 10px; font-weight: 700;
  padding: 1px 7px; border-radius: 10px;
}

.metric-card.tier-head   { border-color: #BBF7D0; background: #F0FDF4; }
.metric-card.tier-head   .m-value { color: var(--green); }
.metric-card.tier-growth { border-color: #BFDBFE; background: var(--blue-bg); }
.metric-card.tier-growth .m-value { color: var(--blue); }
.metric-card.tier-start  { border-color: var(--border); }
.metric-card.burst-hot   { border-color: #FED7AA; background: #FFF7ED; }
.metric-card.burst-hot   .m-value { color: var(--orange); }
.metric-card.vs-up       { border-color: #BBF7D0; background: #F0FDF4; }
.metric-card.vs-up       .m-value { color: var(--green); }
.metric-card.vs-down     { border-color: #BFDBFE; background: var(--blue-bg); }
.metric-card.vs-down     .m-value { color: var(--blue-light); }

.detail-row {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 8px 0; border-bottom: 1px solid var(--bg);
  font-size: 13px; gap: 10px;
}
.detail-row:last-child { border-bottom: none; }
.detail-row .dr-label { color: var(--text-muted); flex-shrink: 0; line-height: 1.5; }
.detail-row .dr-value { font-weight: 500; text-align: right; line-height: 1.5; }

.video-title-box {
  background: var(--blue-bg); border-left: 3px solid var(--blue);
  padding: 8px 12px; border-radius: 0 6px 6px 0;
  font-size: 12px; line-height: 1.5; color: var(--text-dark); word-break: break-all;
}
.tier-pill {
  display: inline-block; padding: 2px 8px; color: #fff;
  border-radius: 4px; font-size: 11px; font-weight: 700; margin-right: 6px;
}
.path-pill {
  display: inline-block; padding: 2px 8px;
  background: var(--blue-bg); color: var(--blue);
  border-radius: 4px; font-size: 11px; font-weight: 600;
}
.burst-bar-wrap { margin-top: 5px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.burst-bar-fill { height: 100%; border-radius: 2px; }
.eng-note { font-size: 11px; font-weight: 400; color: var(--text-muted); }
.dashboard-wrap { padding-bottom: 16px; }

/* 仪表盘 signature 区块 */
.sig-box {
  background: #F8FAFC;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text-gray);
  line-height: 1.5;
  margin: 8px 0;
  word-break: break-all;
}

/* 报告完整性评分 */
.integrity-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 0; font-size: 12px; border-bottom: 1px solid var(--bg);
}
.integrity-row:last-child { border-bottom: none; }
.integrity-score-big {
  font-size: 28px; font-weight: 700; color: var(--blue);
  text-align: center; margin: 8px 0 4px;
  line-height: 1;
}
.integrity-score-label {
  font-size: 11px; color: var(--text-muted);
  text-align: center; margin-bottom: 10px;
}

/* 快捷操作区块 */
.quick-ops { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.quick-op-btn {
  flex: 1; min-width: 120px;
  padding: 9px 12px;
  background: var(--blue-bg); color: var(--blue);
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  text-align: center; transition: background .12s;
}
.quick-op-btn:hover { background: #DBEAFE; }
.quick-op-note { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

/* ── 版本历史 Tab ── */
.timeline { position: relative; padding-left: 24px; }
.timeline::before {
  content: ''; position: absolute;
  left: 6px; top: 8px; bottom: 8px;
  width: 2px; background: var(--border); border-radius: 2px;
}
.timeline-item { position: relative; margin-bottom: 20px; }
.timeline-item::before {
  content: ''; position: absolute;
  left: -21px; top: 8px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--border); border: 2px solid var(--white);
  box-shadow: 0 0 0 2px var(--border);
}
.timeline-item.current::before { background: var(--blue); box-shadow: 0 0 0 2px var(--blue); }
.tl-date { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.tl-card {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px;
}
.timeline-item.current .tl-card { border-color: var(--blue); background: var(--blue-bg); }
.tl-card .tl-version { font-size: 10px; font-weight: 700; color: var(--blue); margin-bottom: 4px; font-family: monospace; }
.tl-card .tl-title { font-size: 13px; font-weight: 500; color: var(--text-dark); margin-bottom: 6px; line-height: 1.4; }
.tl-card .tl-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; }
.tl-current-label {
  display: inline-block; font-size: 10px;
  background: var(--blue); color: #fff;
  border-radius: 4px; padding: 1px 6px; font-weight: 600;
  margin-left: 6px; vertical-align: middle;
}
.no-history { text-align: center; padding: 30px 0; color: var(--text-muted); font-size: 13px; }

/* ── 历史 tab：两段（同账号其它视频 / 本视频历史版本）── */
.hist-seg-title {
  font-size: 13px; font-weight: 700; color: var(--text-dark);
  margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.hist-count {
  display: inline-block; font-size: 11px; font-weight: 700;
  background: var(--blue-bg); color: var(--blue);
  border-radius: 9px; padding: 0 7px; margin-left: 4px;
}
.sibling-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px;
}
.sibling-card {
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  background: var(--white); cursor: pointer; transition: border-color .12s, box-shadow .12s;
}
.sibling-card:hover { border-color: var(--blue); box-shadow: 0 2px 8px rgba(30,58,138,.08); }
.sib-title { font-size: 12px; font-weight: 600; color: var(--text-dark); line-height: 1.4;
  margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sib-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }

/* ── 主页账号卡（同账号多视频折叠）── */
.acct-count-badge {
  position: absolute; top: 0; left: 0;
  background: var(--blue); color: #fff; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 10px 0 8px 0;
}
.acct-toggle {
  margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--blue);
  cursor: pointer; user-select: none; padding: 4px 0;
}
.acct-toggle:hover { text-decoration: underline; }
.acct-vid-list { margin-top: 6px; border-top: 1px dashed var(--border); padding-top: 6px; }
.acct-vid-item {
  padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: background .12s;
  border-left: 2px solid transparent;
}
.acct-vid-item:hover { background: var(--blue-bg); border-left-color: var(--blue); }
.avi-title { font-size: 12px; color: var(--text-dark); line-height: 1.4; margin-bottom: 3px; }
.avi-meta { font-size: 10px; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }

/* ============================================================
   Footer
   ============================================================ */
#footer {
  background: var(--white);
  border-top: 1px solid var(--border);
  padding: 8px 16px;
  font-size: 11px; color: var(--text-muted);
  text-align: center; flex-shrink: 0;
}

\n<p>你发的内容,大方向是「<strong>健身运动<\/strong>」。<\/p>\n<p><strong>你现在的水平<\/strong><\/p>\n<ul>\n<li>6438222 个粉丝、比较成熟的号,一共发了 2341 条作品。<\/li>\n<li>你的视频平均 <strong>73966 个赞<\/strong>,最好的一条有 <strong>790105 个赞<\/strong>。<\/li>\n<li>👉 <strong>这说明<\/strong>:你做得出 790105 赞的爆款,但没稳下来(平均才 73966)——<strong>潜力够,缺的是把「偶然爆」变成「稳定爆」<\/strong>。下面第五段会给你怎么做。<\/li>\n<\/ul>\n<p><strong>你发的这条视频表现怎么样<\/strong><\/p>\n<ul>\n<li>这条讲的是:「镜子里的你，照片里的你，哪一个才是真的你？ 为什么镜子里的你会更好看…」<\/li>\n<li>数据:183740 个赞、5239 条评论、57384 次转发、32988 个收藏。<\/li>\n<li>跟你自己比:<strong>明显高于你平时(你平均 73966 个赞),算你的一条小爆款,值得好好复盘<\/strong>。<\/li>\n<\/ul>\n<h2>💬 用户在评论区说了什么(这是最真实的反馈)<\/h2>\n<blockquote>采到 189 条评论(已滤掉 11 条疑似引流/水军 🟩)。<\/blockquote>\n<blockquote>⚠️ 评论代表「愿意发声的那部分人」,不等于全部观众(🟨 样本偏差);采到的非全量、热评经平台算法排序(🟥 平台黑盒)。<\/blockquote>\n<h3>🎯 购买意向信号(🟩 计数·热度即转化前兆)<\/h3>\n<ul>\n<li>评论里反复在问:「多少」1 次、「近」1 次、「离」1 次<\/li>\n<li><strong>诊断重点<\/strong>:体验课钩子转化 + 位置匹配<\/li>\n<li><strong>怎么接<\/strong>:问体验课多 → 主页挂体验课钩子;问位置多 → 标 POI<\/li>\n<\/ul>\n<h3>❓ 高频问题 = 下一条选题<\/h3>\n<ul>\n<li>这个可以吗？我感觉很舒服。（约 1 条）<\/li>\n<li>主播主播[紫薇别走]上下翻转会不会更好看？（约 1 条）<\/li>\n<li>我有很多张脸啊，你说的是哪张脸？[愉快]（约 1 条）<\/li>\n<\/ul>\n<blockquote>说明:本次评论聚类/情感分析未接到分析模型,只输出了可直接计数的意向信号与高频问题(确定项),情感/异议留待模型可用时补全——<strong>没瞎编<\/strong>。<\/blockquote>\n<h2>你的主页接得住流量吗<\/h2>\n<blockquote>转化链是「内容引流 → 主页 → 关注/成交」。一条视频把陌生人钩进来,他在 <strong>3 秒内<\/strong>用你的主页(头像/昵称/简介/置顶/合集/橱窗)判断要不要关注你。主页接不住 = 引来的流量在落地页漏光。<\/blockquote>\n<h3>逐元素体检(🟩 确定项 / 🟨 待补字段 / 🟥 合规或黑盒)<\/h3>\n<table><thead><tr>\n<th>元素<\/th><th>现状<\/th><th>该长啥样<\/th><th>怎么改<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td>🟩 昵称<\/td><td>丁香医生<\/td><td>含「身份/领域」或「地域」词,非乱码纯网名<\/td><td>昵称加上你的领域或所在城市(如「XX美甲-成都」),让陌生人一眼记住你是谁<\/td>\n<\/tr>\n<tr>\n<td>🟩 简介 Bio<\/td><td>(空)<\/td><td>「你是谁+给谁+给什么」三要素齐·含 CTA·无明文微信号(合规)<\/td><td>简介现在是空的——补一句话「我是谁+给谁+给什么」,这是承接陌生人的第一道门<\/td>\n<\/tr>\n<tr>\n<td>🟨 头像<\/td><td>(采集端未提供头像 URL)<\/td><td>清晰、与定位一致、非默认头像<\/td><td>采集端补头像 URL 后可判默认头像<\/td>\n<\/tr>\n<tr>\n<td>🟨 企业认证<\/td><td>(采集端未提供认证字段)<\/td><td>实体店/B2B 应做企业认证(解锁地址组件/私信卡片)<\/td><td>采集端补 enterprise_verify 字段后可检测<\/td>\n<\/tr>\n<tr>\n<td>🟨 置顶视频<\/td><td>(采集端未提供该字段)<\/td><td>置顶=转化率最高那条<\/td><td>采集端补 is_top 字段后可检测置顶视频<\/td>\n<\/tr>\n<tr>\n<td>🟨 合集<\/td><td>(采集端未提供该字段)<\/td><td>≥1 个按主题归类的合集<\/td><td>采集端补 mix_count 字段后可检测合集<\/td>\n<\/tr>\n<tr>\n<td>🟨 橱窗<\/td><td>(采集端未提供该字段)<\/td><td>带货号必有橱窗+商品与内容强相关<\/td><td>采集端补 window_product_count 字段后可检测橱窗<\/td>\n<\/tr>\n<tr>\n<td>🟨 地址/POI<\/td><td>(采集端未提供该字段)<\/td><td>实体店必挂 POI(同城流量+团购入口)<\/td><td>采集端补 poi 字段后可检测地址/POI<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>⚡ 漏斗断点:引流强但主页承接弱(置信度 70%)<\/h3>\n<p>⚡ 问题不在内容(内容已出圈/爆了),在主页——陌生人被钩进来,3 秒看不懂你是谁、找不到下单口,流量在落地页漏光了。<\/p>\n<p><strong>判断依据<\/strong>:<\/p>\n<ul>\n<li>这条 183741 赞 &gt; 平时 2 倍(73966 均赞),爆了<\/li>\n<\/ul>\n<p><strong>立即改<\/strong>:简介现在是空的——补一句话「我是谁+给谁+给什么」,这是承接陌生人的第一道门;简介现在是空的——补一句话「我是谁+给谁+给什么」,这是承接陌生人的第一道门<\/p>\n<h3>承接完整度:🟥 0/100<\/h3>\n<blockquote>(只对采集端可读的主页元素打分;打灰的待补字段不计入,不冒充)<\/blockquote>\n<blockquote>⚠️ 以下元素采集端暂未提供字段,<strong>没假装检测<\/strong>:头像、企业认证、置顶视频、合集、橱窗、地址/POI——补上对应采集字段后可纳入诊断。<\/blockquote>\n<blockquote>主页访问率/跳转率/关注转化率是抖音后台黑盒(🟥),需账号主投喂创作者中心后台截图才能诊断——本段只看可读的主页结构。<\/blockquote>\n<blockquote>说明:主页结构属确定性检测(🟩 高信任),但「行业元素权重」是经验排序(🟨 需回测校准);头像只做「非默认/清晰度」客观粗判,<strong>不做人脸识别<\/strong>(PIPL 红线)。<\/blockquote>\n<h2>二、你这 10 条作品藏着的规律(这才是重点)<\/h2>\n<p>单看一条看不出门道——我把你最近 10 条作品<strong>横着放一起看<\/strong>,规律就出来了:<\/p>\n<p><strong>哪些是你的爆款、它们有什么共同点<\/strong><\/p>\n<ul>\n<li>你有 <strong>3 条<\/strong>明显高于平均(超均赞 2 倍)的作品。其中最戳人的那条是「如何通过小便颜色判断饮水量？ #健康科普 #喝水…」(790105 赞)。<\/li>\n<li>这些高赞作品最常出现的方向是:<strong>健康科普、喝水、便秘<\/strong> —— 这是你<strong>已经验证过、观众买账<\/strong>的内容方向,别犹豫,多做这个。<\/li>\n<\/ul>\n<p><strong>高赞的 和 低赞的,差在哪(这是能复制的关键)<\/strong><\/p>\n<ul>\n<li>高赞作品更常带 <strong>喝水、便秘、腹泻<\/strong> 这些方向(低赞的没有);高赞作品的 <strong>评论、收藏<\/strong> 明显更高(说明这些内容更能激发互动)。<\/li>\n<li><strong>说人话:你只要多做高赞那批的方向,数据大概率比其他内容好——这是你自己的数据告诉你的,比抄别人靠谱。<\/strong><\/li>\n<\/ul>\n<p><strong>你最近状态在涨还是在掉<\/strong><\/p>\n<ul>\n<li>📉 在掉——近期不如早期,该回头看看早期哪些做对了。<\/li>\n<\/ul>\n<h2>三、你现在最该解决的一件事:账号「太杂」<\/h2>\n<p>你最近视频贴的标签是这些:<strong>健康科普、减肥、科普、冷知识、减脂、女生必看、拍照 权音乐/素材<\/li>\n<li>背景音乐用平台曲库的免费商用音乐，别用来路不明的（版权风险会限流）<\/li>\n<\/ul>\n<p><strong>你在赛道里大概什么位置<\/strong><\/p>\n<ul>\n<li>你目前属于「<strong>头部<\/strong>」（赛道里的成熟号）。<\/li>\n<li>注：按粉丝量粗分·非赛道真实排名(要精确得看竞品·L4)。<\/li>\n<\/ul>\n<p><strong>你赛道现在是涨还是跌<\/strong><\/p>\n<ul>\n<li>⚠️ 这次<strong>没接到赛道大盘趋势数据<\/strong>——赛道整体在涨还是跌、红利窗口还在不在，需要接平台官方趋势/行业研报（官方没开放 API，得半自动补），暂时给不了，<strong>宁可告诉你「没接到」也不瞎编<\/strong>。<\/li>\n<\/ul>\n<p><strong>当前平台热点（可蹭·但先看跟你赛道搭不搭）<\/strong><\/p>\n<ul>\n<li>育碧创始人克劳德遇飞机失事坠亡、郭士强称杨瀚森将出战对阵荷兰、张雨霏遗憾无自己的单项世界纪录、来佛山沉浸式观赏叠滘龙舟漂移、中考各科老师送祝福<\/li>\n<li>注：这是当前抖音热榜（实时拉取），不是你赛道专属——能自然结合的才蹭，硬蹭反而违和。<\/li>\n<\/ul>\n<blockquote>环境数据来自合规授权渠道（国内不出境）。平台规则是官方明文；赛道趋势属半自动补充，<strong>平台算法的具体权重是黑盒，谁说得精确都是猜的<\/strong>，不作硬结论。<\/blockquote>\n<h2>🎯 明天就能做的 3 件事（按先后排好了）<\/h2>\n<blockquote>上面诊断说了一堆，到底<strong>先做哪件<\/strong>？我按「见效快、最省事、最紧急」排好序了——<strong>别贪多，先把前几件做完<\/strong>，攒个快速正反馈再往下走。<\/blockquote>\n<ul>\n<li>这次没有识别到明确的待办行动项——可能是诊断信息不足，或你的账号当前没有突出短板。补上更完整的账号/作品数据后，这里会给你「明天就能做的具体几件事」。<\/li>\n<\/ul>\n<blockquote>⚠️ 排序权重（ROI=1.0 / 难度=1.0 / 紧急=0.8）是初始经验值，非铁律——会用真实回测数据（attribution_cache）持续校准。每件下方都给了打分拆解，不是玄学评分。<\/blockquote>\n<h2>七、这份分析有多可信(实话实说)<\/h2>\n<ul>\n<li>上面的数字(粉丝、点赞、作品、标签、规律)<strong>都是你抖音账号的真实公开数据,没有一个是编的<\/strong>。<\/li>\n<li>但有两个诚实的提醒:<\/li>\n<ol>\n<\/ul>\n<li>这次<strong>只看了你一个号、一个数据来源<\/strong>,没跟竞品交叉验证,所以给你的是「靠谱的方向」,别当成 100% 精确的结论。<\/li>\n<li>有些关键数据抖音<strong>不公开<\/strong> —— 比如完播率、流量从哪来、有没有转化 —— 这些拿不到,我<strong>宁可告诉你「拿不到」,也绝不瞎编<\/strong>。<\/li>\n<\/ol>\n<h2>八、30 天后来复诊<\/h2>\n<p>这份报告是 <strong>2026-06-22<\/strong> 的快照，账号状态会随你的更新在变。<\/p>\n<p><strong>建议在以下任一情况下回来复诊：<\/strong><\/p>\n<ul>\n<li>📅 距今满 30 天（约 2026-07-22）——看执行后有没有往对的方向走<\/li>\n<li>📈 粉丝或均赞出现明显变化（涨了 30%+ 或跌了 20%+）——数据变了，诊断结论也要更新<\/li>\n<li>🎯 换了内容方向，或新发了 10 条以上——积累了新样本才能看出新规律<\/li>\n<li>💡 照着建议做了一段时间，想验证到底有没有效——验证闭环，让数据说话<\/li>\n<\/ul>\n<blockquote>越用越准：你的视听分析结果会积累到账号归因库——多分析几次，「爆款视听公式」的置信度会越来越高。<\/blockquote><\/div>\n<div style=\"margin-top:32px;padding-top:12px;border-top:1px solid #E2E8F0;font-size:11px;color:#94A3B8;text-align:center\">\n  元 题 |<\/p>\n<table><thead><tr>\n<th>🟨 头像<\/th><th>(采集端未提供头像 URL)<\/th><th>清晰、与定位一致、非默认头像<\/th><th>采集端补头像 URL 后可判默认头像<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td>🟨 合集<\/td><td>(采集端未提供该字段)<\/td><td>≥1 个按主题归类的合集<\/td><td>采集端补 mix_count 字段后可检测合集<\/td>\n<\/tr>\n<tr>\n<td>🟨 置顶视频<\/td><td>(采集端未提供该字段)<\/td><td>置顶=转化率最高那条<\/td><td>采集端补 is_top 字段后可检测置顶视频<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>主页结构基本完整,引流也还在积累——继续做内容,主页保持。<\/blockquote>\n<blockquote>⚠️ 以下元素采集端暂未提供字段,<strong>没假装检测<\/strong>:头像、合集、置顶视频——补上对应采集字段后可纳入诊断。<\/blockquote>\n<blockquote>主页访问率/跳转率/关注转化率是抖音后台黑盒(🟥),需账号主投喂创作者中心后台截图才能诊断——本段只看可读的主页结构。<\/blockquote>\n<blockquote>说明:主页结构属确定性检测(🟩 高信任),但「行业元素权重」是经验排序(🟨 需回测校准);头像只做「非默认/清晰度」客观粗判,<strong>不做人脸识别<\/strong>(PIPL 红线)。<\/blockquote>\n<h2>二、你这 10 条作品藏着的规律(这才是重点)<\/h2>\n<p>单看一条看不出门道——我把你最近 10 条作品<strong>横着放一起看<\/strong>,规律就出来了:<\/p>\n<p><strong>哪些是你的爆款、它们有什么共同点<\/strong><\/p>\n<ul>\n<li>你这批作品数据比较平均,还没跑出明显爆款——说明方向还在试,需要再多发几条找感觉。<\/li>\n<\/ul>\n<p><strong>高赞的 和 低赞的,差在哪(这是能复制的关键)<\/strong><\/p>\n<ul>\n<li>高赞作品更常带 <strong>特色农产、产地好物、北川魔芋<\/strong> 这些方向(低赞的没有);高赞作品的 <strong>评论、收藏<\/strong> 明显更高(说明这些内容更能激发互动)。<\/li>\n<li><strong>说人话:你只要多做高赞那批的方向,数据大概率比其他内容好——这是你自己的数据告诉你的,比抄别人靠谱。<\/strong><\/li>\n<\/ul>\n<p><strong>你最近状态在涨还是在掉<\/strong><\/p>\n<ul>\n<li>📉 在掉——近期不如早期,该回头看看早期哪些做对了。<\/li>\n<\/ul>\n<h2>三、你做得对的地方<\/h2>\n<p>你的产品/业务方向比较集中,系统能认清你是做「产业带货 / B2B供货」的——这是好事,接着往深里做。<\/p>\n<h2>四、你有一个别人抢不走的优势<\/h2>\n<p>别小看你手里的东西:<strong>真实的产品力 / 源头优势<\/strong>。<\/p>\n<p>你做的是实打实的业务(「餐饮门店直供拿货，缩减成本拉高利润，规格齐全供货稳定 #餐饮供货#源…」),背后是真实的供应链、源头和专业积累 —— 这种「看得见摸得着」的真东西,比空洞营销可信得多,同行也抄不走。<\/p>\n<p>现在内容同质化严重,<strong>恰恰是你这种「有真实产品/源头背书」的生意号,最容易建立信任、撬动询单<\/strong>。<\/p>\n<h2>五、接下来具体怎么做(照着做就行)<\/h2>\n<p><strong>按重要程度排好了——先做 🔴 的,🟡 有余力再做:<\/strong><\/p>\n<p><strong>🔴 第 1 步｜最重要·这个月就做：把你已经验证过的方向做深<\/strong><\/p>\n<p>上面看出来了——你的高赞作品集中在 <strong>北川魔芋姐、魔芋工厂、餐饮食材<\/strong>。别东一榔头西一棒,接下来一个月就围绕这个方向做深做透,这是你自己数据证明有效的路。<\/p>\n<p><strong>🔴 第 2 步｜本周就能改：把最戳客户痛点的卖点,放到开头 3 秒<\/strong><\/p>\n<p>客户最关心什么(省钱?稳定供货?品质?)—— 一开口就说那句最戳痛点的话,别埋在中间。<\/p>\n<p><strong>🟡 第 3 步｜有余力再做：把你那条 383 个赞的视频研究透<\/strong><\/p>\n<p>翻出来,看它讲了什么、开头怎么说、戳中了什么 —— 然后多做那个方向。<strong>放大你自己验证过的成功,比抄别人靠谱<\/strong>。<\/p>\n<h2>六、你这个号整体判断:处在什么阶段、该往哪走<\/h2>\n<p><strong>怎么判断的<\/strong>(不是拍脑袋)：看你粉丝量(4,645)、近期数据在掉、方向比较集中——综合下来：<\/p>\n<ul>\n<li><strong>所处阶段<\/strong>:<strong>成长期·但近期遇瓶颈<\/strong>(有基础了,但作品数据近期在下滑——回头看早期哪些做对了,把它找回来)。<\/li>\n<li><strong>你抄不走的护城河<\/strong>:真实的产品力和源头优势(「产业带货 / B2B供货」的供应链、专业积累,同行抄不走)。<\/li>\n<li>你做的「<strong>产业带货 / B2B供货<\/strong>」是个值钱的方向:这是实打实的生意账号·适合用内容做获客/招商/批发引流·变现路径比纯流量号清晰得多。<\/li>\n<li>你有过小爆款,说明天花板不低;关键是把「偶然」变成「稳定」。<\/li>\n<li>变现走「精准」不是「泛流量」:1000 个对的客户 &gt; 10 万泛粉,把内容当获客工具、盯询单转化。<\/li>\n<\/ul>\n<h2>趋势轨迹：你在涨还是在衰（看导数不看存量）<\/h2>\n<blockquote>同样 4.2 万粉，一个在翻倍涨、一个正在崩——<strong>方案完全相反<\/strong>。「现在多少粉」不如「接下来怎么走」重要。<\/blockquote>\n<p><strong>① 作品基线趋势<\/strong>：➡️ 平稳（缺突破口）<\/p>\n<ul>\n<li>把你 10 条作品按发布时间排开看基线（已剔除 0 条爆款离群，避免一条爆款把判断带偏）。趋势不显著（更可能是短期波动·按平稳处理）。<\/li>\n<li>⚠️ 样本 10–20 条·参考级（再多发几条结论更稳）。<\/li>\n<\/ul>\n<p><strong>② 粉丝增速趋势<\/strong><\/p>\n<ul>\n<li>📦 <strong>需复访<\/strong>：粉丝增速曲线要至少 2 次诊断（≥4 个时间点）才能画。这次只有单次快照——下次复诊时会自动补上「加速涨/减速涨/净掉粉」的判断。<\/li>\n<\/ul>\n<p><strong>③ 转折点：哪条作品是分水岭<\/strong><\/p>\n<ul>\n<li>第 <strong>6<\/strong> 条附近出现 <strong>负向↓转折<\/strong>（基线跃迁 -63%）。<\/li>\n<li>✅ 可归因到创作动作（伴随主题/形式变化）（新增方向：低脂轻食、健康代餐、员工福利）——查这次改动是不是改坏了。<\/li>\n<\/ul>\n<p><strong>④ 衰退预警<\/strong><\/p>\n<ul>\n<li>🟥 <strong>作品基线断崖<\/strong>：近段作品基线较前期跌 63%（&gt;40%） → 查改版动作（看转折点检测），是不是某次改坏了<\/li>\n<\/ul>\n<blockquote>⚠️ <strong>诚实说<\/strong>：①基于 10 条作品；②你这赛道季节性<strong>中<\/strong>（淡旺季会让数据起伏，别把淡季掉量当衰退）；③转折点已强制排除外部脉冲才归因。短期波动≠趋势，样本不足时我宁可不下结论。<\/blockquote>\n<blockquote>大盘提醒：若全赛道同期都在跌，那是平台大盘不是你的账号问题（需赛道基准做相对趋势·见对标段）。<\/blockquote>\n<h2>同赛道对标：你在同行里排第几<\/h2>\n<blockquote>绝对数字（比如「平均 105 赞」）脱离赛道没意义——餐饮号 6438 赞可能垫底，知识号 6438 赞可能头部。这一段把你换算成<strong>相对坐标<\/strong>。<\/blockquote>\n<blockquote>对标范围：<strong>产业带货 / B2B供货<\/strong>赛道 · <strong>微号<\/strong>体量段（4,645 粉）。<\/blockquote>\n<p><strong>你在同赛道同体量号里的各维度位次（分位越高越好）：<\/strong><\/p>\n<ul>\n<li><strong>互动率<\/strong>（B 互动质量）：你 2.3% → <strong>P10（垫底）<\/strong> 🔴<strong>（主短板·先补这个）<\/strong>　〔基准来源：行业经验 · ⚠️ 参考·样本不足（经验带·非真实分位）〕<\/li>\n<\/ul>\n<p>👉 <strong>一句话<\/strong>：你最拖后腿的是 <strong>互动率<\/strong>（垫底），木桶水位由它决定——<strong>先补这块<\/strong>，比哪儿都强。<\/p>\n<p>目标：把它冲到 <strong>6.1%<\/strong>（同赛道 P60 水平）。<\/p>\n<blockquote>⚠️ <strong>诚实说<\/strong>：当前基准多为行业经验带（自建样本库累积中），分位是<strong>参考级<\/strong>不是精确级。等同赛道同体量样本攒过 100 个，会自动升级为可信级真实分位。<\/blockquote>\n<blockquote>口径统一：互动率=赞+评+转/播放（口径字典 v1）；只用中位数+分位带做锚，不用易被爆款拉偏的均值。<\/blockquote>\n<h2>商业转化诊断（三层）<\/h2>\n<blockquote>这是三层商业诊断：赛道值不值做 → 你该走哪条路变现 → 大概能赚多少。<\/blockquote>\n<blockquote>所有数字都是<strong>行业经验区间，不是对你账号的精确预测<\/strong>——说完你知道方向就够了。<\/blockquote>\n<h3>层A · 你所在赛道值多少钱<\/h3>\n<p><strong>你的赛道「产业带货 / B2B供货」商业价值：S档（顶级·单粉极贵）<\/strong><\/p>\n<ul>\n<li>单粉价值参考：极高（50–500元/线索 · 10–50元/粉·经验区间·需校准）<\/li>\n<li>投产比：★★★★★<\/li>\n<li>为什么这样判断：B端/产业带货号·垂直业务明确·精准引流变现效率高·2万粉即可回本<\/li>\n<\/ul>\n<blockquote>⚠️ 单粉价值为行业经验区间（需校准）——请结合你的真实成交数据校准。<\/blockquote>\n<h3>层B · 你该走哪条路变现<\/h3>\n<p><strong>粉丝关系深度（R-M1）：「中」<\/strong> · 内容类型（R-M2）：「引」 · 赛道付费意愿（R-M3）：极高（职场/副业可达数万元·健康/育儿数…<\/p>\n<p><strong>主路径 ✅：私域变现<\/strong><\/p>\n<ul>\n<li>为什么：B端/到店型内容·私域变现天花板最高·粉丝=潜在合作客户<\/li>\n<li>门槛情况：私域变现无硬门槛·任意阶段均可开始建私域·越早越好。<\/li>\n<\/ul>\n<p><strong>次路径：知识付费<\/strong><\/p>\n<ul>\n<li>为什么：B端账号可封装「选品/供应链」经验做课·增加变现维度<\/li>\n<\/ul>\n<p><strong>❌ 禁忌路径：直播打赏<\/strong><\/p>\n<ul>\n<li>不建议走这条：B端账号打赏路径不匹配受众属性·浪费信任资产<\/li>\n<\/ul>\n<p><strong>从内容到转化的关键纪律：<\/strong><\/p>\n<ul>\n<li>前20–50条：纯价值内容，禁止过早变现（信任铺垫期）<\/li>\n<li>之后：3:7 内容比植入（产品即工具·钩好奇心，不是购买欲）<\/li>\n<li>只有粉丝主动询问才启动显性转化·广告≤30%红线<\/li>\n<\/ul>\n<blockquote>铁律：买单是顺理成章，不是说服；需要费力说服 = 上游信任/精准出了问题。<\/blockquote>\n<h3>层C · 大概能赚多少（经验区间·诚实说）<\/h3>\n<p><strong>月产出估算（私域变现路径）：<\/strong><\/p>\n<p>私域年贡献 ≈ 公域的5–20倍（方法论结论·经验区间）。核心公式：月产出 ≈ 私域人数 × 月活率(20–40%) × 月付费率(5–15%) × 客单价。（⚠️ 私域人数/月活率需你实际沉淀后才能估·现在无法给精确值）<\/p>\n<p><strong>回本周期参考：<\/strong> 私域变现：前期建社群/引流周期长（3–12个月）·但复购率最高·一旦启动回本快（经验区间）<\/p>\n<p><strong>LTV/CAC 参考：<\/strong> LTV/CAC：私域最高·LTV/CAC 可达10–50（高复购·低获客成本·经验区间·需校准）<\/p>\n<p><strong>健康判据：<\/strong> LTV/CAC &gt; 3 = 健康 · &lt; 1 = 亏损 · 回本周期 &lt; 6个月为优<\/p>\n<p><strong>⚠️ 以下数据平台不公开（黑盒），上面的估算无法精确——想要更准确的诊断，把后台截图传给我：<\/strong><\/p>\n<ul>\n<li>完播率（平台黑盒·需后台截图投喂）<\/li>\n<li>流量来源分布（黑盒）<\/li>\n<li>真实进店率/成交率（黑盒）<\/li>\n<li>粉丝画像（黑盒·影响付费率估算）<\/li>\n<\/ul>\n<blockquote>⚠️ 以上所有数值均为「行业经验区间」，不是对你账号的确切数字承诺。进店率/完播率/成交率/粉丝画像/真实销量是平台黑盒，需用你自己的后台数据校准。相对量级参考有效；具体账单请结合真实运营数据。<\/blockquote>\n<h2>商业数据参考（合规公开数据 · 标黑盒缺口）<\/h2>\n<blockquote>以下数据来自公开行业资料，标注了哪些真实可信、哪些是黑盒——<strong>宁可告诉你「没接到」，也不瞎编数字<\/strong>。<\/blockquote>\n<h3>1️⃣ 你所在赛道的商业体量<\/h3>\n<ul>\n<li>「产业带货 / B2B供货」赛道暂无公开 GMV 分级数据，建议参考艾瑞/QuestMobile 行业报告。<\/li>\n<li>⚠️ 精确 GMV 数字属平台黑盒，仅精选联盟/抖音官方报告有定向披露。<\/li>\n<li>📌 数据来源：—<\/li>\n<\/ul>\n<h3>2️⃣ 带货/合作佣金率参考<\/h3>\n<ul>\n<li><strong>全品类<\/strong> 品类行业佣金率通常在 <strong>5% – 30%<\/strong>。<\/li>\n<li>如果你目前的佣金率低于 5%，可以和品牌方谈——这个品类的空间通常到得了 30%。<\/li>\n<li>📌 区间来自行业公开政策，实际佣金率因品牌和达人谈判而异。真实在投单品佣金请从精选联盟达人端查询（需账号授权）。<\/li>\n<li>📌 数据来源：抖音精选联盟官方政策 + 行业研报公开数据（2026）<\/li>\n<\/ul>\n<h3>3️⃣ 广告合作理论报价区间（星图参考）<\/h3>\n<ul>\n<li>北川魔芋姐｜赵娟 目前粉丝量 4,645，通常低于 5000 粉时广告商单较难接洽。先做粉丝积累，待过万后报价会更清晰。<\/li>\n<\/ul>\n<h3>4️⃣ 商品比价 · 带货品竞争力<\/h3>\n<ul>\n<li class=\"act-red\">🔴 <strong>商品历史比价（真实价格 vs 历史均价）<\/strong>：需接慢慢买开放 API——MVP 阶段暂未接入，可由你提供商品详情页截图来补充诊断。<\/li>\n<li>核心诊断问题：你挂的链接定价是偏高还是偏低？佣金率高不高？这两个点对转化率影响超过 80% 的内容质量——<strong>东西再好，贵于市场均价 20%+，转化就卡在价格<\/strong>。<\/li>\n<\/ul>\n<h3>⚠️ 这些还是黑盒·拿不到·诚实告你<\/h3>\n<ul>\n<li class=\"act-red\">🔴 真实销量（GMV·商品维度）— 平台不公开·只有品牌方知道<\/li>\n<li class=\"act-red\">🔴 完播率 / 流量来源 / 粉丝画像 — 罗盘后台·只有账号主有<\/li>\n<li class=\"act-red\">🔴 商单实际成交价 — 主播/机构内部数据<\/li>\n<li class=\"act-red\">🔴 蝉妈妈等第三方平台的精确数字 — 仅作方向参考·禁作精确结论（合规红线）<\/li>\n<\/ul>\n<h3>💬 你补充的商业后台数据<\/h3>\n<p>（以下来自账号主提供的投喂数据·仅用于本次诊断·不对外传播）<\/p>\n<ul>\n<li>commission：{'category': '全品类', 'rate_low_pct': 5.0, 'rate_high_pct': 30.0, 'source': '抖音精选联盟官方政策 + 行业研报公开数据（2026）', 'note': '区间来自行业公开政策，实际佣金率因品牌和达人谈判而异。真实在投单品佣金请从精选联盟达人端查询（需账号授权）。', 'matched_input': '产业带货 / B2B供货'}<\/li>\n<li>gmv：{'category': '产业带货 / B2B供货', 'tier': '未知', 'desc': '该品类暂无公开 GMV 分级数据', 'source': '—', 'warning': '精确 GMV 数字属平台黑盒，仅精选联盟/抖音官方报告有定向披露。'}<\/li>\n<li>xingtu：{'follower': 4645, 'price_low_cny': 300.0, 'price_high_cny': 464.0, 'cpm_track_key': '通用', 'formula': '粉丝(4,645) × CPM(0.03-0.1元/粉) · 保底300元', 'source': '巨量星图公开参考定价模型（2025-2026）', 'calibration_note': '理论报价区间，实际签单受互动率/垂直度/排他条款影响。互动率 &gt;5% 可上浮 20-50%；冷门赛道/低互动可能低于下限。真实市场价需看近期同体量同赛道达人实际报价（仅账号主自知）。'}<\/li>\n<\/ul>\n<blockquote>商业数据来源：公开行业政策/研报（佣金率/GMV档）+ 巨量星图公开定价模型（报价）。慢慢买比价/精选联盟真实佣金/罗盘黑盒数据待账号主授权后接入。平台算法权重永久黑盒，谁说得精确都是猜的，本报告不作硬结论。<\/blockquote>\n<h2>精准转化方案<\/h2>\n<blockquote>不是泛泛「你可以带货」——这是根据你这个号的真实数据，定制的从内容到成交路径。<\/blockquote>\n<h3>A. 你的转化阶段：信任铺垫期<\/h3>\n<p><strong>判断依据<\/strong>：发布 123 条、4645 个粉丝——粉丝积累不足(建议先到5000)，还没到植入时机。<\/p>\n<p><strong>粉丝关系深度<\/strong>：深互动——评论/收藏比率高，说明已有一批真正认可你的粉丝，转化窗口打开。<\/p>\n<p><strong>现阶段该怎么做<\/strong>：先把内容做扎实、发够量、让系统认清你是谁。这阶段每条都要服务「他为什么关注我」，不碰转化，稳住。<\/p>\n<p>❌ R-C5红线：禁止显性转化·不接商单·不放外链·不植入产品<\/p>\n<h3>B. 这条视频的转化钩子（最多3个）<\/h3>\n<table><thead><tr>\n<th>钩子<\/th><th>建议<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td>🎣 需求激活钩（前3秒）<\/td><td>前3秒补一句对着目标用户说的痛点句：讲「你遇过这个问题吗？」比「今天分享一个方法」完播率更高<\/td>\n<\/tr>\n<tr>\n<td>🤝 信任建立钩（中段）<\/td><td>中段补证据帧：真实使用画面/对比截图/评论截图(任选一)，比口说更可信<\/td>\n<\/tr>\n<tr>\n<td>📣 行动引导钩（末段CTA）<\/td><td><strong>评论钩<\/strong>：评论活跃·末段用问题引评论(「你遇到过吗？评论区告诉我」)·顺带建立讨论社区<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>⚠️ 视听六层未传入——钩子建议基于互动数据推断，无视听维度加持。传入视频URL分析视听六层可提升推断准确性。<\/blockquote>\n<blockquote><strong>铁律：一条视频最多3个钩，超过反而失效——用户注意力是稀缺资源。<\/strong><\/blockquote>\n<h3>C. 转化漏斗：你的第一卡点在哪<\/h3>\n<p><code>曝光 → 完播 → 互动 → 进主页 → 关注 → 私信 → 成交 → 复购<\/code><\/p>\n<p><strong>⚡ 第一卡点<\/strong>：主页留存层(有人进来·但没关注)<\/p>\n<p><strong>根因<\/strong>：主页人设不清·Bio没说清「你是谁+给什么+怎么做」·置顶不是最能代表你的那条<\/p>\n<p><strong>优化动作<\/strong>：Bio改成一句话：「[你是谁] + [给什么人] + [给他们什么]」；置顶换成转化率最高那条(不是播放最高)；合集按主题归类让陌生人一眼看懂你的方向。<\/p>\n<blockquote>⚠️ 完播率黑盒：抖音不对外开放完播数据·无法直接测量。以下用互动率代理。如需精准诊断，账号主需投喂抖音创作者中心后台截图。<\/blockquote>\n<h3>D. 最重要的一件事<\/h3>\n<p><strong>现在不是变现的时候，是打地基的时候。<\/strong> 地基没打好就急着变现，粉丝跑了连地基都没了。把内容做扎实，变现自然来。<\/p>\n<h2>⚠️ 风险预警（专业体检·既看机会也看雷）<\/h2>\n<blockquote>你所在「餐饮」赛道，第一要防的是：<strong>限流（低质/同质化）<\/strong>。<\/blockquote>\n<blockquote>下面每条都标了<strong>可能性<\/strong>（不是「一定会」），并给了应对——这是概率，不是判决。<\/blockquote>\n<h3>🟢 提示（潜在隐患·暂不紧急·记录关注）<\/h3>\n<p><strong>🟢 原创度/搬运判定（平台黑盒·只能提示）<\/strong>（🟥 平台黑盒·只提示信号·不替平台定论）<\/p>\n<ul>\n<li>可能性：低风险·建议关注·非当前问题<\/li>\n<li>怎么办：若有二次剪辑/搬运成分，注意搬运类封号率曾超 60%（2024 政策收紧）·建议提高原创占比。<\/li>\n<li>依据：搬运类账号封号率统计 2024<\/li>\n<li>🟥 黑盒：无法替平台判定原创度·仅作信号提示·非定论。<\/li>\n<\/ul>\n<p><strong>🟢 过度依赖单一爆款（结构性风险）<\/strong><\/p>\n<ul>\n<li>可能性：低风险·建议关注·非当前问题<\/li>\n<li>怎么办：把验证过的爆款方向稳定复制成多条·别只靠一条；同步布局第二变现路径。<\/li>\n<li>依据：全域推广·单赛道红利终结 2025（网易/36氪）<\/li>\n<li>可能性非必然·结构性是隐患不是即时违规。<\/li>\n<\/ul>\n<blockquote>⚠️ 平台规则常变（截至 2026-12-31·以抖音最新规则为准）·此处为风险信号提示，不替平台裁决。<\/blockquote>\n<blockquote>风险是<strong>概率不是必然<\/strong>——专业诊断的标志是看得见雷，不是只画饼，更不是吓唬你。<\/blockquote>\n<h2>你所在赛道的大环境（避坑 + 定位）<\/h2>\n<p><strong>平台高压线（先看这个，别白做）<\/strong><\/p>\n<ul>\n<li>AI 生成内容须显著标注（2026-03 新规·未标注会限流 50-80% 甚至下架）<\/li>\n<li>这些是高压线，碰了会限流/掉号：涉政敏感、虚假宣传/夸大功效、无资质做医疗·金融荐股、未标注的 AI 内容、盗用版权音乐/素材、资质宣传（年限/认证/龙头）必须有据可查——虚假宣传是红线、价格、供货/效果承诺别夸大，留好证据<\/li>\n<li>背景音乐用平台曲库的免费商用音乐，别用来路不明的（版权风险会限流）<\/li>\n<\/ul>\n<p><strong>你在赛道里大概什么位置<\/strong><\/p>\n<ul>\n<li>你目前属于「<strong>尾部成长层<\/strong>」（有基础但未起量）。<\/li>\n<li>注：按粉丝量粗分·非赛道真实排名(要精确得看竞品·L4)。<\/li>\n<\/ul>\n<p><strong>你赛道现在是涨还是跌<\/strong><\/p>\n<ul>\n<li>⚠️ 这次<strong>没接到赛道大盘趋势数据<\/strong>——赛道整体在涨还是跌、红利窗口还在不在，需要接平台官方趋势/行业研报（官方没开放 API，得半自动补），暂时给不了，<strong>宁可告诉你「没接到」也不瞎编<\/strong>。<\/li>\n<\/ul>\n<p><strong>当前平台热点（可蹭·但先看跟你赛道搭不搭）<\/strong><\/p>\n<ul>\n<li>育碧创始人克劳德遇飞机失事坠亡、郭士强称杨瀚森将出战对阵荷兰、张雨霏遗憾无自己的单项世界纪录、来佛山沉浸式观赏叠滘龙舟漂移、中考各科老师送祝福<\/li>\n<li>注：这是当前抖音热榜（实时拉取），不是你赛道专属——能自然结合的才蹭，硬蹭反而违和。<\/li>\n<\/ul>\n<blockquote>环境数据来自合规授权渠道（国内不出境）。平台规则是官方明文；赛道趋势属半自动补充，<strong>平台算法的具体权重是黑盒，谁说得精确都是猜的<\/strong>，不作硬结论。<\/blockquote>\n<h2>七、两个提醒:把资质晒出来 + 别踩合规坑<\/h2>\n<p><strong>① 你简介里的「说法」,建议晒证据(②事实核查)<\/strong><\/p>\n<p>你写了带「年、非遗、传承、龙头、省级」这类的资质/头衔——是真的就是硬核优势,但<strong>口说无凭<\/strong>(我没法替你核实真假,看你内容的人也一样)。把<strong>证书、工厂实拍、授牌、媒体报道<\/strong>晒出来,尤其 B2B 找你合作的人最看这个,晒证据比口头说有用得多。<\/p>\n<p><strong>② 合规别踩坑(⑥合规)<\/strong><\/p>\n<ul>\n<li>背景音乐用抖音曲库的免费商用音乐,别用来路不明的(版权风险·会限流甚至下架)。<\/li>\n<li>资质宣传(年限/非遗/龙头这类)确保有据可查——<strong>虚假宣传是红线<\/strong>(被举报会掉号)。<\/li>\n<li>价格、供货/效果承诺别夸大,留好证据。<\/li>\n<\/ul>\n<h2>🎯 明天就能做的 3 件事（按先后排好了）<\/h2>\n<blockquote>上面诊断说了一堆，到底<strong>先做哪件<\/strong>？我按「见效快、最省事、最紧急」排好序了——<strong>别贪多，先把前几件做完<\/strong>，攒个快速正反馈再往下走。<\/blockquote>\n<ul>\n<li>这次没有识别到明确的待办行动项——可能是诊断信息不足，或你的账号当前没有突出短板。补上更完整的账号/作品数据后，这里会给你「明天就能做的具体几件事」。<\/li>\n<\/ul>\n<blockquote>⚠️ 排序权重（ROI=1.0 / 难度=1.0 / 紧急=0.8）是初始经验值，非铁律——会用真实回测数据（attribution_cache）持续校准。每件下方都给了打分拆解，不是玄学评分。<\/blockquote>\n<h2>八、这份分析有多可信(实话实说)<\/h2>\n<ul>\n<li>上面的数字(粉丝、点赞、作品、标签、规律)<strong>都是你抖音账号的真实公开数据,没有一个是编的<\/strong>。<\/li>\n<li>但有两个诚实的提醒:<\/li>\n<ol>\n<\/ul>\n<li>这次<strong>只看了你一个号、一个数据来源<\/strong>,没跟竞品交叉验证,所以给你的是「靠谱的方向」,别当成 100% 精确的结论。<\/li>\n<li>有些关键数据抖音<strong>不公开<\/strong> —— 比如完播率、流量从哪来、有没有转化 —— 这些拿不到,我<strong>宁可告诉你「拿不到」,也绝不瞎编<\/strong>。<\/li>\n<\/ol>\n<h2>九、30 天后来复诊<\/h2>\n<p>这份报告是 <strong>2026-06-22<\/strong> 的快照，账号状态会随你的更新在变。<\/p>\n<p><strong>建议在以下任一情况下回来复诊：<\/strong><\/p>\n<ul>\n<li>📅 距今满 30 天（约 2026-07-22）——看执行后有没有往对的方向走<\/li>\n<li>📈 粉丝或均赞出现明显变化（涨了 30%+ 或跌了 20%+）——数据变了，诊断结论也要更新<\/li>\n<li>🎯 换了内容方向，或新发了 10 条以上——积累了新样本才能看出新规律<\/li>\n<li>💡 照着建议做了一段时间，想验证到底有没有效——验证闭环，让数据说话<\/li>\n<\/ul>\n<blockquote>越用越准：你的视听分析结果会积累到账号归因库——多分析几次，「爆款视听公式」的置信度会越来越高。<\/blockquote><\/div>\n<div style=\"margin-top:32px;padding-top:12px;border-top:1px solid #E2E8F0;font-size:11px;color:#94A3B8;text-align:center\">\n  元探 MetaProbe · 数据来自合法授权渠道 · 所有数字均为平台公开真值\n<\/div>\n<\/body>\n<\/html>","douyin-chengduchihuo-20260621-150000":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>元探报告 · 成都吃货日记｜小李<\/title>\n\n<style>\n.prb { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.75;color:#1E293B 化严重,<strong>恰恰是你这种「有真实产品/源头背书」的生意号,最容易建立信任、撬动询单<\/strong>。<\/p>\n<h2>五、接下来具体怎么做(照着做就行)<\/h2>\n<p><strong>按重要程度排好了——先做 🔴 的,🟡 有余力再做:<\/strong><\/p>\n<p><strong>🔴 第 1 步｜最重要·这个月就做：把你已经验证过的方向做深<\/strong><\/p>\n<p>上面看出来了——你的高赞作品集中在 <strong>源头工厂<\/strong>。别东一榔头西一棒,接下来一个月就围绕这个方向做深做透,这是你自己数据证明有效的路。<\/p>\n<p><strong>🔴 第 2 步｜本周就能改：把最戳客户痛点的卖点,放到开头 3 秒<\/strong><\/p>\n<p>客户最关心什么(省钱?稳定供货?品质?)—— 一开口就说那句最戳痛点的话,别埋在中间。<\/p>\n<p><strong>🟡 第 3 步｜有余力再做：把你那条 4200 个赞的视频研究透<\/strong><\/p>\n<p>翻出来,看它讲了什么、开头怎么说、戳中了什么 —— 然后多做那个方向。<strong>放大你自己验证过的成功,比抄别人靠谱<\/strong>。<\/p>\n<h2>六、你这个号整体判断:处在什么阶段、该往哪走<\/h2>\n<p><strong>怎么判断的<\/strong>(不是拍脑袋)：看你粉丝量(52,000)、近期数据在掉、方向比较集中——综合下来：<\/p>\n<ul>\n<li><strong>所处阶段<\/strong>:<strong>成熟期<\/strong>(重心可转向私域沉淀和变现,内容维持稳定即可)。<\/li>\n<li><strong>你抄不走的护城河<\/strong>:真实的产品力和源头优势(「产业带货 / B2B供货」的供应链、专业积累,同行抄不走)。<\/li>\n<li>你做的「<strong>产业带货 / B2B供货<\/strong>」是个值钱的方向:这是实打实的生意账号·适合用内容做获客/招商/批发引流·变现路径比纯流量号清晰得多。<\/li>\n<li>你有过小爆款,说明天花板不低;关键是把「偶然」变成「稳定」。<\/li>\n<li>变现走「精准」不是「泛流量」:1000 个对的客户 &gt; 10 万泛粉,把内容当获客工具、盯询单转化。<\/li>\n<\/ul>\n<h2>七、两个提醒:把资质晒出来 + 别踩合规坑<\/h2>\n<p><strong>① 你简介里的「说法」,建议晒证据(②事实核查)<\/strong><\/p>\n<p>你写了带「年、获奖」这类的资质/头衔——是真的就是硬核优势,但<strong>口说无凭<\/strong>(我没法替你核实真假,看你内容的人也一样)。把<strong>证书、工厂实拍、授牌、媒体报道<\/strong>晒出来,尤其 B2B 找你合作的人最看这个,晒证据比口头说有用得多。<\/p>\n<p><strong>② 合规别踩坑(⑥合规)<\/strong><\/p>\n<ul>\n<li>背景音乐用抖音曲库的免费商用音乐,别用来路不明的(版权风险·会限流甚至下架)。<\/li>\n<li>资质宣传(年限/非遗/龙头这类)确保有据可查——<strong>虚假宣传是红线<\/strong>(被举报会掉号)。<\/li>\n<li>价格、供货/效果承诺别夸大,留好证据。<\/li>\n<\/ul>\n<h2>八、这份分析有多可信(实话实说)<\/h2>\n<ul>\n<li>上面的数字(粉丝、点赞、作品、标签、规律)<strong>都是你抖音账号的真实公开数据,没有一个是编的<\/strong>。<\/li>\n<li>但有两个诚实的提醒:<\/li>\n<ol>\n<\/ul>\n<li>这次<strong>只看了你一个号、一个数据来源<\/strong>,没跟竞品交叉验证,所以给你的是「靠谱的方向」,别当成 100% 精确的结论。<\/li>\n<li>有些关键数据抖音<strong>不公开<\/strong> —— 比如完播率、流量从哪来、有没有转化 —— 这些拿不到,我<strong>宁可告诉你「拿不到」,也绝不瞎编<\/strong>。<\/li>\n<\/ol>\n<h2>九、30 天后来复诊<\/h2>\n<p>这份报告是 <strong>2026-06-22<\/strong> 的快照，账号状态会随你的更新在变。<\/p>\n<p><strong>建议在以下任一情况下回来复诊：<\/strong><\/p>\n<ul>\n<li>📅 距今满 30 天（约 2026-07-22）——看执行后有没有往对的方向走<\/li>\n<li>📈 粉丝或均赞出现明显变化（涨了 30%+ 或跌了 20%+）——数据变了，诊断结论也要更新<\/li>\n<li>🎯 换了内容方向，或新发了 10 条以上——积累了新样本才能看出新规律<\/li>\n<li>💡 照着建议做了一段时间，想验证到底有没有效——验证闭环，让数据说话<\/li>\n<\/ul>\n<blockquote>越用越准：你的视听分析结果会积累到账号归因库——多分析几次，「爆款视听公式」的置信度会越来越高。<\/blockquote><\/div>\n<div style=\"margin-top:32px;padding-top:12px;border-top:1px solid #E2E8F0;font-size:11px;color:#94A3B8;text-align:center\">\n  元探 MetaProbe · 数据来自合法授权渠道 · 所有数字均为平台公开真值\n<\/div>\n<\/body>\n<\/html>","douyin-beichuanmoyujie-20260622-130928":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>元探报告 · 北川魔芋姐｜赵娟<\/title>\n\n<style>\n.prb { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.75;color:#1E293B;max-width:100%;word-break:break-word }\n.prb h1,.prb h2 { color:#1E3A8A;margin:24px 0 10px;padding-bottom:8px;border-bottom:2px solid #EFF6FF;font-size:16px }\n.prb h3 { color:#1E293B;font-size:14px;font-weight:700;margin:16px 0 8px }\n.prb h4 { color:#475569;font-size:13px;font-weight:600;margin:12px 0 6px }\n.prb p  { margin:0 0 10px }\n.prb strong { color:#1E3A8A }\n.prb em  { color:#FF7A1A;font-style:normal;font-weight:600 }\n.prb blockquote {\n  background:#F1F5F9;border-left:3px solid #FF7A1A;\n  padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0;\n  font-size:13px;color:#475569\n}\n.prb ul,.prb ol { margin:8px 0 10px 0;padding-left:0;list-style:none }\n.prb li { padding:4px 0 4px 20px;position:relative;border-bottom:1px solid #F8FAFC }\n.prb li:last-child { border-bottom:none }\n.prb li::before { content:'▸';position:absolute;left:4px;color:#FF7A1A;font-size:11px;top:6px }\n.prb ol li::before { content:counter(li)'.';counter-increment:li;font-weight:700;color:#1E3A8A;font-size:12px }\n.prb ol { counter-reset:li }\n.prb table { width:100%;border-collapse:collapse;margin:12px 0;font-size:13px }\n.prb th { background:#1E3A8A;color:#fff;padding:8px 10px;text-al 评论 (「你遇到过吗？评论区告诉我」)·顺带建立讨论社区<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote><strong>铁律：一条视频最多 3 个钩，超过反而失效——用户注意力是稀缺资源。<\/strong><\/blockquote>\n<h3>C. 转化漏斗：你的第一卡点在哪<\/h3>\n<p><code>曝光 → 完播 → 互动 → 进主页 → 关注 → 私信 → 成交 → 复购<\/code><\/p>\n<p><strong>⚡ 第一卡点<\/strong>：主页留存层 (有人进来·但没关注)<\/p>\n<p><strong>根因<\/strong>：主页人设不清·Bio 没说清「你是谁 + 给什么 + 怎么做」·置顶不是最能代表你的那条<\/p>\n<p><strong>优化动作<\/strong>：Bio 改成一句话：「[你是谁] + [给什么人] + [给他们什么]」；置顶换成转化率最高那条 (不是播放最高)；合集按主题归类让陌生人一眼看懂你的方向。<\/p>\n<blockquote>⚠️ 完播率黑盒：抖音不对外开放完播数据·无法直接测量。以下用互动率代理。如需精准诊断，账号主需投喂抖音创作者中心后台截图。<\/blockquote>\n<h3>D. 最重要的一件事<\/h3>\n<p><strong>现在不是变现的时候，是打地基的时候。<\/strong> 地基没打好就急着变现，粉丝跑了连地基都没了。把内容做扎实，变现自然来。<\/p>\n<h2>五、风险预警（不解决会直接影响变现）<\/h2>\n<h2>⚠️ 风险预警（专业体检·既看机会也看雷）<\/h2>\n<blockquote>咱们先明确一下你的定位：你所在的「餐饮」赛道，当前第一要防的核心风险是：<strong>限流（低质/同质化）<\/strong>。<\/blockquote>\n<blockquote>下面我列出的每一条，都明确标了<strong>可能性<\/strong>（请注意，这不是「一定会」发生的判决），并且都给了具体的应对方案——你要记住，这是概率分析，不是最终判决。<\/blockquote>\n<h3>🟡 警示（可能限流/影响权重·可恢复）<\/h3>\n<p><strong>🟡 平台已标记 1 条作品为风险内容<\/strong><\/p>\n<ul>\n<li><strong>可能性判断<\/strong>：中风险·可能限流·但概率非必然，不用过度恐慌。<\/li>\n<li><strong>具体怎么办<\/strong>：近期系统显示有 1 条作品被平台标记「视频或有风险信息，请注意核实谨防受骗」。建议你逐条自查这些视频内容，看是否涉及：敏感信息/虚假内容/违规导流。被标记的作品很可能已经受到了限流影响，所以要优先处理这些带有致命风险标记的作品。<\/li>\n<li><strong>判断依据<\/strong>：TikHub API risk_infos.warn 字段·来自抖音平台审核系统。<\/li>\n<li><strong>特别说明<\/strong>：平台标记不等于违规处罚·但可能影响推荐权重·最终结果以平台裁决为准。<\/li>\n<\/ul>\n<h3>🟢 提示（潜在隐患·暂不紧急·记录关注）<\/h3>\n<p><strong>🟢 原创度/搬运判定（平台黑盒·只能提示）<\/strong>（🟥 平台黑盒·只提示信号·不替平台定论）<\/p>\n<ul>\n<li><strong>可能性判断<\/strong>：低风险·建议关注·目前非当前主要问题。<\/li>\n<li><strong>具体怎么办<\/strong>：如果你的内容里有二次剪辑或搬运成分，要注意搬运类账号封号率曾超 60%（2024 政策收紧）·强烈建议提高原创占比，别在刀尖上跳舞。<\/li>\n<li><strong>判断依据<\/strong>：搬运类账号封号率统计 2024。<\/li>\n<li><strong>🟥 黑盒声明<\/strong>：无法替平台判定原创度·仅作信号提示·非定论。<\/li>\n<\/ul>\n<p><strong>🟢 过度依赖单一爆款（结构性风险）<\/strong><\/p>\n<ul>\n<li><strong>可能性判断<\/strong>：低风险·建议关注·目前非当前主要问题。<\/li>\n<li><strong>具体怎么办<\/strong>：把验证过的爆款方向稳定复制成多条·别只靠一条视频吃老本；同时同步布局第二变现路径，分散风险。<\/li>\n<li><strong>判断依据<\/strong>：全域推广·单赛道红利终结 2025（ 和当前平台信号 · 属「规律信号」非「必然预测」<\/em><\/p>\n<p><em>算法规则平台不公开 · 以上为统计归纳 · 实际执行以账号真实反馈为准<\/em><\/p>\n<h2>粉丝轨迹<\/h2>\n<p>➡️ 当前 4,645 · 基本稳定（波动 -0.1%）<\/p>\n<h2>趋势轨迹：你在涨还是在衰（看导数不看存量）<\/h2>\n<blockquote>咱们得先明确一个核心逻辑：同样是 4.2 万粉，一个账号可能在翻倍涨，另一个却正在崩盘——<strong>方案完全相反<\/strong>。「现在多少粉」其实不如「接下来怎么走」重要。<\/blockquote>\n<p><strong>① 作品基线趋势<\/strong>：➡️ 平稳（缺突破口）<\/p>\n<ul>\n<li>咱们把你 10 条作品按发布时间排开看基线（已剔除 0 条爆款离群，避免一条爆款把判断带偏）。目前趋势不显著（更可能是短期波动·按平稳处理）。<\/li>\n<li>⚠️ 样本 10–20 条·参考级（再多发几条结论更稳）。正因为样本量还在参考区间，所以目前的“平稳”结论还需要后续数据来进一步验证。<\/li>\n<\/ul>\n<p><strong>② 粉丝增速趋势<\/strong><\/p>\n<ul>\n<li>📦 <strong>需复访<\/strong>：粉丝增速曲线要至少 2 次诊断（≥4 个时间点）才能画。这次只有单次快照——下次复诊时会自动补上「加速涨/减速涨/净掉粉」的判断。<\/li>\n<li>正因为目前数据点还不够，所以我暂时无法给你画出一条完整的增速曲线，但这不代表没有趋势，只是需要时间沉淀。<\/li>\n<\/ul>\n<p><strong>③ 转折点：哪条作品是分水岭<\/strong><\/p>\n<ul>\n<li>第 <strong>6<\/strong> 条附近出现 <strong>负向↓转折<\/strong>（基线跃迁 -63%）。<\/li>\n<li>✅ 可归因到创作动作（伴随主题/形式变化）（新增方向：低脂轻食、健康代餐、员工福利）——查这次改动是不是改坏了。<\/li>\n<li>所以，你要重点复盘第 6 条作品前后的操作，看看是不是这次新增方向的调整导致了数据的下滑。<\/li>\n<\/ul>\n<p><strong>④ 衰退预警<\/strong><\/p>\n<ul>\n<li>🟥 <strong>作品基线断崖<\/strong>：近段作品基线较前期跌 63%（&gt;40%） → 查改版动作（看转折点检测），是不是某次改坏了<\/li>\n<li>这个跌幅已经超过了 40% 的警戒线，属于明显的断崖式下跌，必须立刻去查改版动作，看看是不是某次改坏了。<\/li>\n<\/ul>\n<blockquote>⚠️ <strong>诚实说<\/strong>：①基于 10 条作品；②你这赛道季节性<strong>中<\/strong>（淡旺季会让数据起伏，别把淡季掉量当衰退）；③转折点已强制排除外部脉冲才归因。短期波动≠趋势，样本不足时我宁可不下结论。<\/blockquote>\n<blockquote>大盘提醒：若全赛道同期都在跌，那是平台大盘不是你的账号问题（需赛道基准做相对趋势·见对标段）。<\/blockquote>\n<h2>同赛道对标：你在同行里排第几<\/h2>\n<blockquote>咱们先别光看绝对数字（比如「平均 105 赞」），因为脱离赛道没意义——餐饮号 6438 赞可能垫底，知识号 6438 赞可能头部。所以这一段，我要把你换算成<strong>相对坐标<\/strong>，看看你在同行里到底处于什么位置。<\/blockquote>\n<blockquote>对标范围锁定为：<strong>产业带货 / B2B供货<\/strong>赛道 · <strong>微号<\/strong>体量段（4,645 粉）。<\/blockquote>\n<p><strong>你在同赛道同体量号里的各维度位次（分位越高越好）：<\/strong><\/p>\n<ul>\n<li><strong>互动率<\/strong>（B 互动质量）：你 2.3% → <strong>P10（垫底）<\/strong> 🔴<strong>（主短板·先补这个）<\/strong>  〔基准来源：行业经验 · ⚠️ 参考·样本不足（经验带·非真实分位）〕<\/li>\n<\/ul>\n<p>👉 <strong>一句话<\/strong>：你最拖后腿的是 <strong>互动率<\/strong>（垫底），木桶水位由它决定——<strong>先补这块<\/strong>，比 货 / B2B 供货」的——这本身就是一个非常好的信号，说明账号定位没跑偏，接下来只需要接着往深里做。<\/p>\n<p><strong>你有一个别人抢不走的优势<\/strong><\/p>\n<p>千万别小看你手里握着的资源：<strong>真实的产品力 / 源头优势<\/strong>。<\/p>\n<p>你做的是实打实的业务（「扎根北川深耕魔芋 36 年，产地直供品质正宗地道<\/p>\n<p>#北川魔芋 #源头…」），这背后意味着你有真实的供应链、真实的源头以及深厚的专业积累 —— 这种「看得见摸得着」的真东西，比那些空洞的营销话术可信得多，而且同行也绝对抄不走。<\/p>\n<p>现在的内容环境同质化非常严重，<strong>恰恰是你这种「有真实产品/源头背书」的生意号，最容易建立信任、撬动询单<\/strong>。<\/p>\n<p><strong>接下来具体怎么做(照着做就行)<\/strong><\/p>\n<p>基于上面的优势，我帮你把行动路径<strong>按重要程度排好了——先做 🔴 的，🟡 有余力再做:<\/strong><\/p>\n<p><strong>🔴 第 1 步｜最重要·这个月就做：把你已经验证过的方向做深<\/strong><\/p>\n<p>上面看出来了——你的高赞作品集中在 <strong>魔芋代工、餐饮食材、魔芋工厂<\/strong>。别东一榔头西一棒，接下来一个月就围绕这个方向做深做透，这是你自己数据证明有效的路，不要浪费已经跑通的流量。<\/p>\n<p><strong>🔴 第 2 步｜本周就能改：把最戳客户痛点的卖点，放到开头 3 秒<\/strong><\/p>\n<p>客户最关心什么（省钱？稳定供货？品质？）—— 一开口就说那句最戳痛点的话，别埋在中间。既然做 B2B，效率就是生命，前 3 秒抓不住，后面再好也没用。<\/p>\n<p><strong>🟡 第 3 步｜有余力再做：把你那条 383 个赞的视频研究透<\/strong><\/p>\n<p>翻出来，看它讲了什么、开头怎么说、戳中了什么 —— 然后多做那个方向。<strong>放大你自己验证过的成功，比抄别人靠谱<\/strong>。<\/p>\n<p><strong>你这个号整体判断：处在什么阶段、该往哪走<\/strong><\/p>\n<p><strong>怎么判断的<\/strong>(不是拍脑袋)：看你粉丝量 (4,645)、近期数据在掉、方向比较集中——综合下来：<\/p>\n<ul>\n<li><strong>所处阶段<\/strong>:<strong>成长期·但近期遇瓶颈<\/strong>(有基础了，但作品数据近期在下滑——回头看早期哪些做对了，把它找回来)。<\/li>\n<li><strong>你抄不走的护城河<\/strong>:真实的产品力和源头优势 (「产业带货 / B2B 供货」的供应链、专业积累，同行抄不走)。<\/li>\n<li>你做的「<strong>产业带货 / B2B 供货<\/strong>」是个值钱的方向：这是实打实的生意账号·适合用内容做获客/招商/批发引流·变现路径比纯流量号清晰得多。<\/li>\n<li>你有过小爆款，说明天花板不低;关键是把「偶然」变成「稳定」。<\/li>\n<li>变现走「精准」不是「泛流量」:1000 个对的客户 &gt; 10 万泛粉，把内容当获客工具、盯询单转化。<\/li>\n<\/ul>\n<p>下一个里程碑：0 万粉（还差 355 个）<\/p>\n<p>解锁：接商单起步线，品牌方开始关注小账号合作<\/p>\n<blockquote>里程碑不是终点，是「系统开始认真对待你」的信号。专注内容质量，数字会跟上来。<\/blockquote>\n<h2>你的主页接得住流量吗<\/h2>\n<blockquote>转化链是「内容引流 → 主页 → 关注/成交」。一条视频把陌生人钩进来,他在 <strong>3 秒内<\/strong>用你的主页(头像/昵称/简介/置顶/合集/橱窗)判断要不要关注你。主页接不住 = 引来的流量在落地页漏光。<\/blockquote>\n<h3>逐元素体检(🟩 确定项 / 🟨 待补字段 / 🟥 合规或黑盒)<\/h3>\n<table><thead><tr>\n<th>元素<\/th><th>现状<\/th><th>该长啥样<\/th><th>怎么改<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td>🟩 昵称<\/td><td>北川魔芋姐｜赵娟<\/td><td>含「身份/领域」或「地域」词,非乱码纯网名<\/td><td>昵称加上你的领域或所在城市(如「XX美甲-成都」),让陌生人一眼记住你是谁<\/td>\n<\/tr>\n<tr>\n<td>🟩 简介 Bio<\/td><td>北川魔芋姐<\/td><td>赵娟<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>🏭 专注魔芋36年 · 源头工厂<\/p>\n<p>🌱  北川花魔芋种植基地<\/p>\n<p>👩‍🍳 非遗魔芋豆腐第五代传承人<\/p>\n<p>🏆 农业产业化省级重点龙头企业<\/p>\n<p>✅ 餐饮连锁直供 · OEM贴牌代工<\/p>\n<p>✅ 餐饮食材 · 休闲零食 ·礼品定制<\/p>\n<p>📍 四川北川<\/p>\n<p>📩 合作私信<\/p>\n<p>地址：四川省绵阳市北川羌族自治县下河街100号 | 「你是谁+给谁+给什么」三要素齐·含 CTA·无明文微信号(合规) | ✅ 没问题 |<\/p>\n<table><thead><tr>\n<th>🟨 头像<\/th><th>(采集端未提供头像 URL)<\/th><th>清晰、与定位一致、非默认头像<\/th><th>采集端补头像 URL 后可判默认头像<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td>🟩 合集<\/td><td>无<\/td><td>≥1 个按主题归类的合集<\/td><td>补上合集:≥1 个按主题归类的合集<\/td>\n<\/tr>\n<tr>\n<td>🟨 置顶视频<\/td><td>(采集端未提供该字段)<\/td><td>置顶=转化率最高那条<\/td><td>采集端补 is_top 字段后可检测置顶视频<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>主页结构基本完整,引流也还在积累——继续做内容,主页保持。<\/blockquote>\n<blockquote>⚠️ 以下元素采集端暂未提供字段,<strong>没假装检测<\/strong>:头像、置顶视频——补上对应采集字段后可纳入诊断。<\/blockquote>\n<blockquote>主页访问率/跳转率/关注转化率是抖音后台黑盒(🟥),需账号主投喂创作者中心后台截图才能诊断——本段只看可读的主页结构。<\/blockquote>\n<blockquote>说明:主页结构属确定性检测(🟩 高信任),但「行业元素权重」是经验排序(🟨 需回测校准);头像只做「非默认/清晰度」客观粗判,<strong>不做人脸识别<\/strong>(PIPL 红线)。<\/blockquote>\n<h2>🎯 明天就能做的 3 件事（按先后排好了）<\/h2>\n<blockquote>上面诊断说了一堆，到底<strong>先做哪件<\/strong>？我按「见效快、最省事、最紧急」排好序了——<strong>别贪多，先把前几件做完<\/strong>，攒个快速正反馈再往下走。<\/blockquote>\n<ul>\n<li>这次没有识别到明确的待办行动项——可能是诊断信息不足，或你的账号当前没有突出短板。补上更完整的账号/作品数据后，这里会给你「明天就能做的具体几件事」。<\/li>\n<\/ul>\n<blockquote>⚠️ 排序权重（ROI=1.0 / 难度=1.0 / 紧急=0.8）是初始经验值，非铁律——会用真实回测数据（attribution_cache）持续校准。每件下方都给了打分拆解，不是玄学评分。<\/blockquote>\n<h2>八、这份分析有多可信(实话实说)<\/h2>\n<ul>\n<li>上面的数字(粉丝、点赞、作品、标签、规律)<strong>都是你抖音账号的真实公开数据,没有一个是编的<\/strong>。<\/li>\n<li>但有两个诚实的提醒:<\/li>\n<ol>\n<\/ul>\n<li>这次<strong>只看了你一个号、一个数据来源<\/strong>,没跟竞品交叉验证,所以给你的是「靠谱的方向」,别当成 100% 精确的结论。<\/li>\n<li>有些关键数据抖音<strong>不公开<\/strong> —— 比如完播率、流量从哪来、有没有转化 —— 这些拿不到,我<strong>宁可告诉你「拿不到」,也绝不瞎编<\/strong>。<\/li>\n<\/ol>\n<h2>九、今天做这一件事<\/h2>\n<p><strong>📌 今天做这一件事<\/strong>（生成2分钟 + 拍摄30分钟）<\/p>\n<p><strong>输入今天要推的产品 → 生成3条带货脚本（¥29）<\/strong>，选最顺口的那条，今天就能拍完发出去。省下自己写2小时，用这2小时多拍一条。<\/p>\n<h2>十、下一步：把分析变    th, td {\n            padding: 0.75rem;\n            text-align: left;\n            border-bottom: 1px solid var(--mfc-muted);\n        }\n\n        th {\n            background-color: var(--mfc-zebra);\n            font-weight: bold;\n        }\n\n        tr:last-child td {\n            border-bottom: none;\n        }\n\n        .card {\n            background-color: white;\n            border-radius: 0.5rem;\n            box-shadow: 0 2px 8px rgba(0,0,0,0.1);\n            padding: 1.5rem;\n            margin-bottom: 1.5rem;\n        }\n\n        .decision-card {\n            background-color: var(--mfc-zebra);\n            border-left: 4px solid var(--mfc-accent);\n            padding: 1rem;\n        }\n\n        .quote {\n            border-left: 4px solid var(--mfc-accent);\n            padding: 1rem;\n            margin: 1rem 0;\n            background-color: var(--mfc-zebra);\n            font-style: italic;\n        }\n\n        .footer {\n            margin-top: 3rem;\n            text-align: center;\n            font-size: 0.8rem;\n            color: var(--mfc-muted);\n            padding-top: 1rem;\n            border-top: 1px solid var(--mfc-muted);\n        }\n\n        @media (max-width: 768px) {\n            body {\n                padding: 0.5rem;\n            }\n\n            h1 {\n                font-size: 1.5rem;\n            }\n\n            h2 {\n                font-size: 1.3rem;\n            }\n\n            .card {\n                padding: 1rem;\n            }\n        }\n    <\/style>\n<\/head>\n<body>\n    <header>\n        <div class=\"meta\">\n            <div class=\"subject\">\n                <h1>AI编年史第九期·SVM vs 神经网络·修正版<\/h1>\n                <p>probe-research 调研<\/p>\n            <\/div>\n            <div class=\"footer\">\n                <p>⬡ metafo<\/p>\n                <p>生成日期:20260625<\/p>\n            <\/div>\n        <\/div>\n    <\/header>\n\n    <main>\n        <section id=\"sec0\" class=\"section\">\n            <h2>诚实边界（先读·不可删）<\/h2>\n            <div class=\"blocks\">\n                <p class=\"quote\">- **我没看到视频本体。** 当前所有合规下载路都拿不到这条视频的画面/转写:combo-deep-probe(probe-a 合规通路)coverage 0.0(TikHub key 缺/失效)· yt-dlp 被抖音 cookies 拦 · 个人侧下载未配。probe 免费档只给了评级(可信度 C / 信息 2 / Moderate),实质 7 段付费锁。<\/p>\n                <p class=\"quote\">- **所以下面核的是\"标题/简介的宣称\",不是视频内容本身。** 置信据此<span style=\"color:var(--mfc-accent);\">大幅下调<\/span>。<\/p>\n                <p class=\"quote\">- 这条是《AI编年史》<span style=\"color:var(--mfc-brand);\">第九期·编年体<\/span>——按体裁,正片<span style=\"color:var(--mfc-accent);\">很可能<\/span>已按时间线讲到 2012 AlexNet、交代了 SVM 是时代背景。<span style=\"color:var(--mfc-accent);\">若如此,问题只在标题党化,视频本身未必失真<\/span>。<\/p>\n            <\/div>\n        <\/section>\n\n        <section id=\"ch4_todo\" class=\"section\">\n            <h2>🎯 决策卡（30 秒拍板）<\/h2>\n            <div class=\"card decision-card\">\n                <div class=\"blocks\">\n                    <p class=\"quote\">- **能不能做**：✅ 选题能做(AI 历史科普有稳定受众)。但我<span style=\"color:var(--mfc-accent);\">没看视频、也没同类真实播放数据<\/span>——\"爆款潜力\"我给不了实证,别拿我的话当数据。<\/p>\n                    <p class=\"quote\">- **最该注意**：别把标题的强归因(\"SVM 无情碾压压制\"\"一篇论文翻盘领域\")当成视频内核去拍。技术上更准的说法是——真正让能力跃迁的是<span style=\"color:var(--mfc-accent);\">层间非线性<\/span>,真正引爆领域的是<span style=\"color:var(--mfc-accent);\">2012 AlexNet<\/span>;2006 是催化剂、不是翻盘。<\/p>\n                    <p class=\"quote\">- **最大的雷**：我<span style=\"color:var(--mfc-accent);\">没看视频本体<\/span>(下载路全堵),以上全基于标题;若按标题字面做内容,会被技术圈挑硬伤。<span style=\"color:var(--mfc-accent);\">真要定稿,先把视频看了<\/span>。<\/p>\n                <\/div>\n            <\/div>\n        <\/section>\n\n        <section id=\"sec2\" class=\"section\">\n            <h2>标题宣称 vs 技术更准的说法（限\"宣称\"层·非判视频）<\/h2>\n            <div class=\"card\">\n                <table>\n                    <thead>\n                        <tr>\n                            <th>标题宣称<\/th>\n                            <th>技术上更准<\/th>\n                            <th>置信<\/th>\n                        <\/tr>\n                    <\/thead>\n                    <tbody>\n                        <tr>\n                            <td>SVM \"无情碾压/压制\"神经网络<\/td>\n                            <td>1995-2006 SVM 确主导,但 NN 被弃主因是\"多层学习被认为不可行+怕局部极小\"·非 SVM 加害;且 NN 在细分领域仍获胜 → \"边缘化\"成立、\"被压制统治\"是戏剧化<\/td>\n                            <td>中(开放资料·未看视频)<\/td>\n                        <\/tr>\n                        <tr>\n                            <td>靠 2006 \"一篇论文\"找回密码<\/td>\n                            <td>2006 是<span style=\"color:var(--mfc-accent);\">两篇姊妹论文<\/span>(DBN 算法 / Science 降维);且是\"催化剂\"非\"翻盘\"<\/td>\n                            <td>中<\/td>\n                        <\/tr>\n                        <tr>\n                            <td>一篇论文翻盘整个领域<\/td>\n                            <td>真正引爆是 <span style=\"color:var(--mfc-accent);\">2012 AlexNet<\/span>(监督 GPU CNN·无预训练);Hinton 自己说预训练后来\"只对小数据有用\"<\/td>\n                            <td>中高<\/td>\n                        <\/tr>\n                    <\/tbody>\n                <\/table>\n            <\/div>\n        <\/section>\n\n        <section id=\"sec3\" class=\"section\">\n            <h2>什么我没做到（不藏）<\/h2>\n            <div class=\"card\">\n                <div class=\"blocks\">\n                    <p class=\"quote\">- <span style=\"color:var(--mfc-accent);\">未看视频本体<\/span>:画面/口播/逐帧全没分析——以上是标题层核对,不能代替对正片的判断。<\/p>\n                    <p class=\"quote\">- <span style=\"color:var(--mfc-accent);\">无实证爆款依据<\/span>:没拿到同类 AI 历史科普视频的真实播放/完播/竞品数据 → 给不了\"能不能爆\"\"怎么钩\"的数据级建议,只能给方向。<\/p>\n                    <p class=\"quote\">- <span style=\"color:var(--mfc-accent);\">probe 实质付费锁<\/span>:二创方向/竞品矩阵(probe 7 段)未解锁。<\/p>\n                <\/div>\n            <\/div>\n        <\/section>\n\n        <section id=\"sec4\" class=\"section\">\n            <h2>下一步(要真做这条线)<\/h2>\n            <div class=\"card\">\n                <div class=\"blocks\">\n                    <p class=\"quote\">1. 先把视频本体弄到手(个人侧下载或 TikHub key 补齐)→ 看正片到底怎么讲(大概率比标题严谨);<\/p>\n                    <p class=\"quote\">2. 要爆款判断 → 拿同类真实播放数据(probe 付费档/星图);<\/p>\n                    <p class=\"quote\">3. 拿一个真实创作者验证:这份对你有用吗、会付钱吗。<\/p>\n                    <p class=\"quote\">---<\/p>\n                    <p class=\"quote\"><span style=\"color:var(--mfc-accent);\">*修正版 · 诚实置顶 + 决策卡领头 + 不判未看之物 · 对比旧版\"拿标题当视频核成论文\"<\/span><\/p>\n                <\/div>\n            <\/div>\n        <\/section>\n    <\/main>\n\n    <footer class=\"footer\">\n        <p>AI编年史第九期·SVM vs 神经网络·修正版<\/p>\n    <\/footer>\n<\/body>\n<\/html>","douyin-beichuanmoyujie-20260627-120000":"<!DOCTYPE html>\n<html lang=\"zh-CN\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<meta name=\"x-metaform\" content=\"scenario=metaboard;format=html;template=four-layer-drilldown;renderer=board_render;engine=metaboard;board_ver=3.2;v=1\">\n<title>元板 · 北川魔芋姐｜赵娟 · 四层下钻数据板块<\/title>\n<style>\n  :root { --blue:#1E3A8A; --orange:#FF7A1A; --ink:#1F2937; }\n  * { box-sizing:border-box; }\n  body { font-family:-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n         color:#1F2937; line-height:1.6; margin:0; background:#F8FAFC; }\n  .wrap { max-width:920px; margin:0 auto; padding:16px; }\n  .screen { background:#fff; border-radius:14px; padding:22px 24px; margin:16px 0;\n            box-shadow:0 1px 3px rgba(0,0,0,.06); }\n  .screen-tag { display:inline-block; font-size:12px; color:#fff; background:#1E3A8A;\n                padding:3px 10px; border-radius:10px; margin-bottom:14px; }\n  h1 { font-size:22px; color:#1E3A8A; margin:.2em 0; }\n  h2 { font-size:17px; color:#1E3A8A; border-left:4px solid #FF7A1A;\n       padding-left:10px; margin:1em 0 .6em; }\n  .headline-box { background:linear-gradient(135deg,#1E3A8A,#2747a8); color:#fff;\n                  border-radius:12px; padding:20px 22px; }\n  .headline-box .score { font-size:40px; font-weight:800; color:#FF7A1A; }\n  .concern { background:rgba(255,255,255,.12); border-rad 晕」「我想来看看，可以吗」——观众想买，找不到入口。<\/p><div class=\"punch\">这不是流量问题，是承接问题。补一个私域钩子，漏掉的线索就接住了。<\/div><\/div><\/section>\n<section><div class=\"eyebrow\"><span class=\"n\">3<\/span><h2>支撑这个判断的证据<\/h2><\/div><div class=\"evidence\"><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">口碑采购意向<span class=\"tipbox\">评论中「采购/咨询/下单」类语义的占比趋势。上升=视频在持续产线索。<\/span><\/span><small>评论里采购/咨询语义趋势<\/small><\/div><div class=\"val\">早 0.0 → 近 0.17 · 上升<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">评论赞比<span class=\"tipbox\">单条评论数 ÷ 点赞数。≥0.15 即强讨论；对 B 端意味潜在咨询线索。<\/span><\/span><small>讨论 / 咨询强度<\/small><\/div><div class=\"val\">0.235 · 强讨论<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">商业转化<span class=\"tipbox\">带货+转化+商业密度+橱窗的综合分。3 分=过了门槛却没做任何变现动作。<\/span><\/span><small>已过门槛但零动作<\/small><\/div><div class=\"val warn\">3 分<\/div><\/div><div class=\"e\"><div class=\"lab\">商业密度<small>变现动作占比<\/small><\/div><div class=\"val warn\">0%<\/div><\/div><div class=\"e\"><div class=\"lab\">综合健康<small>衰退<\/small><\/div><div class=\"val\">39 · D 级<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">最强内容驱动<span class=\"tipbox\">各因子对互动的驱动倍数。发布时段落差最大：晚间档比下午高 1.75 倍。<\/span><\/span><small>内容归因<\/small><\/div><div class=\"val\">发布时段 1.75x<\/div><\/div><\/div><\/section>\n<section id=\"sec-actions\"><div class=\"eyebrow\"><span class=\"n\">4<\/span><h2>本周做这几件事<\/h2><\/div><div class=\"act p1\"><input type=\"checkbox\" class=\"chk\" id=\"a4_0\"><label for=\"a4_0\" class=\"idx\"><\/label><div><h3>主页 + 评论区置顶挂私域钩子，把「哪里下单」导成微信 / 采购线索<\/h3><div class=\"why\">当前 ROI 最高——线索已经在产，只缺一个接住它的入口。<\/div><\/div><span class=\"tag first\">最高优先<\/span><\/div><div class=\"act \"><input type=\"checkbox\" class=\"chk\" id=\"a4_1\"><label for=\"a4_1\" class=\"idx\"><\/label><div><h3>固定晚 18–22 发布<\/h3><div class=\"why\">内容归因显示该时段互动比下午高 1.75 倍，是最强单一驱动。<\/div><\/div><span class=\"tag next\">次<\/span><\/div><div class=\"act \"><input type=\"checkbox\" class=\"chk\" id=\"a4_2\"><label for=\"a4_2\" class=\"idx\"><\/label><div><h3>开「魔芋工厂源头」合集，把已验证主题系列化<button class=\"copybtn\" data-copy=\"魔芋工厂源头\" title=\"复制\">⧉<\/button><\/h3><div class=\"why\">合集化当前 0 分，系列化能固化算法标签、攒账号资产。<\/div><\/div><span class=\"tag next\">次<\/span><\/div><div class=\"act \"><input type=\"checkbox\" class=\"chk\" id=\"a4_3\"><label for=\"a4_3\" class=\"idx\"><\/label><div><h3>暂不追播放量 / 暂不挂车<\/h3><div class=\"why\">B 端靠线索不靠流量；先把承接和私域做起来，带货等起量后效率更高。<\/div><\/div><span class=\"tag hold\">暂缓<\/span><\/div><\/section>\n<section><div class=\"eyebrow\"><span class=\"n\">5<\/span><h2>做了会怎样<\/h2><\/div><p class=\"lead\">不补承接，会继续下滑；补了，可逆转。<\/p><p>近期互动 -32%、疑似断更触发了衰退信号。但 B 端起号期的命脉是线索不是流量——把承接接通、节奏稳住，下滑可止。这是「衰退」标签下被低估的反转点。<\/p><\/section>\n<div class=\"scope\"><b>本次诊断的边界。<\/b>未开通星图，所以&lt;b&gt;拿不到、未纳入评分&lt;/b&gt;：官方报价、带货 / 转化指数、粉丝消费力画像。互动操纵只查了&lt;b&gt;结构&lt;/b&gt;（结果：赞评藏比例自然，无操纵迹象），真实播放量是黑盒、未核查。部分阈值为经验值，待用 50–100 个真实账号建分位基线后校准。<\/div>\n<details class=\"appendix\"><summary>展开深度数据（八维雷达 · 健康/转化五段拆解 · 评论聚类）<\/summary><p class='muted' style='font-size:13px'><b>账号八维（外环强/内缩弱）<\/b>：健康 39 · 粉丝质量 47 · 商业转化 3 · 内容力 42 · 赛道 S · 破圈 30 · 评级 D · 私域 14。<\/p><table><tr><th>健康 39 拆解<\/th><th>商业转化 3 拆解<\/th><\/tr><tr><td>互动质量 23 · 粉丝净增 100 · 更新节奏 54 · 内容趋势 14 · 合集化 0（最该补）<\/td><td>带货 30%(需星图) · 转化 25%(需星图) · 商业密度 0% · 橱窗/直播 0<\/td><\/tr><\/table><p class='muted' style='font-size:12.5px'>评论高频诉求聚类：「哪里下单」「想来看看可以吗」「魔芋姐能不能说四川话」。互动结构自然（赞评藏比例一致，无操纵迹象）。<\/p><\/details>\n<footer>元板 MetaBoard · 数据源合规授权 · 国内不出境 · 生成于 2026-06-28 14:32（北京时间）<\/footer><script>\ndocument.querySelectorAll('.copybtn').forEach(function(b){b.addEventListener('click',function(){\n navigator.clipboard.writeText(b.dataset.copy).then(function(){var t=b.textContent;b.textContent='✓';\n b.classList.add('done');setTimeout(function(){b.textContent=t;b.classList.remove('done');},1200);});});});\n<\/script><\/div><\/body><\/html>","report-account-diagnosis-beichuan-ladder-v5-20260628":"<!DOCTYPE \n<div class=\"verdict\"><div class=\"grade\">D<small>商业评级 · 健康 39<\/small><\/div><div class=\"tag\">4654粉 · 该玩线索游戏，不玩流量游戏。<\/div><div class=\"spine\"><b>补私域承接·把咨询变线索<\/b>——S档·垂直B端/知识付费·4654粉已过 B 端变现门槛(几千精准粉即可)·评论咨询率高(潜在线索金矿)·但商业密度 0=有咨询没承接·该补私域钩子/橱窗把评论咨询导成线索·而非盲目追播放量。B 端玩线索游戏不玩流量游戏(出处 CM §二层A)。<\/div><\/div><div class=\"pad\">\n<section><div class=\"eyebrow\"><span class=\"n\">1<\/span><h2>你现在的处境<\/h2><\/div><p class=\"lead\">你在运营旅程的【起号·建信任】，已走过 冷启·打标签，接下来 初变现、成长。<\/p><p>你在【起号·建信任】·距【初变现】还差:粉丝量级:4654→1万(还差 5346)。终极目标:工厂赛道的「源头供应/专业IP」·几千精准粉做透私域·单粉价值 10-50元/粉。形象一致性 100（高度匹配）。<\/p><\/section>\n<section><div class=\"eyebrow\"><span class=\"n\">2<\/span><h2>最该解决的一件事<\/h2><\/div><p class=\"lead\">评论暴露真实诉求:有采购意向但问&#x27;哪里下单&#x27;=承接断点<\/p><div class=\"keyissue\"><div class=\"flow\"><span class=\"node\">评论采购意向采购/咨询意向上升(早0.0→近0.17<\/span><span class=\"arr\">→<\/span><span class=\"node bad\">商业转化 3 分·已过门槛但零变现动作·缺承接(私域钩子/橱<\/span><\/div><p class=\"muted\" style=\"margin:10px 0 0\">热评诉求：「看来看去都不知道哪里下单？晕」、「我想来看看，可以吗」、「魔芋姐拍视频可不可以把你的普通话换成四川」<\/p><div class=\"punch\">先解决内容质量问题（参照 P1 掉粉诊断·P2 爆款分析）；带货在流量起量后效率更高<\/div><\/div><\/section>\n<section><div class=\"eyebrow\"><span class=\"n\">3<\/span><h2>支撑这个判断的证据<\/h2><\/div><div class=\"evidence\"><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">口碑采购意向<span class=\"tipbox\">评论中采购/咨询/下单类语义占比趋势。上升=视频在持续产线索。<\/span><\/span><small>评论采购/咨询语义趋势<\/small><\/div><div class=\"val\">早 0.0 → 近 0.17 · 口碑升温<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">内容驱动因子<span class=\"tipbox\">控制变量看哪个因子(时段/时长/话题)对互动落差最大。<\/span><\/span><small>哪个数据因子最驱动互动<\/small><\/div><div class=\"val\">发布时段（差 1.75x）<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">健康<span class=\"tipbox\">健康综合评分(0-100)。<\/span><\/span><small>全域加权健康<\/small><\/div><div class=\"val\">39 分<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">商业转化<span class=\"tipbox\">商业转化综合评分(0-100)。<\/span><\/span><small>带货+转化+承接<\/small><\/div><div class=\"val\">3 分<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">私域<span class=\"tipbox\">私域综合评分(0-100)。<\/span><\/span><small>私域成熟度<\/small><\/div><div class=\"val\">14 分<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">形象一致性<span class=\"tipbox\">对外人设与数据里真实的你是否匹配。<\/span><\/span><small>昵称×简介×内容×评论是否同一身份<\/small><\/div><div class=\"val\">100 · 高度匹配<\/div><\/div><\/div><\/section>\n<section id=\"sec-actions\"><div class=\"eyebrow\"><span class=\"n\">4<\/span><h2>本周做这几件事<\/h2><\/div><div class=\"act \"><input type=\"checkbox\" class=\"chk\" id=\"a4_0\"><label for=\"a4_0\" class=\"idx\"><\/label><div><h3>补私域承接·把咨询变线索<\/h3><div class=\"why\">这是进【初变现】的硬条件：粉丝量级:4654→1万(还差 5346)。S档·垂直B端/知识付费·4654粉已过 B 端变现门槛(几千精准粉即可)·评论咨询率高(潜在线索金<\/div><\/div><span class=\"tag next\">最高优先·进阶关键<\/span><\/div><div class=\"act \"><input type=\"checkbox\" class=\"chk\" id=\"a4_1\"><label for=\"a4_1\" class=\"idx\"><\/label><div><h3>发布时段:选 晚间 18-22(实测比最差时段高 1.7x)<\/h3><\/div><span class=\"tag next\">本周<\/span><\/div><div class=\"act \"><input type=\"checkbox\" class=\"chk\" id=\"a4_2\"><label for=\"a4_2\" class=\"idx\"><\/label><div><h3>视频时长:控制在 60-90s(样本少·参考)<\/h3><\/div><span class=\"tag next\">本周<\/span><\/div><div class=\"act \"><input type=\"checkbox\" class=\"chk\" id=\"a4_3\"><label for=\"a4_3\" class=\"idx\"><\/label><div><h3>选题方向:延续爆款共性「安福魔芋、北川魔芋姐、魔芋工厂」<\/h3><\/div><span class=\"tag next\">本周<\/span><\/div><div class=\"act \"><input type=\"checkbox\" class=\"chk\" id=\"a4_4\"><label for=\"a4_4\" class=\"idx\"><\/label><div><h3>下条按 MetaCut 参数拍：18:00-22:00发·[60, 90]s·选题安福魔芋/北川魔芋姐/魔芋工厂·主页/置顶引导加微信·把采购咨询导私域成交<\/h3><div class=\"why\">数据驱动的执行参数·可直接喂剪辑引擎<\/div><\/div><span class=\"tag next\">执行<\/span><\/div><\/section>\n<section><div class=\"eyebrow\"><span class=\"n\">5<\/span><h2>做了会怎样<\/h2><\/div><p class=\"lead\">接通进阶条件能进【初变现】；不补则卡在【起号·建信任】。<\/p><p>内容时序：减速下滑(近期互动 -32.0%)·衰退期(疑断更触发)；账号轨迹：涨粉停滞(平台期)·2026-06-21→2026-06-28(7天)·4645→4654粉(+9·+0.19%)·日均+1.3粉。<\/p><\/section>\n<div class=\"scope\"><b>本次诊断的边界。<\/b>未开通星图，拿不到、未纳入评分：官方报价、带货/转化指数、粉丝消费力画像。互动操纵只查了结构（互动结构自然(赞评藏比例一致·无操纵迹象)），真实播放量是黑盒、未核查。部分阈值为经验值，待用 50–100 个真实账号建分位基线后校准。<\/div>\n<details class=\"appendix\"><summary>展开图表深度（阶段旅程 · 八维雷达 · 指标基准 · 内容归因）<\/summary><div style='font-weight:700;color:#1E3A8A;margin:6px 0 2px'>运营阶段旅程<\/div><svg width=\"560\" height=\"78\" viewBox=\"0 0 560 78\" style=\"max-width:100%\"><line x1=\"20\" y1=\"26\" x2=\"150\" y2=\"26\" stroke=\"#059669\" stroke-width=\"3\"/><line x1=\"150\" y1=\"26\" x2=\"280\" y2=\"26\" stroke=\"#E5E7EB\" stroke-width=\"3\"/><line x1=\"280\" y1=\"26\" x2=\"410\" y2=\"26\" stroke=\"#E5E7EB\" stroke-width=\"3\"/><line x1=\"410\" y1=\"26\" x2=\"540\" y2=\"26\" stroke=\"#E5E7EB\" stroke-width=\"3\"/><circle cx=\"20\" cy=\"26\" r=\"8\" fill=\"#059669\"/><text x=\"20\" y=\"30\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">✓<\/text><text x=\"20\" y=\"50\" font-size=\"10.5\" fill=\"#6B7280\" font-weight=\"400\" text-anchor=\"middle\">冷启·打标签<\/text><text x=\"20\" y=\"64\" font-size=\"8.5\" fill=\"#9CA3AF\" text-anchor=\"middle\">0-1000<\/text><circle cx=\"150\" cy=\"26\" r=\"11\" fill=\"#FF7A1A\"/><text x=\"150\" y=\"30\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">◉<\/text><text x=\"150\" y=\"50\" font-size=\"10.5\" fill=\"#1F2937\" font-weight=\"700\" text-anchor=\"middle\">起号·建信任<\/text><text x=\"150\" y=\"64\" font-size=\"8.5\" fill=\"#9CA3AF\" text-anchor=\"middle\">1000-1万<\/text><circle cx=\"280\" cy=\"26\" r=\"8\" fill=\"#9CA3AF\"/><text x=\"280\" y=\"50\" font-size=\"10.5\" fill=\"#6B7280\" font-weight=\"400\" text-anchor=\"middle\">初变现<\/text><text x=\"280\" y=\"64\" font-size=\"8.5\" fill=\"#9CA3AF\" text-anchor=\"middle\">1万-5万<\/text><circle cx=\"410\" cy=\"26\" r=\"8\" fill=\"#9CA3AF\"/><text x=\"410\" y=\"50\" font-size=\"10.5\" fill=\"#6B7280\" font-weight=\"400\" text-anchor=\"middle\">成长 \/div><p class=\"lead\">你在运营旅程的【起号·建信任】，已走过 冷启·打标签，接下来 初变现、成长。<\/p><p>你在【起号·建信任】·距【初变现】还差:粉丝量级:4654→1万(还差 5346)。终极目标:工厂赛道的「源头供应/专业IP」·几千精准粉做透私域·单粉价值 10-50元/粉。形象一致性 100（高度匹配）。<\/p><\/section>\n<section><div class=\"eyebrow\"><span class=\"n\">2<\/span><h2>最该解决的一件事<\/h2><\/div><p class=\"lead\">评论暴露真实诉求:有采购意向但问&#x27;哪里下单&#x27;=承接断点<\/p><div class=\"keyissue\"><div class=\"flow\"><span class=\"node\">评论采购意向采购/咨询意向上升(早0.0→近0.17<\/span><span class=\"arr\">→<\/span><span class=\"node bad\">商业转化 3 分·已过门槛但零变现动作·缺承接(私域钩子/橱<\/span><\/div><p class=\"muted\" style=\"margin:10px 0 0\">热评诉求：「看来看去都不知道哪里下单？晕」、「我想来看看，可以吗」、「魔芋姐拍视频可不可以把你的普通话换成四川」<\/p><div class=\"punch\">先解决内容质量问题（参照 P1 掉粉诊断·P2 爆款分析）；带货在流量起量后效率更高<\/div><\/div><\/section>\n<section><div class=\"eyebrow\"><span class=\"n\">3<\/span><h2>支撑这个判断的证据<\/h2><\/div><div class=\"evidence\"><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">口碑采购意向<span class=\"tipbox\">评论中采购/咨询/下单类语义占比趋势。上升=视频在持续产线索。<\/span><\/span><small>评论采购/咨询语义趋势<\/small><\/div><div class=\"val\">早 0.0 → 近 0.17 · 口碑升温<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">内容驱动因子<span class=\"tipbox\">控制变量看哪个因子(时段/时长/话题)对互动落差最大。<\/span><\/span><small>哪个数据因子最驱动互动<\/small><\/div><div class=\"val\">发布时段（差 1.75x）<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">健康<span class=\"tipbox\">健康综合评分(0-100)。<\/span><\/span><small>全域加权健康<\/small><\/div><div class=\"val\">39 分<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">商业转化<span class=\"tipbox\">商业转化综合评分(0-100)。<\/span><\/span><small>带货+转化+承接<\/small><\/div><div class=\"val\">3 分<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">私域<span class=\"tipbox\">私域综合评分(0-100)。<\/span><\/span><small>私域成熟度<\/small><\/div><div class=\"val\">14 分<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">形象一致性<span class=\"tipbox\">对外人设与数据里真实的你是否匹配。<\/span
