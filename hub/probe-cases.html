<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元探 · 案例库 MetaProbe Cases</title>
<style>
/* ============================================================
   破晓品牌配色 & 全局重置
   ============================================================ */
:root {
  --blue:        #1E3A8A;
  --blue-light:  #3B5FC0;
  --blue-bg:     #EFF6FF;
  --orange:      #FF7A1A;
  --orange-bg:   #FFF3E0;
  --green:       #066C37;
  --green-bg:    #F0FDF4;
  --red:         #B91C1C;
  --red-bg:      #FEF2F2;
  --text-dark:   #1E293B;
  --text-gray:   #475569;
  --text-muted:  #94A3B8;
  --border:      #CBD5E1;
  --bg:          #F8FAFC;
  --white:       #FFFFFF;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  color: var(--text-dark);
  background: var(--bg);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ============================================================
   顶部 Header
   ============================================================ */
#header {
  background: var(--blue);
  color: #fff;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(30,58,138,.4);
  z-index: 100;
  transition: background .2s;
}

#header-left {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

body.mode-read #header-left {
  flex-direction: row;
  align-items: center;
  gap: 12px;
}

#header h1 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .5px;
}

#header .subtitle {
  font-size: 11px;
  opacity: .7;
}

#header-stats {
  display: flex;
  gap: 10px;
  align-items: center;
}

/* 列表模式 stat chips */
.stat-chip {
  background: rgba(255,255,255,.15);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.stat-chip span { opacity: .75; font-weight: 400; }

#filter-count {
  font-size: 11px;
  opacity: .85;
  background: rgba(255,255,255,.1);
  border-radius: 12px;
  padding: 3px 10px;
  white-space: nowrap;
}

/* 阅读模式 header stats */
#read-header-nav {
  display: none;
  align-items: center;
  gap: 10px;
}

body.mode-read #list-header-stats { display: none; }
body.mode-read #read-header-nav   { display: flex; }
body.mode-list #read-header-nav   { display: none; }
body.mode-list #list-header-stats { display: flex; }

.hn-btn {
  background: rgba(255,255,255,.2);
  color: #fff;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 13px;
  cursor: pointer;
  transition: background .12s;
  line-height: 1;
}
.hn-btn:hover { background: rgba(255,255,255,.35); }
.hn-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }

#read-nav-index {
  font-size: 12px;
  opacity: .85;
  white-space: nowrap;
}

.hn-shortcut {
  font-size: 11px;
  opacity: .7;
  white-space: nowrap;
  letter-spacing: .3px;
}

/* ============================================================
   模式切换 — 核心
   ============================================================ */
body.mode-list .sb-read  { display: none !important; }
body.mode-list .sb-list  { display: flex; flex-direction: column; gap: 16px; }
body.mode-list #list-panel { display: flex; flex-direction: column; }
body.mode-list #read-panel { display: none !important; }
body.mode-list #toc-nav    { display: none !important; }

body.mode-read .sb-list  { display: none !important; }
body.mode-read .sb-read  { display: flex; flex-direction: column; gap: 10px; }
body.mode-read #list-panel { display: none !important; }
body.mode-read #read-panel { display: flex; flex-direction: column; }
body.mode-read #toc-nav    { display: flex; flex-direction: column; }

/* ============================================================
   主体布局
   ============================================================ */
#layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── 侧边栏 ── */
#sidebar {
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  transition: width .2s;
}

body.mode-list #sidebar { width: 220px; padding: 16px 12px; overflow-y: auto; gap: 20px; }
body.mode-read #sidebar { width: 180px; padding: 10px 0 0; overflow-y: hidden; }

/* 列表模式侧边栏 */
.sb-list { width: 100%; }

.sidebar-section label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .8px;
  margin-bottom: 6px;
}

.search-wrapper { position: relative; }
.search-shortcut {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: var(--text-muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  pointer-events: none;
}

#search-input {
  width: 100%;
  padding: 8px 36px 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-dark);
  outline: none;
  transition: border-color .2s;
}
#search-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(30,58,138,.1); }

#sort-select, #version-select {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-dark);
  background: var(--white);
  outline: none;
  cursor: pointer;
  transition: border-color .2s;
}
#sort-select:focus, #version-select:focus { border-color: var(--blue); }

#data-status {
  font-size: 11px;
  color: var(--text-muted);
  padding: 8px 10px;
  background: var(--blue-bg);
  border-radius: 8px;
  line-height: 1.5;
}
#data-status .mode-badge {
  display: inline-block;
  background: var(--blue);
  color: #fff;
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 10px;
  font-weight: 600;
  margin-right: 4px;
}

/* 阅读模式侧边栏 */
.sb-read { width: 100%; height: 100%; overflow: hidden; }

#back-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: var(--blue-bg);
  color: var(--blue);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background .12s;
  margin: 0 10px 10px;
  white-space: nowrap;
}
#back-btn:hover { background: #DBEAFE; }

.sb-read-type-head {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .6px;
  padding: 0 10px 6px;
}

#read-type-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 0 10px 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}

.read-type-chip {
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  color: var(--text-muted);
  background: #fff;
  transition: all .12s;
  white-space: nowrap;
}
.read-type-chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }

#read-case-list {
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.read-case-item {
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text-gray);
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all .12s;
  line-height: 1.4;
}
.read-case-item:hover { background: var(--bg); color: var(--text-dark); }
.read-case-item.active {
  background: var(--blue-bg);
  color: var(--blue);
  border-left-color: var(--blue);
  font-weight: 600;
}
.rci-type { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.rci-follower { font-size: 10px; color: var(--text-muted); }

/* ── 主内容区 ── */
#main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ── 列表面板 ── */
#list-panel {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* 筛选双行 */
#filters-bar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.filter-row {
  display: flex;
  align-items: center;
  padding: 7px 16px;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid #F1F5F9;
}
.filter-row:last-child { border-bottom: none; }
.filter-row::-webkit-scrollbar { display: none; }

.filter-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  flex-shrink: 0;
  margin-right: 4px;
  white-space: nowrap;
}

.chip {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  border: 1.5px solid var(--border);
  color: var(--text-gray);
  background: var(--white);
  transition: all .15s;
  user-select: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.chip:hover { border-color: var(--blue); color: var(--blue); }
.chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.chip .chip-count {
  background: rgba(255,255,255,.3);
  border-radius: 10px;
  padding: 0 5px;
  font-size: 10px;
  font-weight: 700;
  min-width: 16px;
  text-align: center;
}
.chip:not(.active) .chip-count { background: rgba(30,58,138,.1); color: var(--blue); }

/* 卡片网格 */
#cards-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

#cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

#empty-state {
  display: none;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
#empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
#empty-state p { font-size: 15px; margin-bottom: 6px; color: var(--text-gray); }
#empty-state small { font-size: 12px; }

/* ============================================================
   案例卡片
   ============================================================ */
.case-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  position: relative;
  cursor: pointer;
  transition: box-shadow .2s, transform .15s, border-color .15s;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.case-card:hover {
  box-shadow: 0 4px 16px rgba(30,58,138,.12);
  transform: translateY(-1px);
}
.case-card.card-active {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px rgba(30,58,138,.2);
}

.platform-badge {
  position: absolute;
  top: 0; right: 0;
  font-size: 10px; font-weight: 700;
  padding: 2px 7px;
  border-radius: 0 10px 0 8px;
  color: #fff; letter-spacing: .3px;
}
.platform-badge.douyin      { background: #161823; }
.platform-badge.kuaishou    { background: #FF5000; }
.platform-badge.xiaohongshu { background: #FF2442; }
.platform-badge.shipinhao   { background: #07C160; }
.platform-badge.default     { background: var(--text-muted); }

.version-badge {
  position: absolute;
  top: 0; left: 0;
  background: var(--orange); color: #fff;
  font-size: 10px; font-weight: 700;
  padding: 2px 6px;
  border-radius: 10px 0 8px 0;
  min-width: 22px; text-align: center;
}

.type-badge {
  display: inline-block;
  font-size: 11px; font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  margin-bottom: 2px;
}

.card-account {
  font-size: 15px; font-weight: 700;
  color: var(--text-dark);
  line-height: 1.3;
  padding-right: 46px;
}

.card-followers {
  font-size: 12px; color: var(--text-muted);
  margin-top: -4px;
}
.card-followers strong { color: var(--blue); font-size: 13px; }

.card-icons {
  display: flex; gap: 6px;
  align-items: center;
  font-size: 12px; flex-wrap: wrap;
}
.icon-item {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 6px; border-radius: 6px;
  background: var(--bg); font-size: 11px; white-space: nowrap;
}
.icon-item.ok   { background: #F0FDF4; color: var(--green); }
.icon-item.warn { background: #FFFBEB; color: #92400E; }
.icon-item.fail { background: #FEF2F2; color: var(--red); }
.icon-item.info { background: var(--blue-bg); color: var(--blue); }

.card-summary {
  font-size: 12px; color: var(--text-gray);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag-pill {
  font-size: 11px; padding: 1px 7px;
  border-radius: 10px;
  background: var(--bg); color: var(--text-muted);
  border: 1px solid var(--border);
  cursor: pointer; transition: all .12s;
}
.tag-pill:hover { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }

.card-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: auto; padding-top: 6px;
  border-top: 1px solid var(--bg);
}
.card-meta { font-size: 11px; color: var(--text-muted); }

.btn-detail {
  background: var(--blue); color: #fff;
  border: none; border-radius: 7px;
  padding: 5px 12px; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: background .15s;
  pointer-events: none;
}
.case-card:hover .btn-detail { background: var(--blue-light); }

mark {
  background: #FEF08A; color: var(--text-dark);
  border-radius: 2px; padding: 0 1px;
}

/* ============================================================
   阅读面板
   ============================================================ */
#read-panel {
  flex: 1;
  overflow: hidden;
}

#read-header {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 12px 20px 0;
  flex-shrink: 0;
}

#read-account { font-size: 16px; font-weight: 700; color: var(--text-dark); }
#read-sub { font-size: 11px; color: var(--text-muted); margin: 3px 0 10px; }

#read-tabs {
  display: flex; gap: 0;
  margin: 0 -20px; padding: 0 20px;
}
.rtab {
  padding: 8px 14px;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  border-bottom: 2.5px solid transparent;
  color: var(--text-muted);
  transition: all .15s;
  white-space: nowrap;
  user-select: none;
}
.rtab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
.rtab:hover { color: var(--blue); }

#read-body {
  flex: 1;
  overflow-y: auto;
  background: var(--bg);
  height: calc(100vh - 140px);
}
#read-body.padded { padding: 20px; }

/* ============================================================
   右侧 TOC
   ============================================================ */
#toc-nav {
  width: 180px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: #FAFAFA;
  padding: 0;
  overflow: hidden;
  flex-direction: column;
}

.toc-head {
  font-size: 11px; font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .6px;
  padding: 12px 14px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#toc-list {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

.toc-foot {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.toc-item {
  display: block;
  padding: 6px 14px;
  font-size: 12px; color: var(--text-gray);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all .12s; line-height: 1.4;
}
.toc-item:hover, .toc-item.active {
  color: var(--blue); background: #EFF6FF;
  border-left-color: var(--blue);
}
.toc-item.h3 { padding-left: 24px; font-size: 11px; color: var(--text-muted); }

/* 唯一下载按钮 */
.download-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 9px;
  background: var(--orange); color: #fff;
  text-decoration: none; border-radius: 8px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  transition: opacity .15s; border: none;
}
.download-btn:hover { opacity: .85; }

/* ============================================================
   报告 Markdown / Shadow DOM 渲染
   ============================================================ */
.md-content {
  line-height: 1.7; color: var(--text-dark); padding: 16px;
}
.md-content h1 {
  font-size: 18px; font-weight: 700; color: var(--blue);
  margin: 20px 0 10px; padding: 0 0 6px 12px;
  border-left: 4px solid var(--blue); border-bottom: 1px solid var(--blue-bg);
}
.md-content h1:first-child { margin-top: 0; }
.md-content h2 {
  font-size: 15px; font-weight: 700; color: var(--blue);
  margin: 16px 0 8px; padding: 0 0 4px 10px;
  border-left: 3px solid var(--orange);
}
.md-content h2:first-child { margin-top: 0; }
.md-content h3 {
  font-size: 13px; font-weight: 700; color: var(--text-dark);
  margin: 12px 0 6px; padding-left: 8px;
  border-left: 2px solid var(--border);
}
.md-content h4 {
  font-size: 12px; font-weight: 700; color: var(--text-gray);
  margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .5px;
}
.md-content p { margin: 8px 0; line-height: 1.7; }
.md-content strong { color: var(--blue); font-weight: 700; }
.md-content em { color: var(--text-gray); font-style: italic; }
.md-content ul { padding-left: 0; margin: 8px 0; list-style: none; }
.md-content ul li { padding: 3px 0 3px 20px; position: relative; line-height: 1.6; }
.md-content ul li::before {
  content: ''; position: absolute; left: 6px; top: 10px;
  width: 6px; height: 6px; border-radius: 50%; background: var(--orange);
}
.md-content ol { padding-left: 22px; margin: 8px 0; }
.md-content ol li { margin: 4px 0; line-height: 1.6; }
.md-content blockquote {
  border-left: 3px solid var(--orange); background: #FFFBEB;
  padding: 10px 14px; margin: 10px 0; color: var(--text-gray);
  border-radius: 0 8px 8px 0;
}
.md-content hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.md-content table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
.md-content th { background: var(--blue); color: #fff; font-weight: 600; padding: 7px 10px; text-align: left; }
.md-content td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
.md-content tr:nth-child(even) td { background: var(--blue-bg); }
.md-content code {
  font-family: "SF Mono", "Fira Code", monospace;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 3px; padding: 1px 4px; font-size: 12px;
}
.no-report { text-align: center; padding: 40px 0; color: var(--text-muted); }

/* 骨架屏 */
.skeleton {
  height: 14px;
  background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%);
  background-size: 200% 100%;
  animation: skeleton-wave 1.4s infinite;
  border-radius: 6px; margin-bottom: 10px;
}
.skeleton.wide { width: 100%; }
.skeleton.medium { width: 75%; }
.skeleton.short { width: 45%; }
@keyframes skeleton-wave {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ============================================================
   仪表盘 Tab
   ============================================================ */
.dashboard-section { margin-bottom: 24px; }
.dashboard-section-title {
  font-size: 11px; font-weight: 700; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .8px;
  margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
}
.section-icon { font-size: 14px; }

.metrics-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.metrics-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.metrics-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

.metric-card {
  background: var(--bg); border-radius: 10px;
  padding: 12px 10px; border: 1px solid var(--border); text-align: center;
}
.metric-card .m-label { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-bottom: 4px; }
.metric-card .m-value { font-size: 18px; font-weight: 700; color: var(--text-dark); line-height: 1.2; }
.metric-card .m-unit  { font-size: 11px; color: var(--text-muted); font-weight: 400; }
.metric-card .m-badge {
  display: inline-block; margin-top: 4px;
  font-size: 10px; font-weight: 700;
  padding: 1px 7px; border-radius: 10px;
}

 8px 0;\n  margin:0 0 20px;font-size:14px;font-weight:500\n}\n.prb .bluf strong { color:#FF7A1A;font-size:15px }\n/* 行动项颜色 */\n.prb .act-red  { color:#B91C1C;font-weight:600 }\n.prb .act-yel  { color:#92400E;font-weight:600 }\n/* 可信度/诚实声明块 */\n.prb .honest {\n  background:#EFF6FF;border:1px solid #BFDBFE;\n  padding:10px 14px;border-radius:6px;\n  font-size:12px;color:#1E3A8A;margin:12px 0\n}\n</style>\n\n</head>\n<body style=\"margin:0;padding:16px 20px 40px;background:#fff\">\n<div style=\"font-size:11px;color:#94A3B8;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #E2E8F0\">\n  <strong style=\"color:#1E3A8A\">元探 MetaProbe</strong> · 丁香医生 · 2026-06-21\n  <span style=\"float:right;background:#EFF6FF;padding:2px 8px;border-radius:4px\">heng-20260621-120000</span>\n</div>\n<div class=\"prb\"><h2>📋 账号诊断报告 · @丁香医生</h2>\n<blockquote>诊断截至 <strong>2026-06-22</strong>（账号数据每天在变，本报告是当日快照）。</blockquote>\n<blockquote>建议 <strong>2026-07-22</strong> 前复诊一次，看改变后的数据有没有往对的方向走。</blockquote>\n<blockquote>我尽量说人话，你拿着就能照着做。</blockquote>\n<div class=\"bluf\"><strong>你的内容是有价值的,真正的问题不是「做得不好」,而是「方向太杂、系统认不清你是谁」。把方向收窄,你这个号能起来。</strong></div>\n<h2>你是哪类创作者（先认清，才好对症）</h2>\n<blockquote>不同身份的人，诊断重点完全不同——商家看到店、IP 看人设、新人看赛道。先识别你属于哪一类，后面所有建议才够得着。</blockquote>\n<p><strong>判定结果：知识口播 IP ⚠️人工确认</strong></p>\n<ul>\n<li>我手头的信号还不足以确定你的身份（置信度 55%，低于 60% 不当结论）。</li>\n<li>为什么不硬猜：硬给一个身份，后面整套诊断都会跑偏，不如先问清楚。</li>\n<li>建议补这几问：你是实体店主 / 在职转型 / 应届起号 / 中年再就业？主要做什么内容？有没有蓝V或绑定多个号？</li>\n</ul>\n<p><strong>怎么判断的（不是拍脑袋，每条都有出处）</strong></p>\n<ul>\n<li>口播/方法论内容信号(知识/科普) → 疑似知识口播 IP（缺人生处境信号·置信压低）</li>\n</ul>\n<p><strong>结合你的阶段「成熟期」，这阶段该聚焦：</strong></p>\n<ul>\n<li>诊断重点：人格稀缺性 + 方法论壁垒 + 完播率</li>\n<li>内容频次：稳定产出·重质不重量🟨经验</li>\n<li>推荐形式：口播模板（钩子+亮点+CTA·30 秒可拍）</li>\n</ul>\n<p><strong>能力画像：未采集</strong></p>\n<ul>\n<li>我还不知道你会不会剪辑、愿不愿出镜、有多少时间——这些决定方案够不够得着。</li>\n<li>补上这几项（出镜/剪辑/时间/预算/团队），我才能保证给的方案你真的做得出来，而不是给一堆拍不出的脚本。</li>\n</ul>\n<h2>一、你现在是什么情况</h2>\n<p><strong>你是谁、在做什么</strong></p>\n<p>你发的内容,大方向是「<strong>健身运动</strong>」。</p>\n<p><strong>你现在的水平</strong></p>\n<ul>\n<li>6438222 个粉丝、比较成熟的号,一共发了 2341 条作品。</li>\n<li>你的视频平均 <strong>73966 个赞</strong>,最好的一条有 <strong>790105 个赞</strong>。</li>\n<li>👉 <strong>这说明</strong>:你做得出 790105 赞的爆款,但没稳下来(平均才 73966)——<strong>潜力够,缺的是把「偶然爆」变成「稳定爆」</strong>。下面第五段会给你怎么做。</li>\n</ul>\n<p><strong>你发的这条视频表现怎么样</strong></p>\n<ul>\n<li>这条讲的是:「镜子里的你，照片里的你，哪一个才是真的你？ 为什么镜子里的你会更好看…」</li>\n<li>数据:183740 个赞、5239 条评论、57384 次转发、32988 个收藏。</li>\n<li>跟你自己比:<strong>明显高于你平时(你平均 73966 个赞),算你的一条小爆款,值得好好复盘</strong>。</li>\n</ul>\n<h2>💬 用户在评论区说了什么(这是最真实的反馈)</h2>\n<blockquote>采到 189 条评论(已滤掉 11 条疑似引流/水军 🟩)。</blockquote>\n<blockquote>⚠️ 评论代表「愿意发声的那部分人」,不等于全部观众(🟨 样本偏差);采到的非全量、热评经平台算法排序(🟥 平台黑盒)。</blockquote>\n<h3>🎯 购买意向信号(🟩 计数·热度即转化前兆)</h3>\n<ul>\n<li>评论里反复在问:「多少」1 次、「近」1 次、「离」1 次</li>\n<li><strong>诊断重点</strong>:体验课钩子转化 + 位置匹配</li>\n<li><strong>怎么接</strong>:问体验课多 → 主页挂体验课钩子;问位置多 → 标 POI</li>\n</ul>\n<h3>❓ 高频问题 = 下一条选题</h3>\n<ul>\n<li>这个可以吗？我感觉很舒服。（约 1 条）</li>\n<li>主播主播[紫薇别走]上下翻转会不会更好看？（约 1 条）</li>\n<li>我有很多张脸啊，你说的是哪张脸？[愉快]（约 1 条）</li>\n</ul>\n<blockquote>说明:本次评论聚类/情感分析未接到分析模型,只输出了可直接计数的意向信号与高频问题(确定项),情感/异议留待模型可用时补全——<strong>没瞎编</strong>。</blockquote>\n<h2>你的主页接得住流量吗</h2>\n<blockquote>转化链是「内容引流 → 主页 → 关注/成交」。一条视频把陌生人钩进来,他在 <strong>3 秒内</strong>用你的主页(头像/昵称/简介/置顶/合集/橱窗)判断要不要关注你。主页接不住 = 引来的流量在落地页漏光。</blockquote>\n<h3>逐元素体检(🟩 确定项 / 🟨 待补字段 / 🟥 合规或黑盒)</h3>\n<table><thead><tr>\n<th>元素</th><th>现状</th><th>该长啥样</th><th>怎么改</th>\n</tr></thead><tbody>\n<tr>\n<td>🟩 昵称</td><td>丁香医生</td><td>含「身份/领域」或「地域」词,非乱码纯网名</td><td>昵称加上你的领域或所在城市(如「XX美甲-成都」),让陌生人一眼记住你是谁</td>\n</tr>\n<tr>\n<td>🟩 简介 Bio</td><td>(空)</td><td>「你是谁+给谁+给什么」三要素齐·含 CTA·无明文微信号(合规)</td><td>简介现在是空的——补一句话「我是谁+给谁+给什么」,这是承接陌生人的第一道门</td>\n</tr>\n<tr>\n<td>🟨 头像</td><td>(采集端未提供头像 URL)</td><td>清晰、与定位一致、非默认头像</td><td>采集端补头像 URL 后可判默认头像</td>\n</tr>\n<tr>\n<td>🟨 企业认证</td><td>(采集端未提供认证字段)</td><td>实体店/B2B 应做企业认证(解锁地址组件/私信卡片)</td><td>采集端补 enterprise_verify 字段后可检测</td>\n</tr>\n<tr>\n<td>🟨 置顶视频</td><td>(采集端未提供该字段)</td><td>置顶=转化率最高那条</td><td>采集端补 is_top 字段后可检测置顶视频</td>\n</tr>\n<tr>\n<td>🟨 合集</td><td>(采集端未提供该字段)</td><td>≥1 个按主题归类的合集</td><td>采集端补 mix_count 字段后可检测合集</td>\n</tr>\n<tr>\n<td>🟨 橱窗</td><td>(采集端未提供该字段)</td><td>带货号必有橱窗+商品与内容强相关</td><td>采集端补 window_product_count 字段后可检测橱窗</td>\n</tr>\n<tr>\n<td>🟨 地址/POI</td><td>(采集端未提供该字段)</td><td>实体店必挂 POI(同城流量+团购入口)</td><td>采集端补 poi 字段后可检测地址/POI</td>\n</tr>\n</tbody></table>\n<h3>⚡ 漏斗断点:引流强但主页承接弱(置信度 70%)</h3>\n<p>⚡ 问题不在内容(内容已出圈/爆了),在主页——陌生人被钩进来,3 秒看不懂你是谁、找不到下单口,流量在落地页漏光了。</p>\n<p><strong>判断依据</strong>:</p>\n<ul>\n<li>这条 183741 赞 &gt; 平时 2 倍(73966 均赞),爆了</li>\n</ul>\n<p><strong>立即改</strong>:简介现在是空的——补一句话「我是谁+给谁+给什么」,这是承接陌生人的第一道门;简介现在是空的——补一句话「我是谁+给谁+给什么」,这是承接陌生人的第一道门</p>\n<h3>承接完整度:🟥 0/100</h3>\n<blockquote>(只对采集端可读的主页元素打分;打灰的待补字段不计入,不冒充)</blockquote>\n<blockquote>⚠️ 以下元素采集端暂未提供字段,<strong>没假装检测</strong>:头像、企业认证、置顶视频、合集、橱窗、地址/POI——补上对应采集字段后可纳入诊断。</blockquote>\n<blockquote>主页访问率/跳转率/关注转化率是抖音后台黑盒(🟥),需账号主投喂创作者中心后台截图才能诊断——本段只看可读的主页结构。</blockquote>\n<blockquote>说明:主页结构属确定性检测(🟩 高信任),但「行业元素权重」是经验排序(🟨 需回测校准);头像只做「非默认/清晰度」客观粗判,<strong>不做人脸识别</strong>(PIPL 红线)。</blockquote>\n<h2>二、你这 10 条作品藏着的规律(这才是重点)</h2>\n<p>单看一条看不出门道——我把你最近 10 条作品<strong>横着放一起看</strong>,规律就出来了:</p>\n<p><strong>哪些是你的爆款、它们有什么共同点</strong></p>\n<ul>\n<li>你有 <strong>3 条</strong>明显高于平均(超均赞 2 倍)的作品。其中最戳人的那条是「如何通过小便颜色判断饮水量？ #健康科普 #喝水…」(790105 赞)。</li>\n<li>这些高赞作品最常出现的方向是:<strong>健康科普、喝水、便秘</strong> —— 这是你<strong>已经验证过、观众买账</strong>的内容方向,别犹豫,多做这个。</li>\n</ul>\n<p><strong>高赞的 和 低赞的,差在哪(这是能复制的关键)</strong></p>\n<ul>\n<li>高赞作品更常带 <strong>喝水、便秘、腹泻</strong> 这些方向(低赞的没有);高赞作品的 <strong>评论、收藏</strong> 明显更高(说明这些内容更能激发互动)。</li>\n<li><strong>说人话:你只要多做高赞那批的方向,数据大概率比其他内容好——这是你自己的数据告诉你的,比抄别人靠谱。</strong></li>\n</ul>\n<p><strong>你最近状态在涨还是在掉</strong></p>\n<ul>\n<li>📉 在掉——近期不如早期,该回头看看早期哪些做对了。</li>\n</ul>\n<h2>三、你现在最该解决的一件事:账号「太杂」</h2>\n<p>你最近视频贴的标签是这些:<strong>健康科普、减肥、科普、冷知识、减脂、女生必看、拍照、屎</strong>。</p>\n<p>发现没?<strong>这其实是好几个不同的方向。</strong> 抖音给不给你推流量,全靠它「猜你是做什么的」。你一会儿讲这个、一会儿讲那个,系统就懵了。</p>\n<p><strong>你明明有能力做出 790105 个赞的内容,但整体起不来,问题不在内容好不好,在「聚不聚焦」。</strong></p>\n<h2>四、你有一个别人抢不走的优势</h2>\n<p>别灰心,你手里有最值钱的东西:<strong>真实</strong>。</p>\n<p>你讲的「镜子里的你，照片里的你，哪一个才是真的你？ 为什么镜子里的你会更好看…」这种真实的经历和感受,是你亲身经历、带着体温的 —— AI 编不出来、别的博主也抄不像。</p>\n<p>现在 AI 生成的内容满天飞,<strong>恰恰是你这种「真实的表达」最稀缺、最值钱</strong>。</p>\n<h2>五、接下来具体怎么做(照着做就行)</h2>\n<p><strong>按重要程度排好了——先做 🔴 的,🟡 有余力再做:</strong></p>\n<p><strong>🔴 第 1 步｜最重要·这个月就做：把你已经验证过的方向做深</strong></p>\n<p>上面看出来了——你的高赞作品集中在 <strong>健康科普、喝水、便秘</strong>。别东一榔头西一棒,接下来一个月就围绕这个方向做深做透,这是你自己数据证明有效的路。</p>\n<p><strong>🔴 第 2 步｜本周就能改：把最揪心的那句话,放到开头 3 秒</strong></p>\n<p>抖音前 3 秒决定别人划不划走,一开口就甩出最能戳中人的那句话。</p>\n<p><strong>🟡 第 3 步｜有余力再做：把你那条 790105 个赞的视频研究透</strong></p>\n<p>翻出来,看它讲了什么、开头怎么说、戳中了什么 —— 然后多做那个方向。<strong>放大你自己验证过的成功,比抄别人靠谱</strong>。</p>\n<h2>六、你这个号整体判断:处在什么阶段、该往哪走</h2>\n<p><strong>怎么判断的</strong>(不是拍脑袋)：看你粉丝量(6,438,222)、近期数据在掉、方向偏散——综合下来：</p>\n<ul>\n<li><strong>所处阶段</strong>:<strong>成熟期</strong>(重心可转向私域沉淀和变现,内容维持稳定即可)。</li>\n<li><strong>你抄不走的护城河</strong>:你的真实表达和独特视角(「健身运动」里你的经历和人格,AI 和别人抄不像)。</li>\n<li>你做的「<strong>健身运动</strong>」是个值钱的方向:需求刚性,适合卖课、社群、装备带货。</li>\n<li>现在的瓶颈是「太散」;一旦聚焦、系统认清你,起量会稳得多。</li>\n<li>你有过小爆款,说明天花板不低;关键是把「偶然」变成「稳定」。</li>\n</ul>\n<h2>趋势轨迹：你在涨还是在衰（看导数不看存量）</h2>\n<blockquote>同样 4.2 万粉，一个在翻倍涨、一个正在崩——<strong>方案完全相反</strong>。「现在多少粉」不如「接下来怎么走」重要。</blockquote>\n<p><strong>① 作品基线趋势</strong>：➡️ 平稳（缺突破口）</p>\n<ul>\n<li>把你 10 条作品按发布时间排开看基线（已剔除 4 条爆款离群，避免一条爆款把判断带偏）。趋势不显著（更可能是短期波动·按平稳处理）。</li>\n<li>⚠️ 样本 10–20 条·参考级（再多发几条结论更稳）。</li>\n</ul>\n<p><strong>② 粉丝增速趋势</strong></p>\n<ul>\n<li>📦 <strong>需复访</strong>：粉丝增速曲线要至少 2 次诊断（≥4 个时间点）才能画。这次只有单次快照——下次复诊时会自动补上「加速涨/减速涨/净掉粉」的判断。</li>\n</ul>\n<p><strong>③ 转折点：哪条作品是分水岭</strong></p>\n<ul>\n<li>第 <strong>6</strong> 条附近出现 <strong>负向↓转折</strong>（基线跃迁 -99%）。</li>\n<li>✅ 可归因到创作动作（伴随主题/形式变化）（新增方向：健身、减肥、减脂）——查这次改动是不是改坏了。</li>\n</ul>\n<p><strong>④ 衰退预警</strong></p>\n<ul>\n<li>🟢 <strong>数据平稳·缺突破口</strong>：作品基线无显著趋势 → 刻意做几条不同方向，拉开对比找突破点</li>\n</ul>\n<blockquote>⚠️ <strong>诚实说</strong>：①基于 10 条作品；②你这赛道季节性<strong>中</strong>（淡旺季会让数据起伏，别把淡季掉量当衰退）；③转折点已强制排除外部脉冲才归因。短期波动≠趋势，样本不足时我宁可 ckquote><strong>铁律：一条视频最多3个钩，超过反而失效——用户注意力是稀缺资源。</strong></blockquote>\n<h3>C. 转化漏斗：你的第一卡点在哪</h3>\n<p><code>曝光 → 完播 → 互动 → 进主页 → 关注 → 私信 → 成交 → 复购</code></p>\n<p><strong>⚡ 第一卡点</strong>：关注→成交层(有收藏意愿·但无行动路径)</p>\n<p><strong>根因</strong>：缺明确路径钩：用户想要但不知道「下一步怎么得到」</p>\n<p><strong>优化动作</strong>：末段加私信钩：「想要完整方案/资料，私信我「关键词」」；开启私信自动回复(关键词触发)；置顶一条专门讲「怎么找到你/怎么购买/怎么合作」的视频。</p>\n<blockquote>⚠️ 完播率黑盒：抖音不对外开放完播数据·无法直接测量。以下用互动率代理。如需精准诊断，账号主需投喂抖音创作者中心后台截图。</blockquote>\n<h3>D. 最重要的一件事</h3>\n<p><strong>最贵的转化路径是私域。</strong> 平台内的成交是一次性的，把成交用户引导进私域（微信/社群），才能做复购和口碑裂变——这才是长线钱。</p>\n<h2>⚠️ 风险预警（专业体检·既看机会也看雷）</h2>\n<blockquote>你所在「医疗」赛道，第一要防的是：<strong>封号红线（资质/疗效）</strong>。</blockquote>\n<blockquote>下面每条都标了<strong>可能性</strong>（不是「一定会」），并给了应对——这是概率，不是判决。</blockquote>\n<h3>🟢 提示（潜在隐患·暂不紧急·记录关注）</h3>\n<p><strong>🟢 原创度/搬运判定（平台黑盒·只能提示）</strong>（🟥 平台黑盒·只提示信号·不替平台定论）</p>\n<ul>\n<li>可能性：低风险·建议关注·非当前问题</li>\n<li>怎么办：若有二次剪辑/搬运成分，注意搬运类封号率曾超 60%（2024 政策收紧）·建议提高原创占比。</li>\n<li>依据：搬运类账号封号率统计 2024</li>\n<li>🟥 黑盒：无法替平台判定原创度·仅作信号提示·非定论。</li>\n</ul>\n<p><strong>🟢 过度依赖单一爆款（结构性风险）</strong></p>\n<ul>\n<li>可能性：低风险·建议关注·非当前问题</li>\n<li>怎么办：把验证过的爆款方向稳定复制成多条·别只靠一条；同步布局第二变现路径。</li>\n<li>依据：全域推广·单赛道红利终结 2025（网易/36氪）</li>\n<li>可能性非必然·结构性是隐患不是即时违规。</li>\n</ul>\n<blockquote>⚠️ 平台规则常变（截至 2026-12-31·以抖音最新规则为准）·此处为风险信号提示，不替平台裁决。</blockquote>\n<blockquote>风险是<strong>概率不是必然</strong>——专业诊断的标志是看得见雷，不是只画饼，更不是吓唬你。</blockquote>\n<h2>你所在赛道的大环境（避坑 + 定位）</h2>\n<p><strong>平台高压线（先看这个，别白做）</strong></p>\n<ul>\n<li>AI 生成内容须显著标注（2026-03 新规·未标注会限流 50-80% 甚至下架）</li>\n<li>这些是高压线，碰了会限流/掉号：涉政敏感、虚假宣传/夸大功效、无资质做医疗·金融荐股、未标注的 AI 内容、盗用版权音乐/素材</li>\n<li>背景音乐用平台曲库的免费商用音乐，别用来路不明的（版权风险会限流）</li>\n</ul>\n<p><strong>你在赛道里大概什么位置</strong></p>\n<ul>\n<li>你目前属于「<strong>头部</strong>」（赛道里的成熟号）。</li>\n<li>注：按粉丝量粗分·非赛道真实排名(要精确得看竞品·L4)。</li>\n</ul>\n<p><strong>你赛道现在是涨还是跌</strong></p>\n<ul>\n<li>⚠️ 这次<strong>没接到赛道大盘趋势数据</strong>——赛道整体在涨还是跌、红利窗口还在不在，需要接平台官方趋势/行业研报（官方没开放 API，得半自动补），暂时给不了，<strong>宁可告诉你「没接到」也不瞎编</strong>。</li>\n</ul>\n<p><strong>当前平台热点（可蹭·但先看跟你赛道搭不搭）</stron \n</head>\n<body style=\"margin:0;padding:16px 20px 40px;background:#fff\">\n<div style=\"font-size:11px;color:#94A3B8;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #E2E8F0\">\n  <strong style=\"color:#1E3A8A\">元探 MetaProbe</strong> · 北川魔芋姐｜赵娟 · 2026-06-21\n  <span style=\"float:right;background:#EFF6FF;padding:2px 8px;border-radius:4px\">ujie-20260621-143200</span>\n</div>\n<div class=\"prb\"><h2>📋 账号诊断报告 · @北川魔芋姐｜赵娟</h2>\n<blockquote>诊断截至 <strong>2026-06-22</strong>（账号数据每天在变，本报告是当日快照）。</blockquote>\n<blockquote>建议 <strong>2026-07-22</strong> 前复诊一次，看改变后的数据有没有往对的方向走。</blockquote>\n<blockquote>我尽量说人话，你拿着就能照着做。</blockquote>\n<div class=\"bluf\"><strong>你的定位清晰、是认真做生意的号。接下来用内容把「为什么选你」讲透,把流量导到询单/合作上。</strong></div>\n<h2>你是哪类创作者（先认清，才好对症）</h2>\n<blockquote>不同身份的人，诊断重点完全不同——商家看到店、IP 看人设、新人看赛道。先识别你属于哪一类，后面所有建议才够得着。</blockquote>\n<p><strong>判定结果：未识别（信号不足） ⚠️人工确认</strong></p>\n<ul>\n<li>我手头的信号还不足以确定你的身份（置信度 0%，低于 60% 不当结论）。</li>\n<li>为什么不硬猜：硬给一个身份，后面整套诊断都会跑偏，不如先问清楚。</li>\n<li>建议补这几问：你是实体店主 / 在职转型 / 应届起号 / 中年再就业？主要做什么内容？有没有蓝V或绑定多个号？</li>\n</ul>\n<p><strong>怎么判断的（不是拍脑袋，每条都有出处）</strong></p>\n<ul>\n<li>无商家/MCN/人生处境/内容信号 → 信号不足，需 3-5 问引导补全身份再判定（不硬猜）</li>\n</ul>\n<p><strong>结合你的阶段「成长期」，这阶段该聚焦：</strong></p>\n<ul>\n<li>诊断重点：先补采创作者画像信号（3-5 问引导）再做适配诊断</li>\n<li>内容频次：—（信号不足，不设阈值）</li>\n<li>推荐形式：—（先确认身份）</li>\n</ul>\n<p><strong>能力画像：未采集</strong></p>\n<ul>\n<li>我还不知道你会不会剪辑、愿不愿出镜、有多少时间——这些决定方案够不够得着。</li>\n<li>补上这几项（出镜/剪辑/时间/预算/团队），我才能保证给的方案你真的做得出来，而不是给一堆拍不出的脚本。</li>\n</ul>\n<h2>一、你现在是什么情况</h2>\n<p><strong>你是谁、在做什么</strong></p>\n<p>你的简介写着:「北川魔芋姐 | 赵娟</p>\n<p>🏭 专注魔芋36年 · 源头工厂</p>\n<p>🌱  北川花魔芋种植基地</p>\n<p>👩‍🍳 非遗魔芋豆腐第五代传承人</p>\n<p>🏆 农业产业化省级重点龙头企业</p>\n<p>✅ 餐饮连锁直供 · OEM贴牌代工</p>\n<p>✅ 餐饮食材 · 休闲零食 ·礼品定制</p>\n<p>📍 四川北川</p>\n<p>📩 合作私信</p>\n<p>地址：四川省绵阳市北川羌族自治县下河街100号」—— 能看出你有明确的产品/业务定位,是认真做这门生意的。</p>\n<p>你发的内容,大方向是「<strong>产业带货 / B2B供货</strong>」。</p>\n<p><strong>你现在的水平</strong></p>\n<ul>\n<li>4645 个粉丝、成长初期,一共发了 123 条作品。</li>\n<li>你的视频平均 <strong>105 个赞</strong>,最好的一条有 <strong>383 个赞</strong>。</li>\n<li>👉 <strong>这说明</strong>:你做得出 383 赞的爆款,但没稳下来(平均才 105)——<strong>潜力够,缺的是把「偶然爆」变成「稳定爆」</strong>。下面第五段会给你怎么做。</li>\n</ul>\n<p><strong>你发的这条视频表现怎么样</strong></p>\n<ul>\n<li>这条讲的是:「餐饮门店直供拿货，缩减成本拉高利润，规格齐全供货稳定 #餐饮供货#源…」</li>\n<li>数据:77 个赞、8 条评论、1 次转发、1 个收藏。</li>\n<li>跟你自己比:<strong>和你平时差不多(你平均 105 个赞),属于正常发挥——不算失败,也不算爆</strong>。别因为这一条数字焦虑——要看的是整体趋势,不是单独一条。</li>\n</ul>\n<blockquote>提醒:生意号别只盯点赞——<strong>询单、私信、进店</strong>才是真目标。点赞低不等于没效果,要看后端转化。</blockquote>\n<h2>💬 用户在评论区说了什么(这是最真实的反馈)</h2>\n<blockquote>这条评论还不多(采到 6 条),先看大方向、不给比例(样本太小给比例会误导):</blockquote>\n<ul>\n<li>暂未识别到明显意向词/高频问题——继续积累评论。</li>\n</ul>\n<blockquote>⚠️ 评论代表「愿意发声的那部分人」,不等于全部观众(🟨 样本偏差)。</blockquote>\n<h2>你的主页接得住流量吗</h2>\n<blockquote>转化链是「内容引流 → 主页 → 关注/成交」。一条视频把陌生人钩进来,他在 <strong>3 秒内</strong>用你的主页(头像/昵称/简介/置顶/合集/橱窗)判断要不要关注你。主页接不住 = 引来的流量在落地页漏光。</blockquote>\n<h3>逐元素体检(🟩 确定项 / 🟨 待补字段 / 🟥 合规或黑盒)</h3>\n<table><thead><tr>\n<th>元素</th><th>现状</th><th>该长啥样</th><th>怎么改</th>\n</tr></thead><tbody>\n<tr>\n<td>🟩 昵称</td><td>北川魔芋姐｜赵娟</td><td>含「身份/领域」或「地域」词,非乱码纯网名</td><td>昵称加上你的领域或所在城市(如「XX美甲-成都」),让陌生人一眼记住你是谁</td>\n</tr>\n<tr>\n<td>🟩 简介 Bio</td><td>北川魔芋姐</td><td>赵娟</td>\n</tr>\n</tbody></table>\n<p>🏭 专注魔芋36年 · 源头工厂</p>\n<p>🌱  北川花魔芋种植基地</p>\n<p>👩‍🍳 非遗魔芋豆腐第五代传承人</p>\n<p>🏆 农业产业化省级重点龙头企业</p>\n<p>✅ 餐饮连锁直供 · OEM贴牌代工</p>\n<p>✅ 餐饮食材 · 休闲零食 ·礼品定制</p>\n<p>📍 四川北川</p>\n<p>📩 合作私信</p>\n<p>地址：四川省绵阳市北川羌族自治县下河街100号 | 「你是谁+给谁+给什么」三要素齐·含 CTA·无明文微信号(合规) | ✅ 没问题 |</p>\n<table><thead><tr>\n<th>🟨 头像</th><th>(采集端未提供头像 URL)</th><th>清晰、与定位一致、非默认头像</th><th>采集端补头像 URL 后可判默认头像</th>\n</tr></thead><tbody>\n<tr>\n<td>🟨 合集</td><td>(采集端未提供该字段)</td><td>≥1 个按主题归类的合集</td><td>采集端补 mix_count 字段后可检测合集</td>\n</tr>\n<tr>\n<td>🟨 置顶视频</td><td>(采集端未提供该字段)</td><td>置顶=转化率最高那条</td><td>采集端补 is_top 字段后可检测置顶视频</td>\n</tr>\n</tbody></table>\n<blockquote>主页结构基本完整,引流也还在积累——继续做内容,主页保持。</blockquote>\n<blockquote>⚠️ 以下元素采集端暂未提供字段,<strong>没假装检测</strong>:头像、合集、置顶视频——补上对应采集字段后可纳入诊断。</blockquote>\n<blockquote>主页访问率/跳转率/关注转化率是抖音后台黑盒(🟥),需账号主投喂创作者中心后台截图才能诊断——本段只看可读的主页结构。</blockquote>\n<blockquote>说明:主页结构属确定性检测(🟩 高信任),但「行业元素权重」是经验排序(🟨 需回测校准);头像只做「非默认/清晰度」客观粗判,<strong>不做人脸识别</strong>(PIPL 红线)。</blockquote>\n<h2>二、你这 10 条作品藏着的规律(这才是重点)</h2>\n<p>单看一条看不出门道——我把你最近 10 条作品<strong>横着放一起看</strong>,规律就出来了:</p>\n<p><strong>哪些是你的爆款、它们有什么共同点</strong></p>\n<ul>\n<li>你这批作品数据比较平均,还没跑出明显爆款——说明方向还在试,需要再多发几条找感觉。</li>\n</ul>\n<p><strong>高赞的 和 低赞的,差在哪(这是能复制的关键)</strong></p>\n<ul>\n<li>高赞作品更常带 <strong>特色农产、产地好物、北川魔芋</strong> 这些方向(低赞的没有);高赞作品的 <strong>评论、收藏</strong> 明显更高(说明这些内容更能激发互动)。</li>\n<li><strong>说人话:你只要多做高赞那批的方向,数据大概率比其他内容好——这是你自己的数据告诉你的,比抄别人靠谱。</strong></li>\n</ul>\n<p><strong>你最近状态在涨还是在掉</strong></p>\n<ul>\n<li>📉 在掉——近期不如早期,该回头看看早期哪些做对了。</li>\n</ul>\n<h2>三、你做得对的地方</h2>\n<p>你的产品/业务方向比较集中,系统能认清你是做「产业带货 / B2B供货」的——这是好事,接着往深里做。</p>\n<h2>四、你有一个别人抢不走的优势</h2>\n<p>别小看你手里的东西:<strong>真实的产品力 / 源头优势</strong>。</p>\n<p>你做的是实打实的业务(「餐饮门店直供拿货，缩减成本拉高利润，规格齐全供货稳定 #餐饮供货#源…」),背后是真实的供应链、源头和专业积累 —— 这种「看得见摸得着」的真东西,比空洞营销可信得多,同行也抄不走。</p>\n<p>现在内容同质化严重,<strong>恰恰是你这种「有真实产品/源头背书」的生意号,最容易建立信任、撬动询单</strong>。</p>\n<h2>五、接下来具体怎么做(照着做就行)</h2>\n<p><strong>按重要程度排好了——先做 🔴 的,🟡 有余力再做:</strong></p>\n<p><strong>🔴 第 1 步｜最重要·这个月就做：把你已经验证过的方向做深</strong></p>\n<p>上面看出来了——你的高赞作品集中在 <strong>北川魔芋姐、魔芋工厂、餐饮食材</strong>。别东一榔头西一棒,接下来一个月就围绕这个方向做深做透,这是你自己数据证明有效的路。</p>\n<p><strong>🔴 第 2 步｜本周就能改：把最戳客户痛点的卖点,放到开头 3 秒</strong></p>\n<p>客户最关心什么(省钱?稳定供货?品质?)—— 一开口就说那句最戳痛点的话,别埋在中间。</p>\n<p><strong>🟡 第 3 步｜有余力再做：把你那条 383 个赞的视频研究透</strong></p>\n<p>翻出来,看它讲了什么、开头怎么说、戳中了什么 —— 然后多做那个方向。<strong>放大你自己验证过的成功,比抄别人靠谱</strong>。</p>\n<h2>六、你这个号整体判断:处在什么阶段、该往哪走</h2>\n<p><strong>怎么判断的</strong>(不是拍脑袋)：看你粉丝量(4,645)、近期数据在掉、方向比较集中——综合下来：</p>\n<ul>\n<li><strong>所处阶段</strong>:<strong>成长期·但近期遇瓶颈</strong>(有基础了,但作品数据近期在下滑——回头看早期哪些做对了,把它找回来)。</li>\n<li><strong>你抄不走的护城河</strong>:真实的产品力和源头优势(「产业带货 / B2B供货」的供应链、专业积累,同行抄不走)。</li>\n<li>你做的「<strong>产业带货 / B2B供货</strong>」是个值钱的方向:这是实打实的生意账号·适合用内容做获客/招商/批发引流·变现路径比纯流量号清晰得多。</li>\n<li>你有过小爆款,说明天花板不低;关键是把「偶然」变成「稳定」。</li>\n<li>变现走「精准」不是「泛流量」:1000 个对的客户 &gt; 10 万泛粉,把内容当获客工具、盯询单转化。</li>\n</ul>\n<h2>趋势轨迹：你在涨还是在衰（看导数不看存量）</h2>\n<blockquote>同样 4.2 万粉，一个在翻倍涨、一个正在崩——<strong>方案完全相反</strong>。「现在多少粉」不如「接下来怎么走」重要。</blockquote>\n<p><strong>① 作品基线趋势</strong>：➡️ 平稳（缺突破口）</p>\n<ul>\n<li>把你 10 条作品按发布时间排开看基线（已剔除 0 条爆款离群，避免一条爆款把判断带偏）。趋势不显著（更可能是短期波动·按平稳处理）。</li>\n<li>⚠️ 样本 10–20 条·参考级（再多发几条结论更稳）。</li>\n</ul>\n<p><strong>② 粉丝增速趋势</strong></p>\n<ul>\n<li>📦 <strong>需复访</strong>：粉丝增速曲线要至少 2 次诊断（≥4 个时间点）才能画。这次只有单次快照——下次复诊时会自动补上「加速涨/减速涨/净掉粉」的判断。</li>\n</ul>\n<p><strong>③ 转折点：哪条作品是分水岭</strong></p>\n<ul>\n<li>第 <strong>6</strong> 条附近出现 <strong>负向↓转折</strong>（基线跃迁 -63%）。</li>\n<li>✅ 可归因到创作动作（伴随主题/形式变化）（新增方向：低脂轻食、健康代餐、员工福利）——查这次改动是不是改坏了。</li>\n</ul>\n<p><strong>④ 衰退预警</strong></p>\n<ul>\n<li>🟥 <strong>作品基线断崖</strong>：近段作品基线较前期跌 63%（&gt;40%） → 查改版动作（看转折点检测），是不是某次改坏了</li>\n</ul>\n<blockquote>⚠️ <strong>诚实说</strong>：①基于 10 条作品；②你这赛道季节性<strong>中</strong>（淡旺季会让数据起伏，别把淡季掉量当衰退）；③转折点已强制排除外部脉冲才归因。短期波动≠趋势，样本不足时我宁可不下结论。</blockquote>\n<blockquote>大盘提醒：若全赛道同期都在跌，那是平台大盘不是你的账号问题（需赛道基准做相对趋势·见对标段）。</blockquote>\n<h2>同赛道对标：你在同行里排第几</h2>\n<blockquote>绝对数字（比如「平均 105 赞」）脱离赛道没意义——餐饮号 6438 赞可能垫底，知识号 6438 赞可能头部。这一段把你换算成<strong>相对坐标</strong>。</blockquote>\n<blockquote>对标范围：<strong>产业带货 / B2B供货</strong>赛道 · <strong>微号</strong>体量段（4,645 粉）。</blockquote>\n<p><strong>你在同赛道同体量号里的各维度位次（分位越高越好）：</strong></p>\n<ul>\n<li><strong>互动率</strong>（B 互动质量）：你 2.3% → <strong>P10（垫底）</strong> 🔴<strong>（主短板·先补这个）</strong>　〔基准来源：行业经验 · ⚠️ 参考·样本不足（经验带·非真实分位）〕</li>\n</ul>\n<p>👉 <strong>一句话</strong>：你最拖后腿的是 <strong>互动率</strong>（垫底），木桶水位由它决定——<strong>先补这块</strong>，比哪儿都强。</p>\n<p>目标：把它冲到 <strong>6.1%</strong>（同赛道 P60 水平）。</p>\n<blockquote>⚠️ <strong>诚实说</strong>：当前基准多为行业经验带（自建样本库累积中），分位是<strong>参考级</strong>不是精确级。等同赛道同体量样本攒过 100 个，会自动升级为可信级真实分位。</blockquote>\n<blockquote>口径统一：互动率=赞+评+转/播放（口径字典 v1）；只用中位数+分位带做锚，不用易被爆款拉偏的均值。</blockquote>\n<h2>商业转化诊断（三层）</h2>\n<blockquote>这是三层商业诊断：赛道值不值做 → 你该走哪条路变现 → 大概能赚多少。</blockquote>\n<blockquote>所有数字都是<strong>行业经验区间，不是对你账号的精确预测</strong>——说完你知道方向就够了。</blockquote>\n<h3>层A · 你所在赛道值多少钱</h3>\n<p><strong>你的赛道「产业带货 / B2B供货」商业价值：S档（顶级·单粉极贵）</strong></p>\n<ul>\n<li>单粉价值参考：极高（50–500元/线索 · 10–50元/粉·经验区间·需校准）</li>\n<li>投产比：★★★★★</li>\n<li>为什么这样判断：B端/产业带货号·垂直业务明确·精准引流变现效率高·2万粉即可回本</li>\n</ul>\n<blockquote>⚠️ 单粉价值为行业经验区间（需校准）——请结合你的真实成交数据校准。</blockquote>\n<h3>层B · 你该走哪条路变现</h3>\n<p><strong>粉丝关系深度（R-M1）：「中」</strong> · 内容类型（R-M2）：「引」 · 赛道付费意愿（R-M3）：极高（职场/副业可达数万元·健康/育儿数…</p>\n<p><strong>主路径 ✅：私域变现</strong></p>\n<ul>\n<li>为什么：B端/到店型内容·私域变现天花板最高·粉丝=潜在合作客户</li>\n<li>门槛情况：私域变现无硬门槛·任意阶段均可开始建私域·越早越好。</li>\n</ul>\n<p><strong>次路径：知识付费</strong></p>\n<ul>\n<li>为什么：B端账号可封装「选品/供应链」经验做课·增加变现维度</li>\n</ul>\n<p><strong>❌ 禁忌路径：直播打赏</strong></p>\n<ul>\n<li>不建议走这条：B端账号打赏路径不匹配受众属性·浪费信任资产</li>\n</ul>\n<p><strong>从内容到转化的关键纪律：</strong></p>\n<ul>\n<li>前20–50条：纯价值内容，禁止过早变现（信任铺垫期）</li>\n<li>之后：3:7 内容比植入（产品即工具·钩好奇心，不是购买欲）</li>\n<li>只有粉丝主动询问才启动显性转化·广告≤30%红线</li>\n</ul>\n<blockquote>铁律：买单是顺理成章，不是说服；需要费力说服 = 上游信任/精准出了问题。</blockquote>\n<h3>层C · 大概能赚多少（经验区间·诚实说）</h3>\n<p><strong>月产出估算（私域变现路径）：</strong></p>\n<p>私域年贡献 ≈ 公域的5–20倍（方法论结论·经验区间）。核心公式：月产出 ≈ 私域人数 × 月活率(20–40%) × 月付费率(5–15%) × 客单价。（⚠️ 私域人数/月活率需你实际沉淀后才能估·现在无法给精确值）</p>\n<p><strong>回本周期参考：</strong> 私域变现：前期建社群/引流周期长（3–12个月）·但复购率最高·一旦启动回本快（经验区间）</p>\n<p><strong>LTV/CAC 参考：</strong> LTV/CAC：私域最高·LTV/CAC 可达10–50（高复购·低获客成本·经验区间·需校准）</p>\n<p><strong>健康判据：</strong> LTV/CAC &gt; 3 = 健康 · &lt; 1 = 亏损 · 回本周期 &lt; 6个月为优</p>\n<p><strong>⚠️ 以下数据平台不公开（黑盒），上面的估算无法精确——想要更准确的诊断，把后台截图传给我：</strong></p>\n<ul>\n<li>完播率（平台黑盒·需后台截图投喂）</li>\n<li>流量来源分布（黑盒）</li>\n<li>真实进店率/成交率（黑盒）</li>\n<li>粉丝画像（黑盒·影响付费率估算）</li>\n</ul>\n<blockquote>⚠️ 以上所有数值均为「行业经验区间」，不是对你账号的确切数字承诺。进店率/完播率/成交率/粉丝画像/真实销量是平台黑盒，需用你自己的后台数据校准。相对量级参考有效；具体账单请结合真实运营数据。</blockquote>\n<h2>商业数据参考（合规公开数据 · 标黑盒缺口）</h2>\n<blockquote>以下数据来自公开行业资料，标注了哪些真实可信、哪些是黑盒——<strong>宁可告诉你「没接到」，也不瞎编数字</strong>。</blockquote>\n<h3>1️⃣ 你所在赛道的商业体量</h3>\n<ul>\n<li>「产业带货 / B2B供货」赛道暂无公开 GMV 分级数据，建议参考艾瑞/QuestMobile 行业报告。</li>\n<li>⚠️ 精确 GMV 数字属平台黑盒，仅精选联盟/抖音官方报告有定向披露。</li>\n<li>📌 数据来源：—</li>\n</ul>\n<h3>2️⃣ 带货/合作佣金率参考</h3>\n<ul>\n<li><strong>全品类</strong> 品类行业佣金率通常在 <strong>5% – 30%</strong>。</li>\n<li>如果你目前的佣金率低于 5%，可以和品牌方谈——这个品类的空间通常到得了 30%。</li>\n<li>📌 区间来自行业公开政策，实际佣金率因品牌和达人谈判而异。真实在投单品佣金请从精选联盟达人端查询（需账号授权）。</li>\n<li>📌 数据来源：抖音精选联盟官方政策 + 行业研报公开数据（2026）</li>\n</ul>\n<h3>3️⃣ 广告合作理论报价区间（星图参考）</h3>\n<ul>\n<li>北川魔芋姐｜赵娟 目前粉丝量 4,645，通常低于 5000 粉时广告商单较难接洽。先做粉丝积累，待过万后报价会更清晰。</li>\n</ul>\n<h3>4️⃣ 商品比价 · 带货品竞争力</h3>\n<ul>\n<li class=\"act-red\">🔴 <strong>商品历史比价（真实价格 vs 历史均价）</strong>：需接慢慢买开放 API——MVP 阶段暂未接入，可由你提供商品详情页截图来补充诊断。</li>\n<li>核心诊断问题：你挂的链接定价是偏高还是偏低？佣金率高不高？这两个点对转化率影响超过 80% 的内容质量——<strong>东西再好，贵于市场均价 20%+，转化就卡在价格</strong>。</li>\n</ul>\n<h3>⚠️ 这些还是黑盒·拿不到·诚实告你</h3>\n<ul>\n<li class=\"act-red\">🔴 真实销量（GMV·商品维度）— 平台不公开·只有品牌方知道</li>\n<li class=\"act-red\">🔴 完播率 / 流量来源 / 粉丝画像 — 罗盘后台·只有账号主有</li>\n<li class=\"act-red\">🔴 商单实际成交价 — 主播/机构内部数据</li>\n<li class=\"act-red\">🔴 蝉妈妈等第三方平台的精确数字 — 仅作方向参考·禁作精确结论（合规红线）</li>\n</ul>\n<h3>💬 你补充的商业后台数据</h3>\n<p>（以下来自账号主提供的投喂数据·仅用于本次诊断·不对外传播）</p>\n<ul>\n<li>commission：{'category': '全品类', 'rate_low_pct': 5.0, 'rate_high_pct': 30.0, 'source': '抖音精选联盟官方政策 + 行业研报公开数据（2026）', 'note': '区间来自行业公开政策，实际佣金率因品牌和达人谈判而异。真实在投单品佣金请从精选联盟达人端查询（需账号授权）。', 'matched_input': '产业带货 / B2B供货'}</li>\n<li>gmv：{'category': '产业带货 / B2B供货', 'tier': '未知', 'desc': '该品类暂无公开 GMV 分级数据', 'source': '—', 'warning': '精确 GMV 数字属平台黑盒，仅精选联盟/抖音官方报告有定向披露。'}</li>\n<li>xingtu：{'follower': 4645, 'price_low_cny': 300.0, 'price_high_cny': 464.0, 'cpm_track_key': '通用', 'formula': '粉丝(4,645) × CPM(0.03-0.1元/粉) · 保底300元', 'source': '巨量星图公开参考定价模型（2025-2026）', 'calibration_note': '理论报价区间，实际签单受互动率/垂直度/排他条款影响。互动率 &gt;5% 可上浮 20-50%；冷门赛道/低互动可能低于下限。真实市场价需看近期同体量同赛道达人实际报价（仅账号主自知）。'}</li>\n</ul>\n<blockquote>商业数据来源：公开行业政策/研报（佣金率/GMV档）+ 巨量星图公开定价模型（报价）。慢慢买比价/精选联盟真实佣金/罗盘黑盒数据待账号主授权后接入。平台算法权重永久黑盒，谁说得精确都是猜的，本报告不作硬结论。</blockquote>\n<h2>精准转化方案</h2>\n<blockquote>不是泛泛「你可以带货」——这是根据你这个号的真实数据，定制的从内容到成交路径。</blockquote>\n<h3>A. 你的转化阶段：信任铺垫期</h3>\n<p><strong>判断依据</strong>：发布 123 条、4645 个粉丝——粉丝积累不足(建议先到5000)，还没到植入时机。</p>\n<p><strong>粉丝关系深度</strong>：深互动——评论/收藏比率高，说明已有一批真正认可你的粉丝，转化窗口打开。</p>\n<p><strong>现阶段该怎么做</strong>：先把内容做扎实、发够量、让系统认清你是谁。这阶段每条都要服务「他为什么关注我」，不碰转化，稳住。</p>\n<p>❌ R-C5红线：禁止显性转化·不接商单·不放外链·不植入产品</p>\n<h3>B. 这条视频的转化钩子（最多3个）</h3>\n<table><thead><tr>\n<th>钩子</th><th>建议</th>\n</tr></thead><tbody>\n<tr>\n<td>🎣 需求激活钩（前3秒）</td><td>前3秒补一句对着目标用户说的痛点句：讲「你遇过这个问题吗？」比「今天分享一个方法」完播率更高</td>\n</tr>\n<tr>\n<td>🤝 信任建立钩（中段）</td><td>中段补证据帧：真实使用画面/对比截图/评论截图(任选一)，比口说更可信</td>\n</tr>\n<tr>\n<td>📣 行动引导钩（末段CTA）</td><td><strong>评论钩</strong>：评论活跃·末段用问题引评论(「你遇到过吗？评论区告诉我」)·顺带建立讨论社区</td>\n</tr>\n</tbody></table>\n<blockquote>⚠️ 视听六层未传入——钩子建议基于互动数据推断，无视听维度加持。传入视频URL分析视听六层可提升推断准确性。</blockquote>\n<blockquote><strong>铁律：一条视频最多3个钩，超过反而失效——用户注意力是稀缺资源。</strong></blockquote>\n<h3>C. 转化漏斗：你的第一卡点在哪</h3>\n<p><code>曝光 → 完播 → 互动 → 进主页 → 关注 → 私信 → 成交 → 复购</code></p>\n<p><strong>⚡ 第一卡点</strong>：主页留存层(有人进来·但没关注)</p>\n<p><strong>根因</strong>：主页人设不清·Bio没说清「你是谁+给什么+怎么做」·置顶不是最能代表你的那条</p>\n<p><strong>优化动作</strong>：Bio改成一句话：「[你是谁] + [给什么人] + [给他们什么]」；置顶换成转化率最高那条(不是播放最高)；合集按主题归类让陌生人一眼看懂你的方向。</p>\n<blockquote>⚠️ 完播率黑盒：抖音不对外开放完播数据·无法直接测量。以下用互动率代理。如需精准诊断，账号主需投喂抖音创作者中心后台截图。</blockquote>\n<h3>D. 最重要的一件事</h3>\n<p><strong>现在不是变现的时候，是打地基的时候。</strong> 地基没打好就急着变现，粉丝跑了连地基都没了。把内容做扎实，变现自然来。</p>\n<h2>⚠️ 风险预警（专业体检·既看机会也看雷）</h2>\n<blockquote>你所在「餐饮」赛道，第一要防的是：<strong>限流（低质/同质化）</strong>。</blockquote>\n<blockquote>下面每条都标了<strong>可能性</strong>（不是「一定会」），并给了应对——这是概率，不是判决。</blockquote>\n<h3>🟢 提示（潜在隐患·暂不紧急·记录关注）</h3>\n<p><strong>🟢 原创度/搬运判定（平台黑盒·只能提示）</strong>（🟥 平台黑盒·只提示信号·不替平台定论）</p>\n<ul>\n<li>可能性：低风险·建议关注·非当前问题</li>\n<li>怎么办：若有二次剪辑/搬运成分，注意搬运类封号率曾超 60%（2024 政策收紧）·建议提高原创占比。</li>\n<li>依据：搬运类账号封号率统计 2024</li>\n<li>🟥 黑盒：无法替平台判定原创度·仅作信号提示·非定论。</li>\n</ul>\n<p><strong>🟢 过度依赖单一爆款（结构性风险）</strong></p>\n<ul>\n<li>可能性：低风险·建议关注·非当前问题</li>\n<li>怎么办：把验证过的爆款方向稳定复制成多条·别只靠一条；同步布局第二变现路径。</li>\n<li>依据：全域推广·单赛道红利终结 2025（网易/36氪）</li>\n<li>可能性非必然·结构性是隐患不是即时违规。</li>\n</ul>\n<blockquote>⚠️ 平台规则常变（截至 2026-12-31·以抖音最新规则为准）·此处为风险信号提示，不替平台裁决。</blockquote>\n<blockquote>风险是<strong>概率不是必然</strong>——专业诊断的标志是看得见雷，不是只画饼，更不是吓唬你。</blockquote>\n<h2>你所在赛道的大环境（避坑 + 定位）</h2>\n<p><strong>平台高压线（先看这个，别白做）</strong></p>\n<ul>\n<li>AI 生成内容须显著标注（2026-03 新规·未标注会限流 50-80% 甚至下架）</li>\n<li>这些是高压线，碰了会限流/掉号：涉政敏感、虚假宣传/夸大功效、无资质做医疗·金融荐股、未标注的 AI 内容、盗用版权音乐/素材、资质宣传（年限/认证/龙头）必须有据可查——虚假宣传是红线、价格、供货/效果承诺别夸大，留好证据</li>\n<li>背景音乐用平台曲库的免费商用音乐，别用来路不明的（版权风险会限流）</li>\n</ul>\n<p><strong>你在赛道里大概什么位置</strong></p>\n<ul>\n<li>你目前属于「<strong>尾部成长层</strong>」（有基础但未起量）。</li>\n<li>注：按粉丝量粗分·非赛道真实排名(要精确得看竞品·L4)。</li>\n</ul>\n<p><strong>你赛道现在是涨还是跌</strong></p>\n<ul>\n<li>⚠️ 这次<strong>没接到赛道大盘趋势数据</strong>——赛道整体在涨还是跌、红利窗口还在不在，需要接平台官方趋势/行业研报（官方没开放 API，得半自动补），暂时给不了，<strong>宁可告诉你「没接到」也不瞎编</strong>。</li>\n</ul>\n<p><strong>当前平台热点（可蹭·但先看跟你赛道搭不搭）</strong></p>\n<ul>\n<li>育碧创始人克劳德遇飞机失事坠亡、郭士强称杨瀚森将出战对阵荷兰、张雨霏遗憾无自己的单项世界纪录、来佛山沉浸式观赏叠滘龙舟漂移、中考各科老师送祝福</li>\n<li>注：这是当前抖音热榜（实时拉取），不是你赛道专属——能自然结合的才蹭，硬蹭反而违和。</li>\n</ul>\n<blockquote>环境数据来自合规授权渠道（国内不出境）。平台规则是官方明文；赛道趋势属半自动补充，<strong>平台算法的具体权重是黑盒，谁说得精确都是猜的</strong>，不作硬结论。</blockquote>\n<h2>七、两个提醒:把资质晒出来 + 别踩合规坑</h2>\n<p><strong>① 你简介里的「说法」,建议晒证据(②事实核查)</strong></p>\n<p>你写了带「年、非遗、传承、龙头、省级」这类的资质/头衔——是真的就是硬核优势,但<strong>口说无凭</strong>(我没法替你核实真假,看你内容的人也一样)。把<strong>证书、工厂实拍、授牌、媒体报道</strong>晒出来,尤其 B2B 找你合作的人最看这个,晒证据比口头说有用得多。</p>\n<p><strong>② 合规别踩坑(⑥合规)</strong></p>\n<ul>\n<li>背景音乐用抖音曲库的免费商用音乐,别用来路不明的(版权风险·会限流甚至下架)。</li>\n<li>资质宣传(年限/非遗/龙头这类)确保有据可查——<strong>虚假宣传是红线</strong>(被举报会掉号)。</li>\n<li>价格、供货/效果承诺别夸大,留好证据。</li>\n</ul>\n<h2>🎯 明天就能做的 3 件事（按先后排好了）</h2>\n<blockquote>上面诊断说了一堆，到底<strong>先做哪件</strong>？我按「见效快、最省事、最紧急」排好序了——<strong>别贪多，先把前几件做完</strong>，攒个快速正反馈再往下走。</blockquote>\n<ul>\n<li>这次没有识别到明确的待办行动项——可能是诊断信息不足，或你的账号当前没有突出短板。补上更完整的账号/作品数据后，这里会给你「明天就能做的具体几件事」。</li>\n</ul>\n<blockquote>⚠️ 排序权重（ROI=1.0 / 难度=1.0 / 紧急=0.8）是初始经验值，非铁律——会用真实回测数据（attribution_cache）持续校准。每件下方都给了打分拆解，不是玄学评分。</blockquote>\n<h2>八、这份分析有多可信(实话实说)</h2>\n<ul>\n<li>上面的数字(粉丝、点赞、作品、标签、规律)<strong>都是你抖音账号的真实公开数据,没有一个是编的</strong>。</li>\n<li>但有两个诚实的提醒:</li>\n<ol>\n</ul>\n<li>这次<strong>只看了你一个号、一个数据来源</strong>,没跟竞品交叉验证,所以给你的是「靠谱的方向」,别当成 100% 精确的结论。</li>\n<li>有些关键数据抖音<strong>不公开</strong> —— 比如完播率、流量从哪来、有没有转化 —— 这些拿不到,我<strong>宁可告诉你「拿不到」,也绝不瞎编</strong>。</li>\n</ol>\n<h2>九、30 天后来复诊</h2>\n<p>这份报告是 <strong>2026-06-22</strong> 的快照，账号状态会随你的更新在变。</p>\n<p><strong>建议在以下任一情况下回来复诊：</strong></p>\n<ul>\n<li>📅 距今满 30 天（约 2026-07-22）——看执行后有没有往对的方向走</li>\n<li>📈 粉丝或均赞出现明显变化（涨了 30%+ 或跌了 20%+）——数据变了，诊断结论也要更新</li>\n<li>🎯 换了内容方向，或新发了 10 条以上——积累了新样本才能看出新规律</li>\n<li>💡 照着建议做了一段时间，想验证到底有没有效——验证闭环，让数据说话</li>\n</ul>\n<blockquote>越用越准：你的视听分析结果会积累到账号归因库——多分析几次，「爆款视听公式」的置信度会越来越高。</blockquote></div>\n<div style=\"margin-top:32px;padding-top:12px;border-top:1px solid #E2E8F0;font-size:11px;color:#94A3B8;text-align:center\">\n  元探 MetaProbe · 数据来自合法授权渠道 · 所有数字均为平台公开真值\n</div>\n</body>\n</html>","douyin-chengduchihuo-20260621-150000":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>元探报告 · 成都吃货日记｜小李</title>\n\n<style>\n.prb { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.75;color:#1E293B;max-width:100%;word-break:break-word }\n.prb h1,.prb h2 { color:#1E3A8A;margin:24px 0 10px;padding-bottom:8px;border-bottom:2px solid #EFF6FF;font-size:16px }\n.prb h3 { color:#1E293B;font-size:14px;font-weight:700;margin:16px 0 8px }\n.prb h4 { color:#475569;font-size:13px;font-weight:600;margin:12px 0 6px }\n.prb p  { margin:0 0 10px }\n.prb strong { color:#1E3A8A }\n.prb em  { color:#FF7A1A;font-style:normal;font-weight:600 }\n.prb blockquote {\n  background:#F1F5F9;border-left:3px solid #FF7A1A;\n  padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0;\n  font-size:13px;color:#475569\n}\n.prb ul,.prb ol { margin:8px 0 10px 0;padding-left:0;list-style:none }\n.prb li { padding:4px 0 4px 20px;position:relative;border-bottom:1px solid #F8FAFC }\n.prb li:last-child { border-bottom:none }\n.prb li::before { content:'▸';position:absolute;left:4px;color:#FF7A1A;font-size:11px;top:6px }\n.prb ol li::before { content:counter(li)'.' rong></p>\n    <p>高赞作品的评论、收藏明显更高(说明这些内容更能激发互动)。</p>\n    <p><strong>你只要多做高赞那批的方向、数据大概率比其他内容好</strong>这是你自己的数据告诉你、比抄别人靠谱。</p>\n    <p><strong>你最近状态在涨还是在掉</strong></p>\n    <p>近期不如早期、该回头看看早期哪些做对了。</p>\n    \n    <h3>三、你做得对的地方</</p>\n    <p>内容方向比较集中、能认清你是做「美食」的、这是好事、接着往深里做。</p>\n    \n    <p><strong>四、你有一个别人抢不走的优势</strong></p>\n    <p>你讲的「成都苍蝇馆里藏不住了｜排队里小时·人均3元吃到哭 #成都美食 #苍…」这种真实的经历和感受、是你亲身经历、带着体温的、AI编不出来、别的博主也抄不像。</p>\n    \n    <p><strong>五、接下来具体怎么做(照着做就行</strong></p>\n    <p><strong>红色的第一步｜本周就能改：把最揪心的那句话放到开头3秒</strong></p>\n    <p>抖音前3秒决定别人划不划走、一开口就甩出最能戳中人的那句话。</p>\n    <p><strong>黄色的第二步｜有余力再做：把你那条880个赞赞视频研究透</strong></p>\n    <p>翻出来看它讲了什么、开头怎么说、戳中了什么、然后多做那个方向。</p>\n    \n    <p><strong>六、你这个号整体判断：处在什么阶段该往哪走</strong></p>\n    <p><strong>怎么判断的？（不是拍脑袋）：看你粉丝量（388个）、近期数据在掉、方向比较集中</strong></p>\n    <p>综合下来：<你处阶段：成熟期、重心转向私域沉淀和变现、内容维持稳定即可。</p>\n    <p><strong>你抄不走的护城河：你的真实表达和独特视角（「美食」里你的经历和人格、AI和别人抄不像</strong></p>\n    <p><strong>你做的「美食」是个值钱的方向：受众极广、适合探店团购、带货变现。</strong></p>\n    <p><strong>你有过8赞的爆款、说明天花板不低；关键是把「偶然」变成「稳定」</strong></p>\n    \n    <p><strong>七、这份分析有多可信（实话实说</strong></p>\n    <p>上面的数字（粉丝、点赞、作品、标签、规律）都是都是你抖音账号的真实公开数据、没有一个是编的。</p>\n    <p><strong>但有两个诚实的提醒：</strong></p>\n    <p>这次只看了你一个号、一个数据来源、没跟竞品交叉验证、所以给你的是「靠谱的方向」也别当成 188个精确结论。</p>\n    <p><strong>2、有些关键数据抖音不公开——比如完播率、流量从哪来、有没有转化——这些拿不到、我宁可告诉你「拿不到」也绝不瞎编</strong></p>\n    \n    <p><strong>八、3天后来复诊</</p>\n    <p>这份报告是 2226-6-2快照、账号状态会随你更新在变。</</p>\n    <p><strong>建议在以下任一情况下回来复诊：</strong></p>\n    <p><strong>1、距今满3天（约 2226-7-2）看执行后有没有往的方向走</strong></p>\n    <p><strong>二、粉量或均赞出现明显变化（涨了30%或跌了22）数据变了、诊断结论也要更新</strong></p>\n    <p><strong>三、换了内容方向、或新发了1条以上、积累了新样本才能看出新规律</strong></p>\n    <p><strong>四、照着建议做了一段时间、想验证到底有没有效、验证闭环、让数据说话</strong></p>\n    <p><strong>越用越准：你的视听分析结果会积累到账号归因库、多分析几次、「爆款视听公式」的置信度会越来越高。</</p>\n</</div>\n<div style=\"margin-top:32px;padding-top:12px;border-top:1px solid #E2E8F0;font-size:11px;color:#94A3B8;text-align:center\">\n  元探 MetaProbe · 数据来自合法授权渠道 · 所有数字均为平台公开真值\n</div>\n</body>\n</html>", </</li>\n    </ul>\n    <p>你最近状态在涨在掉：</</p>\n    <p>在掉，近期不如早期，该回头看看早期哪些做对了。</</p>\n    \n    <h3 >三、你做得对的地方</</>\n    <p>内容方向比较集中，能认清你是做「时尚美妆」的，这是好事，接着往深里做。</</p>\n    \n    < <四、你有一个别人抢不走的优势</</>\n    <p>别灰心，你手里有最值钱的东西：真实。你讲的「28 �岁脸部胶原流失怎么救｜三步急救方案，真实测评不滤镜 #护肤 #抗…这种真实的经历和感受，是你亲身经历、带着体温的。AI 生成的内容满天飞，恰恰是你这种「真实的表达」最稀缺、最值钱。</</p>\n    \n    < <五、接下来具体怎么做(照着做就行)</</>\n    <ol>\n        < <第一步 | 本周就能改：把最揪心的那句话放到开头 3 秒</</>\n        <抖音前 3 秒决定别人划不划走，一开口就甩出最能戳中人的那句话。\n        < <第二步 | 有余力再做：把你那条 38 个赞的视频研究透</>\n        <翻出来看它讲了什么、开头怎么说、戳中了什么，然后多做那个方向。放大你自己验证过的成功，比抄别人靠谱。</\n    </ol>\n    \n    < <六、你这个号整体判断：处在什么阶段、该往哪走</</>\n    <p>怎么判断的：看你粉丝量（1 个）、近期数据在掉、方向比较集中综合下来：</p>\n    <ul>\n        < <所处阶段：成熟期（重心转向私域沉淀和变现，内容维持稳定即可）。</</li>\n        < <你抄不走的护城河：你的真实表达和独特视角（「时尚美妆」里你的经历和人格，AI 和别人抄不像）。</</li>\n        < <你做的「时尚美妆」」是个值钱的方向：品牌预算最多，适合带货和品牌合作。</</li>\n        < <你有过小爆款，说明天花板不低；关键是把「偶然」变成「稳定」。</</li>\n    </ul>\n    \n    < <七、这份分析有多可信(实话实说)</</>\n    <div class=\"hhonest\">\n        <上面的数字（粉丝、点赞、作品、标签、规律）都是你抖音账号的真实公开数据，没有一个是编的。</</div>\n        <但有两个诚实的提醒：</p>\n        <ol>\n            <li>这次只看了你一个号、一个数据来源，没跟竞品交叉验证，所以给你的是「靠谱的方向」也别当成 1 个精确结论。</</li>\n            <li>有些关键数据抖音不公开——比如完播率、流量从哪来、有没有转化——这些拿不到，我宁可告诉你「拿不到」也绝不瞎编；</</li>\n        </ol>\n    </div>\n    \n    <p> <八、30 天后来复诊</p>\n    <p>这份报告是 2222-6-2 的快照，账号状态会随你更新在变。</</p>\n    <p>建议在以下任一情况下回来复诊：</p>\n    <ol>\n        < <第一情况：距今满 30 天（约 2226-7-22）看执行后有没有往对的方向走。</</li>\n        < <第二情况：粉丝或均赞出现明显变化（涨了 31%%或跌了 22%）数据变了，诊断结论也要更新。</</li>\n        < <第三情况：换了了内容方向，或新发了 11 条以上看了新样本才能看出新规律。</</li>\n        < <第四情况：照着建议做了一段时间，想验证到底有没有效验证闭环，让数据说话。</</li>\n    </ol>\n    <p>越用越准：你的视听分析结果会积累到账号归因库多分析几次，「爆款视听公式」的置信度会越来越高。</</p>\n</div>\n<div style=\"margin-top:32px;padding-top:12px;border-top:1px solid #E2E8F0;font-size:11px;color:#94A3B8;text-align:center\">\n  元探 MetaProbe · 数据来自合法授权渠道 · 所有数字均为平台公开真值\n</div>\n</body>\n</html>","douyin-chuanweipaojiao-20260621-152000":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charse /* ============================================================

function fmtNum(n) {
  if (n == null) return '—';
  n = Number(n);
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return n.toLocaleString('zh-CN');
}
const fmtFollowers = fmtNum;

function fmtDate(s) {
  if (!s) return '—';
  return s.slice(0, 10);
}

function fmtDateTime(s) {
  if (!s) return '—';
  return s.slice(0, 19).replace('T', ' ');
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function highlight(text, q) {
  if (!q || !text) return escHtml(text || '');
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escHtml(text).replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
}

/* ============================================================
   Markdown 渲染（零依赖）
   ============================================================ */
function renderMarkdown(text) {
  if (!text) return '<p class="no-report">暂无报告全文。</p>';
  const lines = text.split('\n');
  const out = [];
  let inUl = false, inOl = false, inTable = false, tableHead = false;

  function closeAll() {
    if (inUl)    { out.push('</ul>'); inUl = false; }
    if (inOl)    { out.push('</ol>'); inOl = false; }
    if (inTable) { out.push('</tbody></table>'); inTable = false; tableHead = false; }
  }

  function inlineMd(s) {
    let r = String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    r = r
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
    return r;
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^# /.test(line))   { closeAll(); out.push(`<h2>${inlineMd(line.slice(2))}</h2>`); }
    else if (/^## /.test(line))  { closeAll(); out.push(`<h3>${inlineMd(line.slice(3))}</h3>`); }
    else if (/^### /.test(line)) { closeAll(); out.push(`<h4>${inlineMd(line.slice(4))}</h4>`); }
    else if (/^---+$/.test(line.trim())) { closeAll(); out.push('<hr>'); }
    else if (/^\|/.test(line)) {
      const cells = line.split('|').slice(1,-1).map(c => c.trim());
      if (cells.every(c => /^[-:]+$/.test(c))) { /* skip separator */ }
      else if (!inTable) {
        closeAll();
        out.push('<table><thead><tr>');
        cells.forEach(c => out.push(`<th>${inlineMd(c)}</th>`));
        out.push('</tr></thead><tbody>');
        inTable = true; tableHead = true;
      } else {
        out.push('<tr>');
        cells.forEach(c => out.push(`<td>${inlineMd(c)}</td>`));
        out.push('</tr>');
      }
    }
    else if (/^> /.test(line)) { closeAll(); out.push(`<blockquote>${inlineMd(line.slice(2))}</blockquote>`); }
    else if (/^[-*] /.test(line)) {
      if (inTable) { out.push('</tbody></table>'); inTable = false; }
      if (inOl) { out.push('</ol>'); inOl = false; }
      if (!inUl) { out.push('<ul>'); inUl = true; }
      out.push(`<li>${inlineMd(line.slice(2))}</li>`);
    }
    else if (/^\d+\. /.test(line)) {
      if (inTable) { out.push('</tbody></table>'); inTable = false; }
      if (inUl) { out.push('</ul>'); inUl = false; }
      if (!inOl) { out.push('<ol>'); inOl = true; }
      out.push(`<li>${inlineMd(line.replace(/^\d+\. /,''))}</li>`);
    }
    else if (line.trim() === '') { closeAll(); }
    else { closeAll(); out.push(`<p>${inlineMd(line)}</p>`); }
  }
  closeAll();
  return out.join('\n');
}

  });
  row.querySelector('[data-type=""]').classList.toggle('active', activeType === '');
}

function buildVersionOptions() {
  const sel = document.getElementById('version-select');
  const versions = [...new Set(allCases.map(c => c.probe_version).filter(Boolean))].sort().reverse();
  const current = sel.value;
  sel.innerHTML = '<option value="">全部版本</option>';
  versions.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v.length > 15 ? v.slice(0,15) + '…' : v;
    sel.appendChild(opt);
  });
  sel.value = current;
}

function updateStats() {
  document.getElementById('stat-total').textContent = allCases.length;
  const accounts = new Set(allCases.map(c => c.sec_uid || c.account_name)).size;
  document.getElementById('stat-accounts').textContent = accounts;
  const passed = allCases.filter(c => c.validation_pass).length;
  const rate = allCases.length ? Math.round(passed / allCases.length * 100) + '%' : '—';
  document.getElementById('stat-pass-rate').textContent = rate;
}

function getFilteredCases() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const sort = document.getElementById('sort-select').value;
  const ver  = document.getElementById('version-select').value;

  let list = allCases.filter(c => {
    if (activePlatform && (c.platform || '') !== activePlatform) return false;
    if (activeType && c.account_type !== activeType) return false;
    if (ver && c.probe_version !== ver) return false;
    if (q) {
      const hay = [c.account_name, c.ai_summary, c.video_title, ...(c.tags || [])].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  list.sort((a, b) => {
    if (sort === 'followers-desc') return (b.follower || 0) - (a.follower || 0);
    if (sort === 'followers-asc')  return (a.follower || 0) - (b.follower || 0);
    return (b.analyzed_at || '').localeCompare(a.analyzed_at || '');
  });

  return list;
}

function renderCards() {
  filteredCases = getFilteredCases();
  const grid  = document.getElementById('cards-grid');
  const empty = document.getElementById('empty-state');
  const q     = document.getElementById('search-input').value.trim().toLowerCase();

  grid.innerHTML = '';

  const fcEl = document.getElementById('filter-count');
  const isFiltered = activePlatform || activeType || q || document.getElementById('version-select').value;
  if (isFiltered) {
    fcEl.style.display = '';
    fcEl.textContent = `已筛选 ${filteredCases.length} / 共 ${allCases.length} 个案例`;
  } else {
    fcEl.style.display = 'none';
  }

  if (filteredCases.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  filteredCases.forEach(c => grid.appendChild(buildCard(c, q)));

  if (currentCase) markActiveCard(currentCase.run_id);
}

/* ============================================================
   卡片构建
   ============================================================ */
function buildCard(c, q) {
  const div = document.createElement('div');
  div.className = 'case-card';
  div.dataset.runId = c.run_id;
  div.addEventListener('click', () => enterReadMode(c));

  const pCfg = PLATFORM_CONFIG[c.platform || ''] || null;
  if (pCfg) div.innerHTML += `<div class="platform-badge ${pCfg.cls}">${pCfg.emoji} ${escHtml(pCfg.label)}</div>`;

  if (c.version_count > 1) div.innerHTML += `<div class="version-badge">v${c.version_count}</div>`;

  const style = getTypeBadgeStyle(c.account_type);
  div.innerHTML += `<div><span class="type-badge" style="background:${style.bg};color:${style.color};">${escHtml(c.account_type || '未知类型')}</span></div>`;
  div.innerHTML += `<div class="card-account">${highlight(c.account_name || '—', q)}</div>`;
  div.innerHTML += `<div class="card-followers">粉丝 <strong>${fmtFollowers(c.follower)}</strong> &nbsp;·&nbsp; 均赞 ${fmtFollowers(c.avg_like)} &nbsp;·&nbsp; 爆款比 ${c.burst_ratio != null ? c.burst_ratio + 'x' : '—'}</div>`;

  const ps = polishStatus(c.polish);
  const avIcon = c.has_av ? '<span class="icon-item info">🎥 视听✅</span>' : '<span class="icon-item">🎥 视听—</span>';
  const passIcon = c.validation_pass ? '<span class="icon-item ok">✅ 验收通过</span>' : '<span class="icon-item fail">❌ 有缺口</span>';
  div.innerHTML += `<div class="card-icons">${avIcon}<span class="icon-item ${ps.cls}">${ps.icon} ${escHtml(ps.label)}</span>${passIcon}</div>`;

  if (c.ai_summary) div.innerHTML += `<div class="card-summary">${highlight(c.ai_summary, q)}</div>`;

  if (c.tags && c.tags.length) {
    const tagsHtml = c.tags.map(t => `<span class="tag-pill" data-tag="${escHtml(t)}">${highlight(t, q)}</span>`).join('');
    div.innerHTML += `<div class="card-tags">${tagsHtml}</div>`;
  }

  div.innerHTML += `<div class="card-footer">
    <div class="card-meta">${fmtDate(c.analyzed_date || c.analyzed_at)}${c.report_chars ? ' · ' + c.report_chars.toLocaleString() + '字' : ''}</div>
    <div class="btn-detail">查看详情</div>
  </div>`;

  div.querySelectorAll('.tag-pill').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      document.getElementById('search-input').value = el.dataset.tag;
      renderCards();
    });
  });

  return div;
}

function markActiveCard(runId) {
  document.querySelectorAll('.case-card').forEach(el =>
    el.classList.toggle('card-active', el.dataset.runId === runId));
}

/* ============================================================
   模式切换
   ============================================================ */
function enterReadMode(c) {
  currentCase = c;
  activeTab   = 'report';
  readTypeFilter = '全部';

  document.body.classList.remove('mode-list');
  document.body.classList.add('mode-read');

  // header
  document.getElementById('read-account').textContent = '@' + (c.account_name || '—');
  document.getElementById('read-sub').textContent =
    [fmtFollowers(c.follower) + '粉', c.account_type, fmtDateTime(c.analyzed_at)].filter(Boolean).join(' · ');

  // 左侧导航
  updateReadSidebar(c);

  // Word 下载按钮
  const wordBtn = document.getElementById('word-btn');
  if (isServerMode) {
    wordBtn.onclick = e => { e.preventDefault(); openWordFile(c.run_id, wordBtn); };
    wordBtn.textContent = '↓ 下载 Word 报告';
  } else {
    wordBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = getDocxUrl(c.run_id); a.download = 'report.docx'; a.click();
    };
    wordBtn.textContent = '↓ 下载 Word 报告';
  }

  // tabs
  document.querySelectorAll('.rtab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'report'));

  // header nav
  updateReadHeaderNav(c);

  // 卡片高亮（在列表隐藏前做）
  markActiveCard(c.run_id);

  // URL
  const sp = new URLSearchParams(window.location.search);
  sp.set('case', c.run_id);
  history.pushState({}, '', '?' + sp.toString());

  // 渲染内容
  renderReadBody();
}

function exitReadMode() {
  document.body.classList.remove('mode-read');
  document.body.classList.add('mode-list');
  currentCase = null;
  markActiveCard('');
  document.getElementById('toc-list').innerHTML = '';

  const sp = new URLSearchParams(location.search);
  sp.delete('case');
  history.pushState({}, '', sp.toString() ? '?' + sp.toString() : location.pathname);
}

function updateReadHeaderNav(c) {
  const idx   = filteredCases.findIndex(x => x.run_id === c.run_id);
  const total = filteredCases.length;
  document.getElementById('hn-prev').disabled = (idx <= 0);
  document.getElementById('hn-next').disabled = (idx < 0 || idx >= total - 1);
  document.getElementById('read-nav-index').textContent = idx >= 0 ? `第 ${idx+1}/${total} 个` : '';
}

function updateReadSidebar(c) {
  // 类型 chips
  const types = ['全部', ...new Set(allCases.map(x => x.account_type).filter(Boolean))];
  const typeBar = document.getElementById('read-type-chips');
  typeBar.innerHTML = types.map(t => {
    const label = t === '全部' ? `全部 ${allCases.length}` : t;
    return `<div class="read-type-chip ${readTypeFilter === t ? 'active' : ''}" data-type="${escHtml(t)}">${escHtml(label)}</div>`;
  }).join('');

  // 案例列表
  const filtered = readTypeFilter === '全部' ? allCases : allCases.filter(x => x.account_type === readTypeFilter);
  const caseList = document.getElementById('read-case-list');
  caseList.innerHTML = filtered.map(x => `
    <div class="read-case-item ${x.run_id === c.run_id ? 'active' : ''}" data-run-id="${escHtml(x.run_id)}">
      <div>${escHtml(x.account_name)}</div>
      <div class="rci-type">${escHtml(x.account_type || '—')}</div>
      <div class="rci-follower">${fmtFollowers(x.follower)}粉</div>
    </div>
  `).join('');
}

/* ============================================================
   阅读面板内容渲染
   ============================================================ */
function renderReadBody() {
  const body = document.getElementById('read-body');
  body.className = activeTab === 'report' ? '' : 'padded';
  document.getElementById('toc-list').innerHTML = '';

  if (activeTab === 'report') {
    renderReportTab(currentCase, body);
  } else if (activeTab === 'dashboard') {
    body.innerHTML = renderDashboardTab(currentCase);
  } else if (activeTab === 'history') {
    body.innerHTML = renderHistoryTab(currentCase);
  }
  body.scrollTop = 0;
}

/* ── 内嵌报告（file:// 模式回退·解析一次缓存）── */
let _embeddedReports;
function getEmbeddedReport(runId) {
  if (_embeddedReports === undefined) {
    try {
      const el = document.getElementById('embedded-reports');
      _embeddedReports = el ? JSON.parse(el.textContent.trim()) : {};
    } catch (_) { _embeddedReports = {}; }
  }
  return _embeddedReports[runId] || null;
}

/* ── 报告全文（懒加载 + Shadow DOM）── */
async function renderReportTab(c, body) {
  if (reportCache[c.run_id] !== undefined) {
    injectShadowReport(body, c, reportCache[c.run_id]);
    return;
  }

  body.innerHTML = `<div style="padding:20px">
    <div class="skeleton wide"></div><div class="skeleton medium"></div>
    <div class="skeleton short" style="margin-bottom:20px"></div>
    <div class="skeleton wide"></div><div class="skeleton medium"></div>
    <div class="skeleton wide" style="margin-bottom:20px"></div>
  </div>`;

  if (!isServerMode) {
    // file:// 双击模式：从内嵌报告块取，无需 fetch，直接中间栏渲染
    const emb = getEmbeddedReport(c.run_id);
    reportCache[c.run_id] = emb ? { type: 'html', content: emb } : null;
    injectShadowReport(body, c, reportCache[c.run_id]);
    return;
  }

  let loaded = null, type = 'html';
  try {
    let res = await fetch(`../data/cases/${c.run_id}/report.html`, { cache: 'no-store' });
    if (res.ok) { loaded = await res.text(); }
    else {
      type = 'md';
      res = await fetch(`../data/cases/${c.run_id}/report.md`, { cache: 'no-store' });
      if (res.ok) loaded = await res.text();
    }
  } catch (_) {}

  reportCache[c.run_id] = loaded ? { type, content: loaded } : null;
  if (currentCase?.run_id === c.run_id && activeTab === 'report') {
    injectShadowReport(body, c, reportCache[c.run_id]);
    body.scrollTop = 0;
  }
}

function injectShadowReport(body, c, cached) {
  const tocList = document.getElementById('toc-list');
  tocList.innerHTML = '';

  if (!cached) {
    // 报告确实缺失（内嵌块无此 run_id 且非服务器模式）— 页内提示，不跳转
    body.className = 'padded';
    body.innerHTML = `
      ${c.video_title ? `<div style="margin-bottom:14px"><div class="video-title-box">${escHtml(c.video_title)}</div></div>` : ''}
      ${c.ai_summary ? `<div style="background:var(--blue-bg);border-left:3px solid var(--blue);padding:12px 14px;border-radius:0 8px 8px 0;margin-bottom:16px">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">AI 摘要</div>
        <div style="font-size:14px;font-weight:500;color:var(--text-dark)">${escHtml(c.ai_summary)}</div>
      </div>` : ''}
      <div style="padding:14px 16px;background:#FFF7ED;border-radius:8px;font-size:13px;color:var(--text-dark);line-height:1.7">
        <div style="font-weight:700;margin-bottom:6px">📄 本案例报告未内嵌</div>
        重新生成报告后，运行
        <code style="font-size:11px;background:#E2E8F0;padding:1px 6px;border-radius:3px">python3 hub/build_embed.py</code>
        即可把报告打包进页面，双击离线阅读；或运行
        <code style="font-size:11px;background:#E2E8F0;padding:1px 6px;border-radius:3px">python3 hub/serve.py</code>
        启动服务后访问。
      </div>`;
    return;
  }

  if (cached.type === 'html') {
    body.innerHTML = '';
    const host = document.createElement('div');
    host.style.cssText = 'height:100%;display:block';
    body.appendChild(host);

    try {
      const shadow = host.attachShadow({ mode: 'open' });
      const parser = new DOMParser();
      const doc = parser.parseFromString(cached.content, 'text/html');
      const styles = [...doc.querySelectorAll('style,link[rel="stylesheet"]')];
      const bodyContent = doc.body ? doc.body.innerHTML : cached.content;
      const styleHtml = styles.map(s => s.outerHTML).join('\n');
      shadow.innerHTML = styleHtml + `<div id="report-root" style="padding:16px">${bodyContent}</div>`;
      setTimeout(() => buildTocFromShadow(shadow, tocList, body), 100);
    } catch (e) {
      const blob = new Blob([cached.content], { type: 'text/html;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      body.innerHTML = `
        <div style="padding:6px 12px;font-size:11px;color:var(--text-muted);background:var(--green-bg);border-bottom:1px solid var(--border)">
          <span style="background:var(--green-bg);color:var(--green);padding:1px 7px;border-radius:4px;font-weight:600">HTML 精美排版</span>
        </div>
        <iframe src="${url}" style="width:100%;height:calc(100% - 30px);border:none;background:#fff;display:block" onload="URL.revokeObjectURL('${url}')"></iframe>`;
    }
    return;
  }

  // MD fallback
  const container = document.createElement('div');
  container.className = 'md-content';
  container.innerHTML = renderMarkdown(cached.content);
  body.innerHTML = `<div style="font-size:11px;color:var(--text-muted);padding:6px 12px;background:#FFF7ED;border-bottom:1px solid var(--border)">
    <span style="background:#FFF7ED;color:var(--orange);padding:1px 7px;border-radius:4px;font-weight:600">Markdown 模式</span>
    <span style="margin-left:6px">report.html 未找到</span>
  </div>`;
  body.appendChild(container);
  buildTocFromDom(container, tocList, body);
}

/* ── TOC 构建 ── */
function buildTocFromShadow(shadow, tocEl, scrollEl) {
  const root = shadow.getElementById('report-root') || shadow;
  const headings = [...root.querySelectorAll('h1,h2,h3')];
  buildTocItems(headings, tocEl, scrollEl, (h, id) => {
    h.id = id;
    return () => shadow.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function buildTocFromDom(container, tocEl, scrollEl) {
  const headings = [...container.querySelectorAll('h1,h2,h3,h4')];
  buildTocItems(headings, tocEl, scrollEl, (h, id) => {
    h.id = id;
    return () => h.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function buildTocItems(headings, tocEl, scrollEl, makeScrollFn) {
  if (!headings.length) return;
  headings.forEach((h) => {
    const id = 'toc-h-' + (++tocIdCounter);
    const scrollFn = makeScrollFn(h, id);
    const item = document.createElement('div');
    const tag = h.tagName.toLowerCase();
    item.className = 'toc-item' + (tag === 'h3' || tag === 'h4' ? ' h3' : '');
    item.textContent = (h.textContent.replace(/^[#·\s]+/, '').trim() || '(无标题)').slice(0, 26);
    item.addEventListener('click', () => {
      scrollFn();
      tocEl.querySelectorAll('.toc-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
    });
    tocEl.appendChild(item);
  });

  if (scrollEl && window.IntersectionObserver) {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id;
          const tocItems = [...tocEl.querySelectorAll('.toc-item')];
          const idx = headings.findIndex(h => h.id === id);
          tocItems.forEach((item, i) => item.classList.toggle('active', i === idx));
        }
      });
    }, { root: scrollEl, threshold: 0.1, rootMargin: '-10% 0px -70% 0px' });
    headings.forEach(h => { if (h.id) observer.observe(h); });
  }
}

/* ============================================================
   数据仪表盘 Tab（7 区块）
   ============================================================ */
function renderDashboardTab(c) {
  const follower = c.follower || 0;
  let tierClass = 'tier-start', tierLabel = '冷启 (<1千)', tierColor = '#94A3B8';
  if (follower >= 1000000)     { tierClass = 'tier-head';   tierLabel = '头部 (100万+)';  tierColor = 'var(--green)'; }
  else if (follower >= 100000) { tierClass = 'tier-growth'; tierLabel = '成熟 (10-100万)'; tierColor = 'var(--blue)'; }
  else if (follower >= 10000)  { tierClass = 'tier-growth'; tierLabel = '成长 (1-10万)';   tierColor = '#6366F1'; }
  else if (follower >= 1000)   { tierClass = 'tier-start';  tierLabel = '起步 (1千-1万)';  tierColor = '#F59E0B'; }

  const burstHot  = c.burst_ratio != null && c.burst_ratio >= 10;
  const burstWarm = c.burst_ratio != null && c.burst_ratio >= 5 && c.burst_ratio < 10;
  const burstPct  = c.burst_ratio != null ? Math.min(100, (c.burst_ratio / 30) * 100).toFixed(0) : 0;
  const burstColor = burstHot ? 'var(--orange)' : burstWarm ? '#F59E0B' : 'var(--blue-light)';

  // 区块 A：账号概况（扩充）
  const sigHtml = c.signature
    ? `<div class="sig-box">${escHtml(c.signature.slice(0,80))}${c.signature.length > 80 ? '…' : ''}</div>`

  const hashtagsHtml = (c.hashtags && c.hashtags.length)

    : '';
  const verticalHtml = c.vertical_score != null
    ? `<div class="detail-row"><span class="dr-label">垂直度</span><span class="dr-value">${c.vertical_score} <span class="eng-note">(0-1 · 越高越聚焦)</span></span></div>`
    : '';

  const sectionA = `
    <div class="dashboard-section">
      <div class="dashboard-section-title">👤 账号概况</div>
      <div class="metrics-grid-3">
        <div class="metric-card ${tierClass}">
          <div class="m-label">粉丝数</div>
          <div class="m-value">${fmtFollowers(c.follower)}</div>
          <div class="m-badge" style="background:${tierColor};color:#fff;margin-top:4px">${tierLabel.split(' ')[0]}</div>
        </div>
        <div class="metric-card">
          <div class="m-label">均赞 / 最高赞</div>
          <div class="m-value" style="font-size:16px">${fmtFollowers(c.avg_like)}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px">最高 ${fmtFollowers(c.max_like)}</div>
        </div>
        <div class="metric-card ${burstHot ? 'burst-hot' : ''}">
          <div class="m-label">爆款比</div>
          <div class="m-value">${c.burst_ratio != null ? c.burst_ratio + 'x' : '—'}</div>
          ${c.burst_ratio != null ? `<div class="burst-bar-wrap"><div class="burst-bar-fill" style="width:${burstPct}%;background:${burstColor}"></div></div>` : ''}
          ${burstHot ? '<div style="font-size:10px;color:var(--orange);margin-top:3px;font-weight:700">⚡ 高爆款</div>' : burstWarm ? '<div style="font-size:10px;color:#F59E0B;margin-top:3px">🔥 有爆款</div>' : ''}
        </div>
      </div>
      <div class="detail-row"><span class="dr-label">粉丝段位</span><span class="dr-value" style="color:${tierColor};font-weight:600">${tierLabel}</span></div>
      ${verticalHtml}
      ${sigHtml ? `<div style="font-size:11px;color:var(--text-muted);margin-top:4px;margin-bottom:2px">简介</div>${sigHtml}` : ''}
      ${hashtagsHtml ? `<div style="font-size:11px;color:var(--text-muted);margin-top:4px;margin-bottom:2px">高频标签</div>${hashtagsHtml}` : ''}
    </div>`;

  // 区块 B：本条视频（扩充）
  const vLike    = c.video_like    || 0;

  }
  const engRate  = vLike > 0 ? ((vComment + vCollect) / vLike * 100) : null;
  const engColor = engRate == null ? '' : engRate >= 20 ? 'color:var(--green)' : engRate >= 10 ? 'color:var(--orange)' : 'color:var(--text-muted)';
