idth:max-content;max-width:240px;z-index:20;\n   background:var(--ink);color:#fff;font-size:12px;font-weight:400;line-height:1.5;\n   padding:8px 10px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.18);\n   opacity:0;visibility:hidden;transition:.15s}\n .tip:hover .tipbox,.tip:focus .tipbox{opacity:1;visibility:visible}\n /* 部件:行动可勾选 checklist */\n .act .chk{display:none}\n .act .chk+label.idx{cursor:pointer}\n .act .chk:checked+label.idx{background:#059669;border-color:#059669;color:#fff}\n .act .chk:checked+label.idx::after{content:\"✓\"}\n .act .chk:checked ~ div h3{color:var(--muted);text-decoration:line-through}\n /* 部件:复制钮 */\n .copybtn{border:none;background:#EEF2FB;color:var(--blue);border-radius:6px;cursor:pointer;\n   font-size:12px;padding:1px 7px;margin-left:8px;vertical-align:middle}\n .copybtn:hover{background:var(--blue);color:#fff} .copybtn.done{background:#059669;color:#fff}\n<\/style><meta name=\"x-metaform\" content=\"scenario=account-diagnosis;format=html;template=-;renderer=render_contract;cver=1.1;base_sha=8de920684c41;v=1\">\n<\/head><body><div class=\"page\">\n<div class=\"navbar\"><span class=\"nv-grade\">D<\/span><span class=\"nv-name\">北川魔芋姐｜赵娟<\/span><a href=\"#sec-actions\" class=\"nv-jump\">↓ 跳到行动<\/a><\/div>\n<div class=\"masthead\"><div class=\"kicker\">元数据诊断 · 账号诊断报告<\/div>\n<h1>北川魔芋姐｜赵娟<\/h1>\n<div class=\"sub\">抖音 · S档 · 价值阶梯诊断 · 4654 粉<\/div><\/div>\n<div class=\"verdict\"><div class=\"grade\">D<small>商业评级 · 健康 39<\/small><\/div><div class=\"tag\">4654粉 · 该玩线索游戏，不玩流量游戏。<\/div><div class=\"spine\"><b>补私域承接·把咨询变线索<\/b>——S档·垂直B端/知识付费·4654粉已过 B 端变现门槛(几千精准粉即可)·评论咨询率高(潜在线索金矿)·但商业密度 0=有咨询没承接·该补私域钩子/橱窗把评论咨询导成线索·而非盲目追播放量。B 端玩线索游戏不玩流量游戏(出处 CM §二层A)。<\/div><\/div><div class=\"pad\">\n<section><div class=\"eyebrow\"><span class=\"n\">1<\/span><h2>你现在的处境<\/h2><\/div><p class=\"lead\">你在运营链条「建信任 → 产线索 → 促成交 → 促复购 → 矩阵复利」的【起号·建信任】（产线索），已走过 冷启·打标签，接下来 初变现、成长。<\/p><p>这一站的专业方向：把专业人设立起来·让刷到的人信你——信任是B端的硬通货。你在【起号·建信任】·距【初变现】还差:粉丝量级:4654→1万(还差 534 text><text x=\"124\" y=\"218\" font-size=\"9\" fill=\"#6B7280\" font-weight=\"700\" text-anchor=\"middle\">45<\/text><text x=\"63\" y=\"182\" font-size=\"9.5\" fill=\"#6B7280\" font-weight=\"400\" text-anchor=\"end\">破圈<\/text><text x=\"63\" y=\"193\" font-size=\"9\" fill=\"#6B7280\" font-weight=\"700\" text-anchor=\"end\">30<\/text><text x=\"38\" y=\"121\" font-size=\"9.5\" fill=\"#6B7280\" font-weight=\"400\" text-anchor=\"end\">评级<\/text><text x=\"38\" y=\"132\" font-size=\"9\" fill=\"#6B7280\" font-weight=\"700\" text-anchor=\"end\">30<\/text><text x=\"63\" y=\"60\" font-size=\"9.5\" fill=\"#6B7280\" font-weight=\"400\" text-anchor=\"end\">私域<\/text><text x=\"63\" y=\"71\" font-size=\"9\" fill=\"#6B7280\" font-weight=\"700\" text-anchor=\"end\">14<\/text><text x=\"124\" y=\"244\" font-size=\"8.5\" fill=\"#9CA3AF\" text-anchor=\"middle\">实线=你 · 橙虚线=行业基准 · 红▼=最该补的短板<\/text><\/svg><\/div><div style='font-weight:700;color:#1E3A8A;margin:14px 0 5px;font-size:14px'>八维深度详解（按分升序 · 先补短板 · 每维:逻辑链 + 多方法 + 专业知识方向）<\/div><div style='font-size:11px;color:#9CA3AF;margin-bottom:4px'>弱/中项默认展开·点标题可折叠·强项已收起<\/div><details open style='border:1px solid #E5E7EB;border-radius:8px;margin:7px 0'><summary style='cursor:pointer;padding:8px 12px;font-size:13px'><b>商业转化<\/b><span style='color:#DC2626;font-weight:700;margin-left:8px'>3分·弱<\/span><span style='color:#9CA3AF;font-size:11px;margin-left:8px'>低于行业基准 37 分·基准40<\/span><span style='color:#D97706;font-size:11px;margin-left:8px'>⚡B端先补私域承接装置(主页+评论区钩子)·把已有咨询接住<\/span><\/summary><div style='padding:2px 14px 11px'><div style='color:#9CA3AF;font-size:11px;margin-bottom:5px'>把流量变成钱的能力｜算法:带货指数30% + 转化指数25% + 商业密度20% + 橱窗/直播15% + 消费力10%<\/div><div style='font-size:12px;color:#374151;margin-bottom:6px'><b style='color:#1E3A8A'>逻辑<\/b>:转化是『流量→收入』最后一公里·多数账号死在这。逻辑链:有流量→有承接装置→有信任→有转化路径→成交·任一环断=转化为零。B端承接=私域钩子;C端承接=橱窗/直播。改善先补最断那环(通常是承接装置·而非加流量——给漏桶加水没用)。<\/div><div style='font-size:12px;color:#1E3A8A;font-weight:700'>方法（快赢→深做）<\/div><ol style='font-size:12px;color:#374151;margin:3px 0 6px;padding-left:20px'><li>建承接装置:B端主页+评论区私域钩子;C端开橱窗/挂车<\/li><li>内容植入转化点:每条留一个『下一步』·别只曝光不引导<\/li><li>私域成交SOP:黄金2h响应·话术标准化·意向分层跟进<\/li><li>选品/定价测试:小批量测·找高转化品与价格带<\/li><li>复购机制:老客召回+转介绍激励(老客获客成本最低)<\/li><\/ol><div style='font-size:11px;color:#6B7280'><b style='color:#1E3A8A'>专业知识方向<\/b>:转化漏斗模型 · 客单价/复购/LTV · 私域成交SOP · 直播/橱窗运营 · 选品与定价方法论<\/div><\/div><\/details><details open style='border:1px solid #E5E7EB;border-radius:8px;margin:7px 0'><summary style='cursor:pointer;padding:8px 12px;font-size:13px'><b>私域<\/b><span style='color:#DC2626;font-weight:700;margin-left:8px'>14分·弱<\/span><span style='color:#9CA3AF;font-size:11px;margin-left:8px'>低于行业基准 21 分·基准35<\/span><span style='color:#D97706;font-size:11px;margin-left:8px'>⚡今天就把主页签名+评论区置顶挂上私域钩子(零成本)<\/span><\/summary><div style='padding:2px 14px 11px'><div style='color:#9CA3AF;font-size:11px;margin-bottom:5px'>私域变现成熟度·线索接得住吗｜算法:私域意图词密度 + 承接装置(主页钩子/微信/橱窗)<\/div><div style='font-size:12px;color:#374151;margin-bottom:6px'><b style='color:#1E3A8A'>逻辑<\/b>:私域是B端账号的生死线·有咨询没承接=每天在漏钱。逻辑链:公域产线索→私域接线索→私域促成交→私域促复购。私域成熟度=意图密度(有没有线索)×承接装置(接不接得住)×运营SOP(转不转得化)。改善从『承接装置』起——零成本、当天可上、先把漏的接住。<\/div><div style='font-size:12px;color:#1E3A8A;font-weight:700'>方法（快赢→深做）<\/div><ol style='font-size:12px;color:#374151;margin:3px 0 6px;padding-left:20px'><li>主页签名+评论区置顶挂私域钩子(当天可做·零成本·先止漏)<\/li><li>评论区引导加微信:黄金2h响应·线索有时效·过夜就凉<\/li><li>私域分层运营:按意向分级·高意向重点跟·SOP化<\/li><li>建承接SOP:从加微→成交的标准话术与节奏<\/li><li>私域复购/转介绍:老客是最便宜的增长杠杆<\/li><\/ol><div style='font-size:11px;color:#6B7280'><b style='color:#1E3A8A'>专业知识方向<\/b>:私域流量运营 · SCRM/分层运营 · 黄金响应时效 · 成交话术体系 · 公私域联动<\/div><\/div><\/details><details open style='border:1px solid #E5E7EB;border-radius:8px;margin:7px 0'><summary style='cursor:pointer;padding:8px 12px;font-size:13px'><b>破圈<\/b><span style='color:#DC2626;font-weight:700;margin-left:8px'>30分·弱<\/span><span style='color:#9CA3AF;font-size:11px;margin-left:8px'>低于行业基准 20 分·基准50<\/span><span style='color:#D97706;font-size:11px;margin-left:8px'>⚡做1条'垂直内核+泛化钩子'的可转发选题试破圈<\/span><\/summary><div style='padding:2px 14px 11px'><div style='color:#9CA3AF;font-size:11px;margin-bottom:5px'>能不能突破现有粉丝圈层｜算法:粉丝画像 vs 受众画像的距离(差距大=正在破圈)<\/div><div style='font-size:12px;color:#374151;margin-bottom:6px'><b style='color:#1E3A8A'>逻辑<\/b>:破圈决定增长上限·不破圈=粉丝见顶在现有圈层。破圈=粉丝画像与受众画像产生距离(内容触达了圈外人)。机制:垂直内核保证不掉粉·泛化钩子吸引圈外·可转发结构实现跨圈扩散(转发=社交货币)。<\/div><div style='font-size:12px;color:#1E3A8A;font-weight:700'>方法（快赢→深做）<\/div><ol style='font-size:12px;color:#374151;margin:3px 0 6px;padding-left:20px'><li>垂直内核+泛化钩子:内核守专业·钩子做大众情绪/话题<\/li><li>蹭赛道相关热点:借势破圈·但别脱离垂直人设<\/li><li>做转发型内容:实用清单/情绪共鸣·观众愿转给别人=跨圈<\/li><li>跨界联动:与相邻赛道创作者互推·借对方圈层<\/li><\/ol><div style='font-size:11px;color:#6B7280'><b style='color:#1E3A8A'>专业知识方向<\/b>:圈层传播模型 · 受众画像vs粉丝画像 · 传播学(社交货币/转发动机) · 热点借势方法论<\/div><\/div><\/details><details open style='border:1px solid #E5E7EB;border-radius:8px;margin:7px 0'><summary style='cursor:pointer;padding:8px 12px;font-size:13px'><b>评级<\/b><span style='color:#DC2626;font-weight:700;margin-left:8px'>30分·弱<\/span><span style='color:#9CA3AF;font-size:11px;margin-left:8px'>低于行业基准 20 分·基准50<\/span><span style='color:#D97706;font-size:11px;margin-left:8px'>⚡优先补转化与带货两项(评级低的主因)<\/span><\/summary><div style='padding:2px 14px 11px'><div style='color:#9CA3AF;font-size:11px;margin-bottom:5px'>综合商业价值评级 A-F｜算法:6商业指数(合作/性价比/转化/带货/传播/明星)综合<\/div><div style='font-size:12px;color:#374151;margin-bottom:6px'><b style='color:#1E3A8A'>逻辑<\/b>:评级是『对外报价/接商单的底牌』·品牌方看评级决定合作与否、报价高低。评级=6商业指数综合·短板拖累整体。评级低多因商业基础未建(转化/带货是空白)·补齐商业维度评级自然上来。<\/div><div style='font-size:12px;color:#1E3A8A;font-weight:700'>方法（快赢→深做）<\/div><ol style='font-size:12px;color:#374151;margin:3px 0 6px;padding-left:20px'><li>优先补转化与带货:这两项是评级最大拖累<\/li><li>积累商业案例:接过的商单/带货数据=谈判筹码<\/li><li>完善商业资料:主页/星图资料专业化·提升合作意愿<\/li><li>拉高性价比指数:量级内做高互动·性价比是中小账号的武器<\/li><\/ol><div style='font-size:11px;color:#6B7280'><b style='color:#1E3A8A'>专业知识方向<\/b>:达人商业价值评估体系 · 星图/蒲公英评级规则 · 商单报价逻辑 · CPM/CPE定价<\/div><\/div><\/details><details open style='border:1px solid #E5E7EB;border-radius:8px;margin:7px 0'><summary style='cursor:pointer;padding:8px 12px;font-size:13px'><b>健康<\/b><span style='color:#DC2626;font-weight:700;margin-left:8px'>39分·弱<\/span><span style='color:#9CA3AF;font-size:11px;margin-left:8px'>低于行业基准 21 分·基准60<\/span><span style='color:#D97706;font-size:11px;margin-left:8px'>⚡稳住发布节奏(断更是健康分头号杀手)<\/span><\/summary><div style='padding:2px 14px 11px'><div style='color:#9CA3AF;font-size:11px;margin-bottom:5px'>账号综合健康分(0-100)·算法给不给量的体检｜算法:互动质量30% + 粉丝净增 + 更新节奏 + 内容趋势 + 合集化<\/div><div style='font-size:12px;color:#374151;margin-bottom:6px'><b style='color:#1E3A8A'>逻辑<\/b>:健康分=算法对你的『信用评级』·决定每条新内容的初始推荐池大小。算法偏好『可预测的创作者』——稳定=可预测=敢给量;断更/忽冷忽热=不可预测=降权观察。改善路径:先止血(停断更)→再积累(稳节奏+互动率)→后沉淀(合集化让算法读懂你的内容体系)。<\/div><div style='font-size:12px;color:#1E3A8A;font-weight:700'>方法（快赢→深做）<\/div><ol style='font-size:12px;color:#374151;margin:3px 0 6px;padding-left:20px'><li>固定发布节奏:每周固定日固定时段·让算法学会你的更新规律<\/li><li>止断更:断更>7天健康分断崖式跌·宁可降质也别停更<\/li><li>提互动率:评论区主动抛问题+置顶引导讨论(互动率是健康分核心权重)<\/li><li>合集化:零散内容编成系列·算法理解=给更精准流量<\/li><li>控质量方差:稳定中上 > 偶尔爆款+长期冷·忽爆忽冷让算法困惑<\/li><\/ol><div style='font-size:11px;color:#6B7280'><b style='color:#1E3A8A'>专业知识方向<\/b>:平台推荐算法权重模型(初始推荐池/赛马机制/权重衰减曲线) · 账号标签体系 · 更新节奏与权重关系<\/div><\/div><\/details><details open style='border:1px solid #E5E7EB;border-radius:8px;margin:7px 0'><summary style='cursor:pointer;padding:8px 12px;font-size:13px'><b>内容力<\/b><span style='color:#DC2626;font-weight:700;margin-left:8px'>42分·弱<\/span><span style='color:#9CA3AF;font-size:11px;margin-left:8px'>低于行业基准 13 分·基准55<\/span><span style='color:#D97706;font-size:11px;margin-left:8px'>⚡拆解自己最高赞那条的结构·复刻钩子与节奏<\/span><\/summary><div style='padding:2px 14px 11px'><div style='color:#9CA3AF;font-size:11px;margin-bottom:5px'>内容本身的竞争力｜算法:爆款产出率 + 互动趋势 + 话题质量(垂直度) + 竞品差距<\/div><div style='font-size:12px;color:#374151;margin-bottom:6px'><b style='color:#1E3A8A'>逻辑<\/b>:内容力是唯一可持续的流量源·投放只放大不创造(放大烂内容=加速死亡)。内容力=选题(定天花板)×钩子(定完播)×节奏(定留存)×差异化(定记忆)。完播率是算法黑盒里最重的权重·而完播由前3秒钩子决定。改善从『复刻自己已验证的爆款结构』起步(比抄别人靠谱)。<\/div><div style='font-size:12px;color:#1E3A8A;font-weight:700'>方法（快赢→深做）<\/div><ol style='font-size:12px;color:#374151;margin:3px 0 6px;padding-left:20px'><li>拆解自己最高赞那条:钩子/节奏/选题·复刻其结构<\/li><li>强前3秒钩子:悬念/利益/反差三选一·钩子定完播·完播定推荐<\/li><li>选题对标:扒赛道头部近30天爆款·学选题角度(非抄内容)<\/li><li>守垂直:算法标签靠垂直度建立·杂=没标签=没精准流量<\/li><li>内容系列化:固定栏目降低观众认知成本·提升粉丝粘性<\/li><\/ol><div style='font-size:11px;color:#6B7280'><b style='color:#1E3A8A'>专业知识方向<\/b>:选题方法论(痛点/爽点/争议点) · 钩子结构(悬念/利益/反差) · 完播率工程 · 脚本结构(黄金3秒/起承转合)<\/div><\/div><\/details><details open style='border:1px solid #E5E7EB;border-radius:8px;margin:7px 0'><summary style='cursor:pointer;padding:8px 12px;font-size:13px'><b>赛道<\/b><span style='color:#D97706;font-weight:700;margin-left:8px'>45分·中<\/span><span style='color:#9CA3AF;font-size:11px;margin-left:8px'>低于行业基准 5 分·基准50<\/span><span style='color:#D97706;font-size:11px;margin-left:8px'>⚡找一个细分长尾定位卡住·别在红海正面刚<\/span><\/summary><div style='padding:2px 14px 11px'><div style='color:#9CA3AF;font-size:11px;margin-bottom:5px'>你这条赛道的拥挤度/蓝海度｜算法:搜索结果海量度(竞争密度代理)<\/div><div style='font-size:12px;color:#374151;margin-bottom:6px'><b style='color:#1E3A8A'>逻辑<\/b>:赛道决定增长的『难度系数』·选错赛道再努力都事倍功半。红海(供给过剩)要么细分长尾、要么强差异化;蓝海(供给不足)则内容供给本身就是机会·加速卡位抢心智。判断依据:赛道搜索结果密度 + 头部集中度。错位竞争 > 正面刚头部。<\/div><div style='font-size:12px;color:#1E3A8A;font-weight:700'>方法（快赢→深做）<\/div><ol style='font-size:12px;color:#374151;margin:3px 0 6px;padding-left:20px'><li>细分定位:红海里切一个长尾·做『小池塘的大鱼』<\/li><li>强差异化:同选题·你的角度/人设/呈现要有记忆点<\/li><li>蓝海加速:供给不足就提频卡位·先占心智<\/li><li>错位竞争:避开头部正面战场·找他们没覆盖的需求缝隙<\/li><\/ol><div style='font-size:11px;color:#6B7280'><b style='color:#1E3A8A'>专业知识方向<\/b>:赛道竞争分析 · 蓝海/红海判断(供需比) · 细分市场定位 · 差异化战略(波特三战略)<\/div><\/div><\/details><details open style='border:1px solid #E5E7EB;border-radius:8px;margin:7px 0'><summary style='cursor:pointer;padding:8px 12px;font-size:13px'><b>粉丝质量<\/b><span style='color:#DC2626;font-weight:700;margin-left:8px'>47分·弱<\/span><span style='color:#9CA3AF;font-size:11px;margin-left:8px'>低于行业基准 23 分·基准70<\/span><span style='color:#D97706;font-size:11px;margin-left:8px'>⚡停止任何刷量·让真实评论自然沉淀<\/span><\/summary><div style='padding:2px 14px 11px'><div style='color:#9CA3AF;font-size:11px;margin-bottom:5px'>粉丝真实度·有没有水分｜算法:水军风险(IP集中/digg异常) + 评论真实性 + 地域多元度<\/div><div style='font-size:12px;color:#374151;margin-bottom:6px'><b style='color:#1E3A8A'>逻辑<\/b>:粉丝质量决定『粉丝资产能不能变现』。水军粉=数字资产但零购买力·还反噬——僵尸不互动会拉低互动率→拖累健康分→推荐更少。真实粉的标志:地域多元、互动自然、digg分布无异常聚集。改善=做真实信任内容自然吸引精准粉·而非买量(买量是负资产)。<\/div><div style='font-size:12px;color:#1E3A8A;font-weight:700'>方法（快赢→深做）<\/div><ol style='font-size:12px;color:#374151;margin:3px 0 6px;padding-left:20px'><li>彻底停任何刷量/互赞(水军评论拉低质量分·得不偿失)<\/li><li>内容引真实评论:问答型/争议型选题激发自发讨论<\/li><li>精准选题吸精准粉:B端1000个对的客户 > 10万泛粉<\/li><li>历史若买过量:靠持续真实内容稀释·时间会修复<\/li><\/ol><div style='font-size:11px;color:#6B7280'><b style='color:#1E3A8A'>专业知识方向<\/b>:粉丝画像分析 · 水军识别(IP集中度/digg异常/注册时间聚集) · 粉丝LTV与精准度模型<\/div><\/div><\/details><div style='font-size:11px;color:#9CA3AF;margin-bottom:4px'>行业基准为经验值·待 50–100 真实账号建分位基线后校准 · 方法/知识方向出自短视频运营方法论(CAT/PB/CM/OPS)<\/div><div style='font-weight:700;color:#1E3A8A;margin:14px 0 5px;font-size:14px'>内容归因 · 因子驱动力（组间落差倍数）<\/div><svg width=\"280\" height=\"44\" viewBox=\"0 0 280 44\" style=\"max-width:100%\"><text x=\"0\" y=\"13\" font-size=\"11\" fill=\"#374151\">发布时段<\/text><rect x=\"86\" y=\"0\" width=\"150\" height=\"16\" rx=\"3\" fill=\"#0891B2\"/><text x=\"240\" y=\"13\" font-size=\"10\" fill=\"#6B7280\">1.75<\/text><text x=\"0\" y=\"35\" font-size=\"11\" fill=\"#374151\">时长<\/text><rect x=\"86\" y=\"22\" width=\"149\" height=\"16\" rx=\"3\" fill=\"#0891B2\"/><text x=\"239\" y=\"35\" font-size=\"10\" fill=\"#6B7280\">1.74<\/text><\/svg><div style='font-size:12px;color:#374151'>组间落差(倍数)= 该因子下「最好取值组的均互动」÷「最差取值组的均互动」。≥1.5x = 这个因子真在驱动你的互动差异·优先调它;<1.5x = 影响不大。<\/div><ul style='font-size:12px;color:#374151'><li><b>发布时段<\/b>（落差 1.75x）：不同时段受众活跃度不同。组间落差=这个时段对你互动的影响倍数·越大越该挑时段发。<\/li><li <span class=\"n\">2<\/span><h2>最该解决的一件事<\/h2><\/div><p class=\"lead\">流量在帮你敲门，你却没有开门——这是 D 评级的真正主因。<\/p><div class=\"keyissue\"><div class=\"flow\"><span class=\"node\">评论咨询率极高<\/span><span class=\"arr\">→<\/span><span class=\"node bad\">商业密度 0%<\/span><span class=\"arr\">→<\/span><span class=\"node bad\">零承接动作<\/span><\/div><p class=\"muted\" style=\"margin:10px 0 0\">评论赞比 0.235，远超行业「强讨论」线 0.15——对 B 端意味着大量潜在咨询线索。但你没有橱窗、没有私域钩子、没有任何把咨询接住的动作。<\/p><div class=\"punch\">不是「不该变现」，是「已过门槛却没做承接」。线索每天在漏。<\/div><\/div><\/section>\n<section><div class=\"eyebrow\"><span class=\"n\">3<\/span><h2>支撑这个判断的证据<\/h2><\/div><div class=\"evidence\"><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">评论赞比<span class=\"tipbox\">单条评论数 ÷ 点赞数,衡量讨论强度。≥0.15 即强讨论;对 B 端意味潜在咨询线索。<\/span><\/span><small>讨论 / 咨询强度<\/small><\/div><div class=\"val\">0.235 · 强讨论<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">商业密度<span class=\"tipbox\">带货 / 商业内容占全部内容的比例。0% = 完全没做变现动作。<\/span><\/span><small>变现动作占比<\/small><\/div><div class=\"val warn\">0%<\/div><\/div><div class=\"e\"><div class=\"lab\">橱窗 / 私域钩子<small>承接渠道<\/small><\/div><div class=\"val warn\">无<\/div><\/div><div class=\"e\"><div class=\"lab\">已验证爆款主题<small>最高赞 383<\/small><\/div><div class=\"val\">魔芋工厂 / 源头<\/div><\/div><div class=\"e\"><div class=\"lab\"><span class=\"tip\" tabindex=\"0\">赞粉比<span class=\"tipbox\">点赞数 ÷ 粉丝数,粗略代理粉丝质量。≥2% 健康,≥5% 强。<\/span><\/span><small>粉丝质量代理<\/small><\/div><div class=\"val\">2.25% · 健康<\/div><\/div><\/div><\/section>\n<section id=\"sec-actions\"><div class=\"eyebrow\"><span class=\"n\">4<\/span><h2>本周做这几件事<\/h2><\/div><div class=\"act p1\"><input type=\"checkbox\" class=\"chk\" id=\"a4_0\"><label for=\"a4_0\" class=\"idx\"><\/label><div><h3>主页挂私域钩子，把评论咨询导成微信线索<\/h3><div class=\"why\">当前 ROI 最高的一步——你已有线索流量，只缺一个接住它的入口。<\/div><\/div><span class=\"tag first\">最高优先<\/span><\/div><div class=\"act \"><input type=\"checkbox\" class=\"chk\" id=\"a4_1\"><label for=\"a4_1\" class=\"idx\"><\/label><div><h3>下条：晚 18–22 发 · 延续「安福魔芋 / 工厂 / 源头」· 控 60–90s<\/h3><div class=\"why\">晚间档实测平均互动 192，比最差时段高 1.7 倍；爆款共性已验证。<\/div><\/div><span class=\"tag next\">次<\/span><\/div><div class=\"act \"><input type=\"checkbox\" class=\"chk\" id=\"a4_2\"><label for=\"a4_2\" class=\"idx\"><\/label><div><h3>暂不挂车带货<\/h3><div class=\"why\">当前流量基础下，先把单条互动和私域承接做起来，带货等起量后效率更高。<\/div><\/div><span class=\"tag hold\">暂缓<\/span><\/div><\/section>\n<div class=\"scope\"><b>本次诊断的边界。<\/b>未开通星图，所以这几项&lt;b&gt;拿不到、未纳入评分&lt;/b&gt;：官方报价、粉丝画像（消费力）、真实带货指数 / 转化指数。报告中标注「估算」的项（如按均播 105 估算的参考报价约 1 元）在开通星图后会更准。<\/div>\n<section><div class=\"eyebrow\"><span class=\"n\">·<\/span><h2>算账<\/h2><\/div><table><tr><th>项<\/th><th>值<\/th><\/tr><tr><td>本次诊断成本<\/td><td>¥0.051（首次 · 无星图基础诊断）<\/td><\/tr><tr><td>等效替代<\/td><td>手动分析约 4 小时 / 外包报价 ¥500–2000<\/td><\/tr><\/table><p class=\"muted\" style=\"font-size:12.5px\">第一次买的是「账号体检基线」；从第二次起每次约 ¥0.1，买的是「我在进步还是退步 / 这条该不该追」的确定答案。<\/p><\/section>\n<details class=\"appendix\"><summary>展开完整四层数据（环境 / 行业 / 账号 / 单条）<\/summary><table><tr><th>账号层指标<\/th><th>分<\/th><th>说明<\/th><\/tr><tr><td>综合健康<\/td><td>39<\/td><td>衰退<\/td><\/tr><tr><td>商业转化<\/td><td>3<\/td><td>私域先行 · 零承接<\/td><\/tr><tr><td>私域成熟<\/td><td>14<\/td><td>最该补<\/td><\/tr><tr><td>变现机会<\/td><td>50<\/td><td>潜力中等<\/td><\/tr><\/table><p class='muted' style='font-size:12.5px'>单条：均赞 105 / 最高赞 383（爆款率 3.6）· 最优时段晚 18–22 · 高效话题 #餐饮食材。环境：热点契合仅 15，按「标签内蹭」不建议硬蹭泛热点。<\/p><\/details>\n<footer>元板 MetaBoard · 数据源合规授权 · 国内不出境 · 生成于 2026-06-28 14:32（北京时间）<\/footer><\/div><\/body><\/html>","report-content-topic-beichuan-moyu-20260628":"<!DOCTYPE html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>北川魔芋姐｜赵娟 · 元板 · 内容选题报告<\/title>\n<style>\n :root{--ink:#1F2937;--blue:#1E3A8A;--orange:#FF7A1A;--muted:#6B7280;\n   --line:#E8EBF0;--soft:#F7F8FA;}\n *{box-sizing:border-box} html{-webkit-font-smoothing:antialiased}\n body{margin:0;background:#EEF1 <script>
/* ============================================================

   ============================================================ */
const PLATFORM_CONFIG = {
  douyin:      { label: '抖音',  emoji: '🎵', cls: 'douyin' },
  kuaishou:    { label: '快手',  emoji: '⚡', cls: 'kuaishou' },

/* ============================================================
   工具函数
   ============================================================ */
function fmtNum(n) {
  if (n == null) return '—';
  n = Number(n);
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return n.toLocaleString('zh-CN');
}
const fmtFollowers = fmtNum;

function fmtDate(s) {
  if (!s) return '—';
  return s.slice(0, 10);
}

function fmtDateTime(s) {
  if (!s) return '—';
  return s.slice(0, 19).replace('T', ' ');
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function highlight(text, q) {
  if (!q || !text) return escHtml(text || '');
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escHtml(text).replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
}

const TYPE_COLORS = {
  'B2B':    { bg: '#FFF3E0', color: '#E65100' },
  '带货':   { bg: '#E8F5E9', color: '#2E7D32' },
  '知识':   { bg: '#E3F2FD', color: '#1565C0' },
  '健康':   { bg: '#E8F5E9', color: '#2E7D32' },
  '本地':   { bg: '#FCE4EC', color: '#880E4F' },
  '颜值':   { bg: '#F3E5F5', color: '#6A1B9A' },
  '美食':   { bg: '#FFF8E1', color: '#F57F17' },
  '科技':   { bg: '#E0F2F1', color: '#00695C' },
  '教育':   { bg: '#E8EAF6', color: '#283593' },
  '默认':   { bg: '#F1F5F9', color: '#475569' },
};

function getTypeBadgeStyle(accountType) {
  if (!accountType) return TYPE_COLORS['默认'];
  for (const key of Object.keys(TYPE_COLORS)) {
    if (key !== '默认' && accountType.includes(key)) return TYPE_COLORS[key];
  }
  return TYPE_COLORS['默认'];
}

function polishStatus(polish) {
  if (!polish) return { icon: '📝', label: '润色未知', cls: '' };
  if (polish.ok) {
    if (polish.segs_ok >= polish.segs_total) return { icon: '📝', label: '润色✅', cls: 'ok' };
    return { icon: '📝', label: '润色⚠️', cls: 'warn' };
  }
  return { icon: '📝', label: '润色❌', cls: 'fail' };
}

function addDays(dateStr, days) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  if (isNaN(d)) return '—';
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

/* ============================================================
   Markdown 渲染（零依赖）
   ============================================================ */
function renderMarkdown(text) {
  if (!text) return '<p class="no-report">暂无报告全文。</p>';
  const lines = text.split('\n');
  const out = [];
  let inUl = false, inOl = false, inTable = false, tableHead = false;

  function closeAll() {
    if (inUl)    { out.push('</ul>'); inUl = false; }
    if (inOl)    { out.push('</ol>'); inOl = false; }
    if (inTable) { out.push('</tbody></table>'); inTable = false; tableHead = false; }
  }

  function inlineMd(s) {
    let r = String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    r = r
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
    return r;
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^# /.test(line))   { closeAll(); out.push(`<h2>${inlineMd(line.slice(2))}</h2>`); }
    else if (/^## /.test(line))  { closeAll(); out.push(`<h3>${inlineMd(line.slice(3))}</h3>`); }
    else if (/^### /.test(line)) { closeAll(); out.push(`<h4>${inlineMd(line.slice(4))}</h4>`); }
    else if (/^---+$/.test(line.trim())) { closeAll(); out.push('<hr>'); }
    else if (/^\|/.test(line)) {
      const cells = line.split('|').slice(1,-1).map(c => c.trim());
      if (cells.every(c => /^[-:]+$/.test(c))) { /* skip separator */ }
      else if (!inTable) {
        closeAll();
        out.push('<table><thead><tr>');
        cells.forEach(c => out.push(`<th>${inlineMd(c)}</th>`));
        out.push('</tr></thead><tbody>');
        inTable = true; tableHead = true;
      } else {
        out.push('<tr>');
        cells.forEach(c => out.push(`<td>${inlineMd(c)}</td>`));
        out.push('</tr>');
      }
    }
    else if (/^> /.test(line)) { closeAll(); out.push(`<blockquote>${inlineMd(line.slice(2))}</blockquote>`); }
    else if (/^[-*] /.test(line)) {
      if (inTable) { out.push('</tbody></table>'); inTable = false; }
      if (inOl) { out.push('</ol>'); inOl = false; }
      if (!inUl) { out.push('<ul>'); inUl = true; }
      out.push(`<li>${inlineMd(line.slice(2))}</li>`);
    }
    else if (/^\d+\. /.test(line)) {
      if (inTable) { out.push('</tbody></table>'); inTable = false; }
      if (inUl) { out.push('</ul>'); inUl = false; }
      if (!inOl) { out.push('<ol>'); inOl = true; }
      out.push(`<li>${inlineMd(line.replace(/^\d+\. /,''))}</li>`);
    }
    else if (line.trim() === '') { closeAll(); }
    else { closeAll(); out.push(`<p>${inlineMd(line)}</p>`); }
  }
  closeAll();
  return out.join('\n');
}

let allCases      = [];

/* ============================================================

   ============================================================ */
function readUrlParams() {
  const p = new URLSearchParams(location.search);
  activePlatform = p.get('platform') || '';
  activeType     = p.get('type') || '';
  const q = p.get('q') || '';
  if (q) document.getElementById('search-input').value = q;
}

function pushUrlParams() {
  const q = document.getElementById('search-input').value.trim();
  const params = new URLSearchParams();
  if (activePlatform) params.set('platform', activePlatform);
  if (activeType)     params.set('type', activeType);
  if (q)              params.set('q', q);
  if (currentCase)    params.set('case', currentCase.run_id);
  const str = params.toString();
  history.replaceState(null, '', str ? location.pathname + '?' + str : location.pathname);
}

/* ============================================================
   数据加载
   ============================================================ */
async function loadData() {
  let data = null, mode = '';

  try {
    const res = await fetch('../data/cases/index.json', { cache: 'no-store' });
    if (res.ok) { data = await res.json(); mode = 'Server'; isServerMode = true; }
  } catch (_) {}

  if (!data) {
    try {
      const el = document.getElementById('embedded-data');
      data = JSON.parse(el.textContent.trim());
      mode = 'File'; isServerMode = false;
    } catch (_) {
      data = { version: '1.1', updated_at: '', cases: [] };
      mode = 'File';
    }
  }

  allCases = data.cases || [];
  readUrlParams();
  renderAll();
  updateDataStatus(mode, data.updated_at);

  // file:// 模式：检查内嵌报告覆盖度，漏内嵌时提醒重跑 build_embed
  if (!isServerMode && allCases.length) {
    const missing = allCases.filter(c => !getEmbeddedReport(c.run_id));
    if (missing.length) {
      console.warn(`[元探] ${missing.length} 个案例报告未内嵌：` +
        missing.map(c => c.run_id).join(', ') + ' — 请运行 python3 hub/build_embed.py');
      const line = document.getElementById('data-updated-line');
      if (line) line.innerHTML += `<div style="margin-top:4px;color:var(--orange);font-size:10px;font-weight:600">⚠️ ${missing.length} 份报告未内嵌 · 请跑 build_embed.py</div>`;
    }
  }

  const sp = new URLSearchParams(location.search);
  const caseId = sp.get('case');
  if (caseId) {
    const found = allCases.find(c => c.run_id === caseId);
    if (found) enterReadMode(found);
  }
}

function updateDataStatus(mode, updatedAt) {
  document.getElementById('data-mode-line').innerHTML =
    `<span class="mode-badge">${mode}</span> ${allCases.length} 条案例已加载`;
  document.getElementById('data-updated-line').textContent =
    updatedAt ? '更新：' + updatedAt.slice(0,16).replace('T',' ') : '';
}

function buildPlatformChips() {
  const row = document.getElementById('platform-row');
  [...row.querySelectorAll('.chip[data-platform]:not([data-platform=""])')].forEach(el => el.remove());
  const counts = {};
  allCases.forEach(c => { const p = c.platform || ''; if (p) counts[p] = (counts[p] || 0) + 1; });
  Object.entries(counts).forEach(([p, n]) => {
    const cfg = PLATFORM_CONFIG[p] || { label: p, emoji: '📱', cls: 'default' };
    const div = document.createElement('div');
    div.className = 'chip' + (activePlatform === p ? ' active' : '');
    div.dataset.platform = p;
    div.innerHTML = `${cfg.emoji} ${escHtml(cfg.label)} <span class="chip-count">${n}</span>`;
    row.appendChild(div);
  });
  row.querySelector('[data-platform=""]').classList.toggle('active', activePlatform === '');
}

function buildTypeChips() {
  const row = document.getElementById('type-row');
  [...row.querySelectorAll('.chip[data-type]:not([data-type=""])')].forEach(el => el.remove());
  const base = activePlatform ? allCases.filter(c => (c.platform || '') === activePlatform) : allCases;
  const counts = {};
  base.forEach(c => { const t = c.account_type || ''; if (t) counts[t] = (counts[t] || 0) + 1; });
  Object.entries(counts).sort((a,b) => b[1]-a[1]).forEach(([t, n]) => {
    const div = document.createElement('div');
    div.className = 'chip' + (activeType === t ? ' active' : '');
    div.dataset.type = t;
    div.innerHTML = `${escHtml(t)} <span class="chip-count">${n}</span>`;
    row.appendChild(div);
  });
  row.querySelector('[data-type=""]').classList.toggle('active', activeType === '');
}

function buildVersionOptions() {
  const sel = document.getElementById('version-select');
  const versions = [...new Set(allCases.map(c => c.probe_version).filter(Boolean))].sort().reverse();
  const current = sel.value;
  sel.innerHTML = '<option value="">全部版本</option>';
  versions.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v.length > 15 ? v.slice(0,15) + '…' : v;
    sel.appendChild(opt);
  });
  sel.value = current;
}

function updateStats() {
  document.getElementById('stat-total').textContent = allCases.length;
  const accounts = new Set(allCases.map(c => c.sec_uid || c.account_name)).size;
  document.getElementById('stat-accounts').textContent = accounts;
  const passed = allCases.filter(c => c.validation_pass).length;
  const rate = allCases.length ? Math.round(passed / allCases.length * 100) + '%' : '—';
  document.getElementById('stat-pass-rate').textContent = rate;
}

/* ── 账号 / 视频锚点（同账号多视频 / 同视频多版本 的判定）── */
function acctKey(c) { return c.sec_uid || ('name:' + (c.account_name || '')); }
function vidKey(c)  { return c.aweme_id ? ('aw:' + c.aweme_id) : ('run:' + c.run_id); }
function sameAccount(a, b) { return acctKey(a) === acctKey(b); }
function sameVideo(a, b)   { return vidKey(a) === vidKey(b); }

/* 把一组案例按「账号 → 视频(取最新版)」归并，返回账号分组数组（保持传入顺序）*/
function groupByAccount(cases) {
  const order = [], map = new Map();
  cases.forEach(c => {
    const k = acctKey(c);
    if (!map.has(k)) { map.set(k, []); order.push(k); }
    map.get(k).push(c);
  });
  return order.map(k => {
    const list = map.get(k);
    const vids = new Map();
    list.forEach(c => {
      const vk = vidKey(c), cur = vids.get(vk);
      if (!cur || (c.analyzed_at || '') > (cur.analyzed_at || '')) vids.set(vk, c);
    });
    const videos = [...vids.values()].sort((a, b) => (b.analyzed_at || '').localeCompare(a.analyzed_at || ''));
    return { key: k, account: videos[0].account_name, type: videos[0].account_type, videos, latest: videos[0] };
  });
}

function getFilteredCases() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const sort = document.getElementById('sort-select').value;
  const ver  = document.getElementById('version-select').value;

  let list = allCases.filter(c => {
    if (activePlatform && (c.platform || '') !== activePlatform) return false;
    if (activeType && c.account_type !== activeType) return false;
    if (ver && c.probe_version !== ver) return false;
    if (q) {
      const hay = [c.account_name, c.ai_summary, c.video_title, ...(c.tags || [])].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  list.sort((a, b) => {
    if (sort === 'followers-desc') return (b.follower || 0) - (a.follower || 0);
    if (sort === 'followers-asc')  return (a.follower || 0) - (b.follower || 0);
    return (b.analyzed_at || '').localeCompare(a.analyzed_at || '');
  });

  return list;
}

function renderCards() {
  filteredCases = getFilteredCases();
  const grid  = document.getElementById('cards-grid');
  const empty = document.getElementById('empty-state');
  const q     = document.getElementById('search-input').value.trim().toLowerCase();

  grid.innerHTML = '';

  const fcEl = document.getElementById('filter-count');
  const isFiltered = activePlatform || activeType || q || document.getElementById('version-select').value;
  if (isFiltered) {
    fcEl.style.display = '';
    fcEl.textContent = `已筛选 ${filteredCases.length} / 共 ${allCases.length} 个案例`;
  } else {
    fcEl.style.display = 'none';
  }

  if (filteredCases.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  // 按账号聚合：同账号多视频 → 账号卡（可展开）；单视频 → 普通卡
  groupByAccount(filteredCases).forEach(g => {
    if (g.videos.length > 1) grid.appendChild(buildAccountCard(g, q));
    else                     grid.appendChild(buildCard(g.latest, q));
  });

  if (currentCase) markActiveCard(currentCase.run_id);
}

/* 账号卡：同账号多条视频折叠展示，可展开看每条 */
function buildAccountCard(g, q) {
  const div = document.createElement('div');
  div.className = 'case-card account-card';
  div.dataset.acctKey = g.key;

  const pCfg = PLATFORM_CONFIG[g.latest.platform || ''] || null;
  if (pCfg) div.innerHTML += `<div class="platform-badge ${pCfg.cls}">${pCfg.emoji} ${escHtml(pCfg.label)}</div>`;
  div.innerHTML += `<div class="acct-count-badge">📹 ${g.videos.length} 条视频</div>`;

  const style = getTypeBadgeStyle(g.type);
  div.innerHTML += `<div><span class="type-badge" style="background:${style.bg};color:${style.color};">${escHtml(g.type || '未知类型')}</span></div>`;
  div.innerHTML += `<div class="card-account">${highlight(g.account || '—', q)}</div>`;
  div.innerHTML += `<div class="card-followers">粉丝 <strong>${fmtFollowers(g.latest.follower)}</strong> &nbsp;·&nbsp; 均赞 ${fmtFollowers(g.latest.avg_like)} &nbsp;·&nbsp; 共 ${g.videos.length} 条视频分析</div>`;

  // 展开/收起 视频列表
  const listId = 'acct-vids-' + g.key.replace(/[^a-zA-Z0-9]/g, '').slice(0, 16);
  const vidsHtml = g.videos.map(v => {
    const ps = polishStatus(v.polish);
    return `<div class="acct-vid-item" data-run-id="${escHtml(v.run_id)}">
      <div class="avi-title">${highlight(v.video_title || '（无标题）', q)}</div>
      <div class="avi-meta"><span>👍 ${fmtNum(v.video_like)}</span><span>${fmtDateTime(v.analyzed_at).slice(5,16)}</span><span class="icon-item ${ps.cls}" style="font-size:10px">${ps.icon}</span></div>
    </div>`;
  }).join('');
  div.innerHTML += `<div class="acct-toggle" data-list="${listId}">▸ 展开 ${g.videos.length} 条视频</div>`;
  div.innerHTML += `<div class="acct-vid-list" id="${listId}" style="display:none">${vidsHtml}</div>`;

  // 展开/收起
  div.querySelector('.acct-toggle').addEventListener('click', e => {
    e.stopPropagation();
    const list = div.querySelector('.acct-vid-list');
    const open = list.style.display !== 'none';
    list.style.display = open ? 'none' : 'block';
    e.target.textContent = (open ? '▸ 展开 ' : '▾ 收起 ') + g.videos.length + ' 条视频';
  });
  // 点视频项进阅读
  div.querySelectorAll('.acct-vid-item').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const v = allCases.find(x => x.run_id === el.dataset.runId);
      if (v) enterReadMode(v);
    });
  });
  // 点卡片主体 = 进最新一条
  div.addEventListener('click', () => enterReadMode(g.latest));

  return div;
}

/* ============================================================
   卡片构建
   ============================================================ */
function buildCard(c, q) {
  const div = document.createElement('div');
  div.className = 'case-card';
  div.dataset.runId = c.run_id;
  div.addEventListener('click', () => enterReadMode(c));

  const pCfg = PLATFORM_CONFIG[c.platform || ''] || null;
  if (pCfg) div.innerHTML += `<div class="platform-badge ${pCfg.cls}">${pCfg.emoji} ${escHtml(pCfg.label)}</div>`;

  if (c.version_count > 1) div.innerHTML += `<div class="version-badge">v${c.version_count}</div>`;

  const style = getTypeBadgeStyle(c.account_type);
  div.innerHTML += `<div><span class="type-badge" style="background:${style.bg};color:${style.color};">${escHtml(c.account_type || '未知类型')}</span></div>`;
  div.innerHTML += `<div class="card-account">${highlight(c.account_name || '—', q)}</div>`;
  div.innerHTML += `<div class="card-followers">粉丝 <strong>${fmtFollowers(c.follower)}</strong> &nbsp;·&nbsp; 均赞 ${fmtFollowers(c.avg_like)} &nbsp;·&nbsp; 爆款比 ${c.burst_ratio != null ? c.burst_ratio + 'x' : '—'}</div>`;

  const ps = polishStatus(c.polish);
  const avIcon = c.has_av ? '<span class="icon-item info">🎥 视听✅</span>' : '<span class="icon-item">🎥 视听—</span>';
  const passIcon = c.validation_pass ? '<span class="icon-item ok">✅ 验收通过</span>' : '<span class="icon-item fail">❌ 有缺口</span>';
  div.innerHTML += `<div class="card-icons">${avIcon}<span class="icon-item ${ps.cls}">${ps.icon} ${escHtml(ps.label)}</span>${passIcon}</div>`;

  if (c.ai_summary) div.innerHTML += `<div class="card-summary">${highlight(c.ai_summary, q)}</div>`;

  if (c.tags && c.tags.length) {
    const tagsHtml = c.tags.map(t => `<span class="tag-pill" data-tag="${escHtml(t)}">${highlight(t, q)}</span>`).join('');
    div.innerHTML += `<div class="card-tags">${tagsHtml}</div>`;
  }

  div.innerHTML += `<div class="card-footer">
    <div class="card-meta">${fmtDate(c.analyzed_date || c.analyzed_at)}${c.report_chars ? ' · ' + c.report_chars.toLocaleString() + '字' : ''}</div>
    <div class="btn-detail">查看详情</div>
  </div>`;

  div.querySelectorAll('.tag-pill').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      document.getElementById('search-input').value = el.dataset.tag;
      renderCards();
    });
  });

  return div;
}

function markActiveCard(runId) {
  document.querySelectorAll('.case-card').forEach(el =>
    el.classList.toggle('card-active', el.dataset.runId === runId));
}

/* ============================================================
   模式切换
   ============================================================ */
function enterReadMode(c) {
  currentCase = c;
  activeTab   = 'report';
  readTypeFilter = '全部';

  document.body.classList.remove('mode-list');
  document.body.classList.add('mode-read');

  // header
  document.getElementById('read-account').textContent = '@' + (c.account_name || '—');
  document.getElementById('read-sub').textContent =
    [fmtFollowers(c.follower) + '粉', c.account_type, fmtDateTime(c.analyzed_at)].filter(Boolean).join(' · ');

  // 左侧导航
  updateReadSidebar(c);

  // Word 按钮 —— 两种模式行为不同，标签如实区分
  const wordBtn = document.getElementById('word-btn');
  if (isServerMode) {
    // 服务器模式：调 /open-file，系统默认程序(WPS/Pages)零下载直接打开
    wordBtn.onclick = e => { e.preventDefault(); openWordFile(c.run_id, wordBtn); };
    wordBtn.textContent = '📄 用 WPS/Pages 打开';
    wordBtn.title = '零下载 · 调用本地服务直接用系统默认程序打开 report.docx';
    document.getElementById('word-hint').innerHTML = '✅ 服务模式 · 点击零下载直开';
  } else {
    // file:// 双击模式：Chrome 必下载 docx，无法零下载直开（这是浏览器限制）
    wordBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = getDocxUrl(c.run_id); a.download = 'report.docx'; a.click();
    };
    wordBtn.textContent = '↓ 下载 Word 报告';
    wordBtn.title = '当前为离线双击模式，浏览器只能下载到本地（下载后双击用 WPS 打开）。\n想「点击即用 WPS 直接打开」？在 probe 目录运行：python3 hub/serve.py';
    document.getElementById('word-hint').innerHTML = '💡 离线模式下浏览器只能下载 · 想点击直开请跑 <code>serve.py</code>';
  }

  // tabs
  document.querySelectorAll('.rtab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'report'));

  // header nav
  updateReadHeaderNav(c);

  // 卡片高亮（在列表隐藏前做）
  markActiveCard(c.run_id);

  // URL
  const sp = new URLSearchParams(window.location.search);
  sp.set('case', c.run_id);
  history.pushState({}, '', '?' + sp.toString());

  // 渲染内容
  renderReadBody();
}

function exitReadMode() {
  document.body.classList.remove('mode-read');
  document.body.classList.add('mode-list');
  currentCase = null;
  markActiveCard('');
  document.getElementById('toc-list').innerHTML = '';

  const sp = new URLSearchParams(location.search);
  sp.delete('case');
  history.pushState({}, '', sp.toString() ? '?' + sp.toString() : location.pathname);
}

function updateReadHeaderNav(c) {
  const idx   = filteredCases.findIndex(x => x.run_id === c.run_id);
  const total = filteredCases.length;
  document.getElementById('hn-prev').disabled = (idx <= 0);
  document.getElementById('hn-next').disabled = (idx < 0 || idx >= total - 1);
  document.getElementById('read-nav-index').textContent = idx >= 0 ? `第 ${idx+1}/${total} 个` : '';
}

function updateReadSidebar(c) {
  // 类型 chips
  const types = ['全部', ...new Set(allCases.map(x => x.account_type).filter(Boolean))];
  const typeBar = document.getElementById('read-type-chips');
  typeBar.innerHTML = types.map(t => {

    return `<div class="read-type-chip ${readTypeFilter === t ? 'active' : ''}" data-type="${escHtml(t)}">${escHtml(label)}</div>`;
  }).join('');

      <div>${escHtml(x.account_name)}</div>
      <div class="rci-type">${escHtml(x.account_type || '—')}</div>
      <div class="rci-follower">${fmtFollowers(x.follower)}粉</div>
    </div>
  `).join('');
}

/* ============================================================
   阅读面板内容渲染
   ============================================================ */
function renderReadBody() {
  const body = document.getElementById('read-body');
  body.className = activeTab === 'report' ? '' : 'padded';

  if (activeTab === 'report') {
    renderReportTab(currentCase, body);

    body.innerHTML = renderDashboardTab(currentCase);

/* ── 内嵌报告（file:// 模式回退·解析一次缓存）── */
let _embeddedReports;
function getEmbeddedReport(runId) {
  if (_embeddedReports === undefined) {
    try {
      const el = document.getElementById('embedded-reports');
      _embeddedReports = el ? JSON.parse(el.textContent.trim()) : {};
    } catch (_) { _embeddedReports = {}; }
  }
  return _embeddedReports[runId] || null;
}

/* ── 报告全文（懒加载 + Shadow DOM）── */
async function renderReportTab(c, body) {
  if (reportCache[c.run_id] !== undefined) {
    injectShadowReport(body, c, reportCache[c.run_id]);
    return;
  }

  body.innerHTML = `<div style="padding:20px">
    <div class="skeleton wide"></div><div class="skeleton medium"></div>
    <div class="skeleton short" style="margin-bottom:20px"></div>
    <div class="skeleton wide"></div><div class="skeleton medium"></div>
    <div class="skeleton wide" style="margin-bottom:20px"></div>
  </div>`;

  if (!isServerMode) {
    // file:// 双击模式：从内嵌报告块取，无需 fetch，直接中间栏渲染
    const emb = getEmbeddedReport(c.run_id);
    reportCache[c.run_id] = emb ? { type: 'html', content: emb } : null;
    injectShadowReport(body, c, reportCache[c.run_id]);
    return;
  }

  let loaded = null, type = 'html';
  try {
    let res = await fetch(`../data/cases/${c.run_id}/report.html`, { cache: 'no-store' });
    if (res.ok) { loaded = await res.text(); }
    else {
      type = 'md';
      res = await fetch(`../data/cases/${c.run_id}/report.md`, { cache: 'no-store' });
      if (res.ok) loaded = await res.text();
    }
  } catch (_) {}

  reportCache[c.run_id] = loaded ? { type, content: loaded } : null;
  if (currentCase?.run_id === c.run_id && activeTab === 'report') {
    injectShadowReport(body, c, reportCache[c.run_id]);
    body.scrollTop = 0;
  }
}

function injectShadowReport(body, c, cached) {
  const tocList = document.getElementById('toc-list');
  tocList.innerHTML = '';

  if (!cached) {
    // 报告确实缺失（内嵌块无此 run_id 且非服务器模式）— 页内提示，不跳转
    body.className = 'padded';
    body.innerHTML = `
      ${c.video_title ? `<div style="margin-bottom:14px"><div class="video-title-box">${escHtml(c.video_title)}</div></div>` : ''}
      ${c.ai_summary ? `<div style="background:var(--blue-bg);border-left:3px solid var(--blue);padding:12px 14px;border-radius:0 8px 8px 0;margin-bottom:16px">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">AI 摘要</div>
        <div style="font-size:14px;font-weight:500;color:var(--text-dark)">${escHtml(c.ai_summary)}</div>
      </div>` : ''}
      <div style="padding:14px 16px;background:#FFF7ED;border-radius:8px;font-size:13px;color:var(--text-dark);line-height:1.7">
        <div style="font-weight:700;margin-bottom:6px">📄 本案例报告未内嵌</div>
        重新生成报告后，运行
        <code style="font-size:11px;background:#E2E8F0;padding:1px 6px;border-radius:3px">python3 hub/build_embed.py</code>
        即可把报告打包进页面，双击离线阅读；或运行
        <code style="font-size:11px;background:#E2E8F0;padding:1px 6px;border-radius:3px">python3 hub/serve.py</code>
        启动服务后访问。
      </div>`;
    return;
  }

  if (cached.type === 'html') {
    body.innerHTML = '';
    const host = document.createElement('div');
    host.style.cssText = 'height:100%;display:block';
    body.appendChild(host);

    try {
      const shadow = host.attachShadow({ mode: 'open' });
      const parser = new DOMParser();
      const doc = parser.parseFromString(cached.content, 'text/html');
      const styles = [...doc.querySelectorAll('style,link[rel="stylesheet"]')];
      const bodyContent = doc.body ? doc.body.innerHTML : cached.content;
      const styleHtml = styles.map(s => s.outerHTML).join('\n');
      shadow.innerHTML = styleHtml + `<div id="report-root" style="padding:16px">${bodyContent}</div>`;
      setTimeout(() => buildTocFromShadow(shadow, tocList, body), 100);
    } catch (e) {
      const blob = new Blob([cached.content], { type: 'text/html;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      body.innerHTML = `
        <div style="padding:6px 12px;font-size:11px;color:var(--text-muted);background:var(--green-bg);border-bottom:1px solid var(--border)">
          <span style="background:var(--green-bg);color:var(--green);padding:1px 7px;border-radius:4px;font-weight:600">HTML 精美排版</span>
        </div>
        <iframe src="${url}" style="width:100%;height:calc(100% - 30px);border:none;background:#fff;display:block" onload="URL.revokeObjectURL('${url}')"></iframe>`;
    }
    return;
  }

  // MD fallback
  const container = document.createElement('div');
  container.className = 'md-content';
  container.innerHTML = renderMarkdown(cached.content);
  body.innerHTML = `<div style="font-size:11px;color:var(--text-muted);padding:6px 12px;background:#FFF7ED;border-bottom:1px solid var(--border)">
    <span style="background:#FFF7ED;color:var(--orange);padding:1px 7px;border-radius:4px;font-weight:600">Markdown 模式</span>
    <span style="margin-left:6px">report.html 未找到</span>
  </div>`;
  body.appendChild(container);
  buildTocFromDom(container, tocList, body);
}

/* ── TOC 构建 ── */
function buildTocFromShadow(shadow, tocEl, scrollEl) {
  const root = shadow.getElementById('report-root') || shadow;
  const headings = [...root.querySelectorAll('h1,h2,h3')];
  buildTocItems(headings, tocEl, scrollEl, (h, id) => {
    h.id = id;
    return () => shadow.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function buildTocFromDom(container, tocEl, scrollEl) {
  const headings = [...container.querySelectorAll('h1,h2,h3,h4')];
  buildTocItems(headings, tocEl, scrollEl, (h, id) => {
    h.id = id;
    return () => h.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function buildTocItems(headings, tocEl, scrollEl, makeScrollFn) {
  if (!headings.length) return;
  headings.forEach((h) => {
    const id = 'toc-h-' + (++tocIdCounter);
    const scrollFn = makeScrollFn(h, id);
    const item = document.createElement('div');
    const tag = h.tagName.toLowerCase();
    item.className = 'toc-item' + (tag === 'h3' || tag === 'h4' ? ' h3' : '');
    // 清洗：去 # · 前缀 + 去开头 emoji/符号，留纯标题，CSS 负责单行省略
    let txt = (h.textContent || '').replace(/^[#·\s]+/, '');
    txt = txt.replace(/^(?:[\u{1F000}-\u{1FAFF}\u{2190}-\u{27BF}\u{2B00}-\u{2BFF}️‍\s]+)/u, '').trim();
    txt = txt || '(无标题)';
    item.textContent = txt;
    item.title = txt;   // hover 显示完整标题
    item.addEventListener('click', () => {
      scrollFn();
      tocEl.querySelectorAll('.toc-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
    });
    tocEl.appendChild(item);
  });

  if (scrollEl && window.IntersectionObserver) {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id;
          const tocItems = [...tocEl.querySelectorAll('.toc-item')];
          const idx = headings.findIndex(h => h.id === id);
          tocItems.forEach((item, i) => item.classList.toggle('active', i === idx));
        }
      });
    }, { root: scrollEl, threshold: 0.1, rootMargin: '-10% 0px -70% 0px' });
    headings.forEach(h => { if (h.id) observer.observe(h); });
  }
}

/* ── 版本历史 Tab ── */
function renderHistoryTab(c) {
  if (!c.sec_uid && !c.account_name) {
    return '<div class="no-history">无法识别账号，无法查询同账号 / 历史版本。</div>';
  }

  // 同账号全部案例
  const acctCases = allCases.filter(x => sameAccount(x, c));

  // ① 同账号·其它视频（aweme_id 不同 → 不同分析对象，每条视频取最新版）
  const otherVidsMap = new Map();
  acctCases.filter(x => !sameVideo(x, c)).forEach(x => {
    const vk = vidKey(x), cur = otherVidsMap.get(vk);
    if (!cur || (x.analyzed_at || '') > (cur.analyzed_at || '')) otherVidsMap.set(vk, x);
  });
  const otherVids = [...otherVidsMap.values()]
    .sort((a, b) => (b.analyzed_at || '').localeCompare(a.analyzed_at || ''));

  // ② 本视频·历史版本（aweme_id 相同 → 真·重复分析，按时间倒序）
  const versions = acctCases.filter(x => sameVideo(x, c))
    .sort((a, b) => (b.analyzed_at || '').localeCompare(a.analyzed_at || ''));

  let html = '';

  // ── 段一：同账号其它视频 ──
  html += `<div class="hist-seg-title">🎬 同账号其它视频 <span class="hist-count">${otherVids.length}</span></div>`;
  if (otherVids.length === 0) {
    html += '<div class="no-history" style="margin:0 0 18px">该账号暂无其它视频分析。</div>';
  } else {
    html += '<div class="sibling-grid">' + otherVids.map(x => {
      const ps = polishStatus(x.polish);
      return `<div class="sibling-card" data-run-id="${escHtml(x.run_id)}">
        <div class="sib-title">${escHtml(x.video_title || '（无标题）')}</div>
        <div class="sib-meta"><span>👍 ${fmtNum(x.video_like)}</span><span>${fmtDateTime(x.analyzed_at).slice(5,16)}</span></div>
        <div class="sib-meta"><span class="icon-item ${ps.cls}" style="font-size:10px">${ps.icon} ${escHtml(ps.label)}</span></div>
      </div>`;
    }).join('') + '</div>';
  }

  // ── 段二：本视频历史版本 ──
  html += `<div class="hist-seg-title" style="margin-top:20px">🔄 本视频历史版本 <span class="hist-count">${versions.length}</span></div>`;
  if (versions.length <= 1) {
    html += '<div class="no-history" style="margin:0">本条视频目前仅此 1 次分析（尚无历史版本可对比）。</div>';
  } else {
    html += '<div class="timeline">' + versions.map(x => {
      const isCurrent = x.run_id === c.run_id;
      const ps = polishStatus(x.polish);
      return `
        <div class="timeline-item ${isCurrent ? 'current' : ''}" data-run-id="${escHtml(x.run_id)}">
          <div class="tl-date">${fmtDateTime(x.analyzed_at)}${isCurrent ? '<span class="tl-current-label">当前</span>' : ''}</div>
          <div class="tl-card">
            <div class="tl-version">${escHtml((x.probe_version || '').slice(0,18))}</div>
            <div class="tl-meta">
              <span>粉丝 ${fmtFollowers(x.follower)}</span>
              <span>均赞 ${fmtFollowers(x.avg_like)}</span>
              <span>${escHtml(ps.label)}</span>
              <span>${x.validation_pass ? '✅验收通过' : '❌有缺口'}</span>
            </div>
          </div>
        </div>`;
    }).join('') + '</div>';
  }

  return html;
}

/* ── Word 相关 ── */
function getDocxUrl(runId) {
  const loc = window.location.href;
  if (loc.startsWith('file://')) {
    const base = loc.replace(/[?#].*$/, '').replace(/\/hub\/[^/]+$/, '');
    return `${base}/data/cases/${runId}/report.docx`;
  }
  return `../data/cases/${runId}/report.docx`;
}

async function openWordFile(runId, btn) {
  const prev = btn.textContent;
  btn.textContent = '⏳ 打开中…';
  btn.style.pointerEvents = 'none';
  try {
    const res  = await fetch(`/open-file?run_id=${encodeURIComponent(runId)}`);
    const data = await res.json();
    if (data.ok) {
      btn.textContent = '✅ 已打开';
      setTimeout(() => { btn.textContent = prev; btn.style.pointerEvents = ''; }, 2000);
    } else {
      throw new Error(data.error || 'open failed');
    }
  } catch (err) {
    btn.textContent = prev;
    btn.style.pointerEvents = '';
    const a = document.createElement('a');
    a.href = getDocxUrl(runId); a.download = 'report.docx'; a.click();
  }
}

document.getElementById('read-case-list').addEventListener('click', e => {
  const item = e.target.closest('.read-case-item');
  if (!item) return;
  const found = allCases.find(c => c.run_id === item.dataset.runId);
  if (found) enterReadMode(found);
});

// 阅读模式 Tabs
document.getElementById('read-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.rtab');
  if (!tab) return;
  activeTab = tab.dataset.tab;
  document.querySelectorAll('.rtab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  renderReadBody();
});

/* 键盘快捷键 */
document.addEventListener('keydown', e => {
  const isReadMode = document.body.classList.contains('mode-read');
  const inInput    = document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA';

  // ESC
  if (e.key === 'Escape') {
    if (isReadMode) { exitReadMode(); }
    else {
      const si = document.getElementById('search-input');
      if (si.value) { si.value = ''; renderCards(); pushUrlParams(); }
    }
    return;
  }

  // / 聚焦搜索（列表模式）
  if (e.key === '/' && !isReadMode && !inInput) {
    e.preventDefault();
    document.getElementById('search-input').focus();
    return;
  }

  if (isReadMode && !inInput) {
    // ← → 切换 Tab
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const tabs = ['report', 'dashboard', 'history'];
      const idx  = tabs.indexOf(activeTab);
      let next   = idx + (e.key === 'ArrowRight' ? 1 : -1);
      if (next < 0) next = tabs.length - 1;
      if (next >= tabs.length) next = 0;
      switchReadTab(tabs[next]);
      return;
    }

    // 1/2/3 快切 Tab
    if (e.key === '1') { switchReadTab('report'); return; }
    if (e.key === '2') { switchReadTab('dashboard'); return; }
    if (e.key === '3') { switchReadTab('history'); return; }

    // A = 上一个
    if (e.key === 'a' || e.key === 'A') {
      const idx = filteredCases.findIndex(c => c.run_id === currentCase?.run_id);
      if (idx > 0) enterReadMode(filteredCases[idx - 1]);
      return;
    }

    // D = 下一个
    if (e.key === 'd' || e.key === 'D') {
      const idx = filteredCases.findIndex(c => c.run_id === currentCase?.run_id);
      if (idx >= 0 && idx < filteredCases.length - 1) enterReadMode(filteredCases[idx + 1]);
      return;
    }
  }
});

/* ============================================================
   启动
   ============================================================ */
loadData();
</script>
